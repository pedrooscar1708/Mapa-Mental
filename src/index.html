ne-height:2}.credit-box{margin-top:28px;padding:14px 18px;border:1.5px dashed var(--line);border-radius:4px;background:#fff;font-family:"Helvetica Neue",sans-serif;font-size:14px;line-height:1.6}.credit-box strong{color:var(--accent)}@media(max-width:720px){.page{padding:38px 22px;min-height:auto}.two-col{grid-template-columns:1fr;gap:18px}.h-big{font-size:28px!important}.h-section{font-size:20px}.cover{padding:50px 24px;min-height:auto}.cover .h-big{font-size:36px!important}.author{font-size:17px}.corner,.dots{transform:scale(.7)}}@media print{body{background:#fff}.topbar{display:none}.page{page-break-after:always;box-shadow:none;margin:0 auto;border:none;max-width:none;width:100%}.page:last-child{page-break-after:auto}}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a><button onclick="window.print()">Imprimir / Salvar PDF</button><div class="spacer"></div><small>Trabalho — Volume</small></div><section class="page cover"><div class="dots tl"></div><div class="corner tl"></div><h1 class="title-mono h-big">VOLUME</h1><div class="author">por Pedro Oscar</div><div class="subtitle">O combustível dos movimentos do mercado</div><div class="corner br"></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><div class="two-col"><div><h2 class="title-mono h-section">Tópicos<br/>de<br/>Abordagem</h2></div><div><ul class="topics"><li>O que é volume</li><li>Quando foi pro gráfico</li><li>Pra que serve</li><li>História completa</li><li>Quem usa volume hoje</li><li>Tipos de análise de volume</li><li>3 livros em inglês</li><li>3 livros em português</li><li>Curiosidades</li><li>Conclusão</li></ul></div></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">O que é volume</h2><div class="body-text"><p><strong>Volume</strong> é a <strong>quantidade total de ativos negociados</strong> num determinado período. Se 1 milhão de ações da Petrobras trocaram de mãos em um pregão, o volume daquele dia é 1 milhão. Simples assim.</p><div class="info-card gold"><h4>A regra de ouro: preço diz O QUÊ · volume diz QUANTO</h4><p>O preço mostra <em>onde</em> o mercado está. O volume mostra <em>com que força</em> ele está chegando lá. Um movimento de alta com pouco volume é frágil. Um movimento de alta com volume explosivo é confiável.</p></div><div class="quote">Volume precede preço. Quando há acumulação institucional, o volume aparece antes do movimento.<span class="attr">— Richard Wyckoff (parafraseado)</span></div><div class="vol-fig"><svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg"><line x1="40" y1="20" x2="40" y2="180" stroke="#27ae60" stroke-width="2"/><rect x="20" y="60" width="40" height="100" fill="#27ae60" stroke="#1a1a1a" stroke-width="1"/><line x1="40" y1="180" x2="40" y2="220" stroke="#27ae60" stroke-width="2"/><text x="40" y="20" font-family="Courier" font-size="10" text-anchor="middle" fill="#27ae60">+5%</text><line x1="120" y1="30" x2="120" y2="100" stroke="#c0392b" stroke-width="2"/><rect x="100" y="100" width="40" height="80" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/><line x1="120" y1="180" x2="120" y2="220" stroke="#c0392b" stroke-width="2"/><text x="120" y="20" font-family="Courier" font-size="10" text-anchor="middle" fill="#c0392b">-3%</text><line x1="200" y1="50" x2="200" y2="150" stroke="#27ae60" stroke-width="2"/><rect x="180" y="150" width="40" height="20" fill="#27ae60" stroke="#1a1a1a" stroke-width="1"/><line x1="200" y1="170" x2="200" y2="190" stroke="#27ae60" stroke-width="2"/><text x="200" y="40" font-family="Courier" font-size="10" text-anchor="middle" fill="#27ae60">+1%</text><line x1="280" y1="40" x2="280" y2="80" stroke="#27ae60" stroke-width="2"/><rect x="260" y="80" width="40" height="120" fill="#27ae60" stroke="#1a1a1a" stroke-width="1"/><line x1="280" y1="200" x2="280" y2="220" stroke="#27ae60" stroke-width="2"/><text x="280" y="30" font-family="Courier" font-size="10" text-anchor="middle" fill="#27ae60">+8%</text><rect x="20" y="240" width="40" height="35" fill="#22c55e" opacity="0.7"/><rect x="100" y="240" width="40" height="25" fill="#dc2626" opacity="0.7"/><rect x="180" y="240" width="40" height="8" fill="#22c55e" opacity="0.5"/><rect x="260" y="240" width="40" height="50" fill="#22c55e" opacity="0.9"/><text x="40" y="285" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#4a4a4a">alto</text><text x="120" y="285" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#4a4a4a">médio</text><text x="200" y="280" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#888">fraco!</text><text x="280" y="290" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#4a4a4a">muito alto</text><text x="380" y="240" font-family="Helvetica" font-size="10" fill="#4a4a4a">← preço</text><text x="380" y="260" font-family="Helvetica" font-size="10" fill="#4a4a4a">← volume</text></svg><div class="vol-caption">Velas de preço + barras de volume embaixo. Vela alta com volume fraco (3ª) = sinal de fraqueza.</div></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Quando foi pro gráfico</h2><div class="body-text"><p>O volume foi <strong>incorporado ao gráfico em camadas históricas</strong>. Cada época adicionou uma forma nova de visualizá-lo:</p><div class="info-card blue"><h4>Século XVIII · Japão</h4><p>Comerciantes de arroz já anotavam volume de contratos negociados em livros separados. Mas era <strong>tabela, não gráfico</strong>.</p></div><div class="info-card gold"><h4>1880-1900 · Charles Dow</h4><p>Primeira menção sistemática a volume na análise técnica ocidental. Dow escrevia: <em>"movimento sem volume não é confiável"</em>. Mas ainda em texto, não em gráfico.</p></div><div class="info-card green"><h4>1920-1930 · Richard Wyckoff</h4><p>O pai da análise de volume moderna. Foi quem <strong>popularizou as BARRAS DE VOLUME abaixo do gráfico de preço</strong> — formato que vemos até hoje em qualquer plataforma. Criou conceitos como acumulação, distribuição, climax volume.</p></div><div class="info-card red"><h4>1963 · Joseph Granville</h4><p>Inventou o <strong>OBV (On-Balance Volume)</strong> — o primeiro indicador matemático baseado em volume. Volume virou linha contínua no gráfico, não só barras.</p></div><div class="info-card purple"><h4>1988 · VWAP</h4><p>Berkowitz, Logue e Noser publicaram o paper que apresentou o <strong>VWAP (Volume Weighted Average Price)</strong>. Virou padrão institucional pra avaliar execução de ordens.</p></div><div class="info-card orange"><h4>Anos 2000-2010 · Volume Profile e Order Flow</h4><p>Plataformas começam a mostrar <strong>volume horizontal</strong> (por nível de preço, não por tempo). Surge o <em>Footprint Chart</em> — mostra volume de compra vs venda dentro de cada candle.</p></div><p>Hoje, qualquer plataforma gráfica (TradingView, MetaTrader, Profit) traz volume <strong>nativo</strong> — é a coisa mais básica depois do preço.</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Pra que serve</h2><div class="body-text"><p>Volume não é decoração no gráfico. Tem <strong>função operacional clara</strong>. Os 6 usos principais:</p><div class="info-card green"><h4>1. Confirmar tendências</h4><p>Alta com volume crescente = tendência forte. Alta com volume decrescente = tendência fraca, perto de exaustão.</p></div><div class="info-card red"><h4>2. Detectar divergências</h4><p>Preço fazendo topos mais altos com volume cada vez menor = <strong>divergência baixista</strong>. Sinal clássico de fim de movimento.</p></div><div class="info-card gold"><h4>3. Identificar reversões (climax)</h4><p>Volume <strong>explosivo</strong> em ponto extremo de tendência = capitulação. Geralmente marca o ponto de virada (vendedores ou compradores se esgotam).</p></div><div class="info-card blue"><h4>4. Validar rompimentos</h4><p>Rompimento de resistência/suporte <strong>com volume alto</strong> = rompimento genuíno. Com volume fraco = provável armadilha (fake breakout).</p></div><div class="info-card purple"><h4>5. Detectar atividade institucional</h4><p>Picos de volume <strong>sem notícia aparente</strong> sugerem entrada de "smart money" (dinheiro institucional). Wyckoff dedicou a vida a ler isso.</p></div><div class="info-card orange"><h4>6. Liquidez pra execução</h4><p>Ativos com volume alto = fáceis de entrar e sair. Ativos com volume baixo = caro pra operar (slippage, spread). <strong>Crítico pra day traders.</strong></p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">História completa</h2><div class="body-text"><div class="timeline"><div class="ev gold"><div class="date">~1700 · Japão</div><div class="title">Bolsa de Dojima · primeiras anotações</div><div class="desc">Comerciantes de arroz japoneses registravam quantidade negociada em livros separados. Volume já existia, mas como tabela.</div></div><div class="ev blue"><div class="date">1880-1900 · EUA</div><div class="title">Charles Dow integra volume à análise</div><div class="desc">Dow incorporou volume como <strong>princípio confirmador</strong> nos editoriais do WSJ. "Volume confirms trend" virou pilar da AT.</div></div><div class="ev green"><div class="date">1908-1934 · EUA</div><div class="title">Richard Wyckoff · o pai da análise de volume</div><div class="desc">Trader, editor do "Magazine of Wall Street", próximo de J.P. Morgan e Jay Gould. Desenvolveu o <strong>Método Wyckoff</strong>: leitura conjunta de preço + volume + fluxo institucional. Identificou as 4 fases do mercado (acumulação, mark-up, distribuição, mark-down).</div></div><div class="ev green"><div class="date">1948 · EUA</div><div class="title">Edwards &amp; Magee consolidam volume nos clássicos</div><div class="desc">"Technical Analysis of Stock Trends" dedica capítulos inteiros a volume como confirmador de padrões.</div></div><div class="ev red"><div class="date">1963 · EUA</div><div class="title">Joseph Granville cria o OBV</div><div class="desc">On-Balance Volume — primeiro indicador <strong>matematicamente derivado</strong> de volume. Soma volume em dias de alta, subtrai em dias de baixa. Virou clássico.</div></div><div class="ev red"><div class="date">1972-1980 · EUA</div><div class="title">Marc Chaikin e Larry Williams expandem</div><div class="desc">Chaikin Money Flow, Accumulation/Distribution Line, Williams Accumulation/Distribution — vários indicadores derivados de volume.</div></div><div class="ev purple"><div class="date">1988 · EUA</div><div class="title">VWAP virou padrão institucional</div><div class="desc">Paper acadêmico de Berkowitz, Logue e Noser apresenta o <strong>Volume Weighted Average Price</strong>. Vira métrica oficial de execução de grandes ordens.</div></div><div class="ev purple"><div class="date">Anos 1990-2000</div><div class="title">Volume Profile e Order Flow</div><div class="desc">Plataformas profissionais começam a mostrar volume <strong>por nível de preço</strong> (horizontal). Surge o <em>Footprint Chart</em> — volume de compra vs venda dentro de cada candle. Era da microestrutura de mercado.</div></div><div class="ev purple"><div class="date">Anos 2010 - hoje</div><div class="title">HFT e leitura algorítmica de volume</div><div class="desc">Algoritmos de alta frequência usam volume pra detectar liquidez e antecipar movimentos. <strong>Cripto</strong> traz nova era — mercados 24/7, volume global em tempo real.</div></div></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Quem usa volume hoje</h2><div class="body-text"><p>Praticamente <strong>todo trader profissional</strong> olha volume — mas cada estilo usa de um jeito diferente:</p><div class="who-grid"><div class="who"><h5>Day Traders</h5><p>Volume nos timeframes baixos (1min, 5min). Detectam picos pra entrar em movimentos explosivos.</p></div><div class="who"><h5>Swing Traders</h5><p>Volume em diário/semanal. Validam rompimentos de suporte/resistência. Buscam climax pra reversões.</p></div><div class="who"><h5>Wyckoff Traders</h5><p>Leem volume + preço como linguagem única. Identificam acumulação institucional antes do movimento.</p></div><div class="who"><h5>Order Flow Traders</h5><p>Usam Footprint e Volume Profile. Veem volume de compra vs venda em cada nível de preço — leitura microscópica.</p></div><div class="who"><h5>Institucionais</h5><p>VWAP / TWAP pra executar ordens grandes sem mover o mercado. Métrica oficial de "boa execução".</p></div><div class="who"><h5>Smart Money Concepts</h5><p>Escola recente (2020+). Usa volume pra mapear "liquidity grabs" — onde institucionais varrem stops.</p></div><div class="who"><h5>Algoritmos HFT</h5><p>Detectam picos de volume em milissegundos pra agir antes do mercado processar a informação.</p></div><div class="who"><h5>Cripto Traders</h5><p>Volume 24/7 entre múltiplas exchanges. Detectam manipulação (wash trading) via análise comparativa.</p></div></div><h3 class="h-sub">No Brasil</h3><p>Praticamente todo curso de AT brasileiro aborda volume — Vasco Mamede, Eduardo Matsura, Marcos Abe. <strong>Vasco fala bastante de "volume de exaustão"</strong> em suas aulas (doji longe das médias com volume mais alto dos últimos dias).</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Tipos de análise</h2><div class="body-text"><div class="info-card"><h4>Volume tradicional (barras)</h4><p>Barras coloridas embaixo do gráfico. Verde = volume em dia de alta, vermelho = dia de baixa. <strong>Forma mais básica e mais usada.</strong></p></div><div class="info-card red"><h4>OBV (On-Balance Volume)</h4><p>Linha cumulativa. Soma volume em altas, subtrai em baixas. Mostra <em>fluxo direcional acumulado</em>. Útil pra divergências preço × volume.</p></div><div class="info-card gold"><h4>Volume Profile (Perfil de Volume)</h4><p>Barras <strong>horizontais</strong> mostrando volume negociado em cada nível de preço. Identifica zonas de "valor" — onde o mercado passou mais tempo. <em>POC (Point of Control)</em> = nível com mais volume.</p></div><div class="info-card blue"><h4>VWAP (Volume Weighted Average Price)</h4><p>Preço médio ponderado pelo volume. Linha que aparece no gráfico mostrando "preço justo do dia". Institucionais querem comprar abaixo do VWAP e vender acima.</p></div><div class="info-card green"><h4>Footprint Chart (Order Flow)</h4><p>Mostra DENTRO de cada candle quantos compradores e vendedores atuaram em cada nível de preço. <strong>Leitura mais microscópica que existe.</strong> Pesado e técnico — uso institucional.</p></div><div class="info-card purple"><h4>Chaikin Money Flow / Accumulation-Distribution</h4><p>Indicadores que tentam medir pressão compradora vs vendedora combinando preço de fechamento com volume. Bom pra ver direção do fluxo.</p></div><div class="info-card orange"><h4>MFI (Money Flow Index)</h4><p>"RSI ponderado por volume". Oscila entre 0-100. Identifica zonas de sobrecompra/sobrevenda considerando o volume — mais robusto que RSI puro.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">3 livros em inglês</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>How I Trade and Invest in Stocks and Bonds</h4><div class="meta">Richard D. Wyckoff — 1924</div><p>O livro fundador da análise moderna de volume. Wyckoff descreve seu método de leitura conjunta de preço + volume + fluxo de mãos fortes. <strong>Como funciona:</strong> apresenta os ciclos de mercado (acumulação → mark-up → distribuição → mark-down) e ensina a identificar cada fase pela assinatura de volume. Base de tudo que veio depois.</p></div><div class="book"><div class="num">02</div><h4>A Complete Guide to Volume Price Analysis</h4><div class="meta">Anna Coulling — 2013</div><p>Síntese moderna da Volume Spread Analysis (VSA — herdeira de Wyckoff via Tom Williams). <strong>Como funciona:</strong> ensina a "ler" cada candle com seu volume associado, identificando 30+ padrões. Excelente didática, muitos exemplos.</p></div><div class="book"><div class="num">03</div><h4>Trades About to Happen</h4><div class="meta">David Weis — 2013</div><p>Wyckoff aplicado ao trading moderno. <strong>Como funciona:</strong> apresenta o conceito de "Weis Wave" — uma forma de medir o volume acumulado dentro de cada onda de movimento. Conecta Wyckoff clássico com plataformas atuais (Ninjatrader, Sierra Chart).</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">3 livros em português</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Análise Técnica dos Mercados Financeiros</h4><div class="meta">John J. Murphy — Editora Saraiva (tradução)</div><p>A bíblia traduzida. Dedica <strong>capítulos completos a volume</strong> — barras, OBV, Money Flow, divergências. <em>Como funciona:</em> apresenta volume dentro do contexto geral da AT, mostrando como combinar com tendências, padrões e indicadores. Leitura obrigatória.</p></div><div class="book"><div class="num">02</div><h4>Análise Técnica — A Teoria de Dow e as Ondas de Elliott</h4><div class="meta">Eduardo Matsura — autor brasileiro</div><p>Adapta os conceitos clássicos ao mercado nacional. <strong>Volume aparece como pilar de confirmação</strong> em vários capítulos, com exemplos de ações da B3. Bom pra entender o comportamento do volume na bolsa brasileira (que é menor e mais errática que a americana).</p></div><div class="book"><div class="num">03</div><h4>Dominando o Volume (e variações)</h4><div class="meta">Tom Williams / Gavin Holmes — edições em português (raras)</div><p>VSA (Volume Spread Analysis) traduzido. Algumas editoras brasileiras publicaram versões nos anos 2010. <strong>Como funciona:</strong> ensina a ler "padrões de volume" como assinatura institucional. Edição limitada — pode ser difícil de encontrar fisicamente; muitos compram a versão original em inglês.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Curiosidades</h2><div class="body-text"><p><strong>O termo "Smart Money" nasceu da análise de volume.</strong> Wyckoff observou que grandes operadores ("composite operator") deixavam <em>rastros de volume</em> antes dos movimentos. Quem aprendia a ler esses rastros estava ao lado do dinheiro "esperto".</p><p><strong>Wyckoff trabalhava DIRETAMENTE com institucionais.</strong> Era próximo de J.P. Morgan, Jay Gould e Charles Schwab. Não tirou suas teorias do nada — vinha de DENTRO do sistema.</p><p><strong>Granville fazia previsões públicas que moviam o mercado.</strong> Nos anos 1980-81, suas cartas eram tão influentes que CONSEGUIA criar movimentos quando publicava. Em janeiro/81, sua previsão de venda derrubou o Dow ~25 pontos em um dia.</p><p><strong>VWAP foi criado pelos ACADÊMICOS, não pelos traders.</strong> Paper publicado em 1988 no Journal of Finance por 3 professores. Só depois virou padrão de Wall Street.</p><p><strong>No flash crash de 06/05/2010, o volume normal foi multiplicado por 10 em minutos.</strong> Dow caiu 1000 pontos em 5 minutos e voltou. Algoritmos detectaram o spike e amplificaram a queda.</p><p><strong>Tesla em 2021 teve dias com volume = 100% do market cap.</strong> Cada ação trocou de mãos UMA VEZ em um único dia. Coisa absurda — só possível com retail trader frenético.</p><p><strong>Volume no Forex é estimado.</strong> Como não há clearing central (cada banco tem seu livro), o volume "real" é desconhecido. As plataformas mostram "tick volume" (número de mudanças de preço) — uma aproximação.</p><p><strong>Cripto inventou o "wash trading volume".</strong> Exchanges sem regulação inflam volume artificialmente. Estima-se que ~70% do volume reportado em algumas exchanges é falso. Por isso só vale olhar volume das exchanges sérias (Binance, Coinbase).</p><p><strong>Volume mais explosivo da história individual:</strong> GameStop em janeiro/2021 chegou a girar 200% do float em um dia. WallStreetBets vs hedge funds — a guerra que mudou Wall Street.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section" style="text-align:center">Conclusão</h2><div class="body-text" style="max-width:760px;margin:0 auto"><p>Volume é a <strong>variável esquecida</strong> do trader iniciante. Todo mundo olha preço, médias, fibo — mas poucos sabem realmente ler volume.</p><p>Quando você aprende, três coisas mudam:</p><div class="info-card green"><h4>1. Você vê fraqueza antes dos outros</h4><p>Preço subindo com volume caindo = alerta cedo de reversão. Quem só olha preço só vê o sinal quando já caiu.</p></div><div class="info-card gold"><h4>2. Você diferencia movimento real de armadilha</h4><p>Rompimento de resistência com volume = real. Sem volume = falso. Simples assim. Economiza muito stop.</p></div><div class="info-card blue"><h4>3. Você "vê" os institucionais</h4><p>Picos de volume sem notícia = alguém grande entrou ou saiu. Quem lê esses sinais opera ao lado das "mãos fortes" — não contra.</p></div><p style="text-align:center;margin-top:28px;font-style:italic;color:var(--muted)">"Sem volume, o gráfico é um desenho. Com volume, ele vira uma história." — síntese da escola Wyckoff.</p></div><div class="dots br"></div></section><section class="page"><div class="dots tl"></div><div class="corner tl"></div><h2 class="title-mono h-section">Contato</h2><div class="contact-block"><p><strong>insta:</strong> pedrooscar1708</p><p><strong>email:</strong> pedrooscar1708@gmail.com</p><p><strong>telefone:</strong> (11) 96342-6694</p></div><div class="credit-box"><strong>Trabalho realizado com auxílio do Claude (Anthropic)</strong> — IA usada para pesquisa, organização e redação. Conteúdo baseado em fontes públicas: Richard Wyckoff (<em>How I Trade and Invest</em>), Anna Coulling (<em>A Complete Guide to Volume Price Analysis</em>), papers acadêmicos sobre VWAP, e registros históricos sobre Granville, Chaikin e a evolução dos indicadores de volume.</div><div class="corner br"></div></section><div style="height:40px"></div></body></html></script>

",monospace;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.h-big{font-size:42px;margin:0;letter-spacing:.18em}.h-section{font-family:"Courier New",monospace;font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 24px 0}.h-sub{font-size:17px;font-weight:700;margin:22px 0 8px 0}.author{font-size:22px;color:var(--muted);font-weight:400;margin-top:8px}.body-text{font-size:15px;line-height:1.65}.body-text p{margin:0 0 10px 0}.body-text strong{color:var(--ink)}ul.topics{list-style:none;padding:0;margin:0;font-family:"Courier New",monospace;font-size:14.5px}ul.topics li{padding:5px 0 5px 24px;position:relative;text-transform:uppercase}ul.topics li::before{content:"•";position:absolute;left:4px;top:5px;font-size:18px}.cover{min-height:640px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px 60px}.cover .h-big{font-size:56px}.cover .subtitle{font-size:17px;color:var(--blue);margin-top:14px;font-style:italic;letter-spacing:.04em}.cover .formula{font-family:"Courier New",monospace;color:var(--accent);margin-top:18px;font-size:14px;letter-spacing:.04em}.two-col{display:grid;grid-template-columns:1fr 1.4fr;gap:40px;align-items:start}.info-card{background:#fff;border:1px solid #d8cdb7;border-left:4px solid var(--line);border-radius:4px;padding:14px 18px;margin:12px 0}.info-card.gold{border-left-color:var(--gold)}.info-card.red{border-left-color:var(--accent)}.info-card.green{border-left-color:var(--green)}.info-card.blue{border-left-color:var(--blue)}.info-card.purple{border-left-color:var(--purple)}.info-card.orange{border-left-color:var(--orange)}.info-card h4{margin:0 0 6px 0;font-size:15px;font-weight:700}.info-card p{margin:0;font-size:14px;line-height:1.55}.info-card ul{margin:4px 0 0 0;padding-left:20px}.info-card ul li{font-size:14px;margin:3px 0;line-height:1.45}.quote{background:#fff;border-left:4px solid var(--gold);padding:12px 18px;margin:14px 0;font-style:italic;font-size:14.5px;color:var(--muted)}.quote .attr{display:block;margin-top:6px;font-size:12px;color:#888;font-style:normal}.book{background:#fff;border:1px solid #d8cdb7;border-left:4px solid var(--line);border-radius:4px;padding:14px 18px;margin-bottom:14px}.book .num{font-family:"Courier New",monospace;font-weight:700;color:var(--accent);font-size:14px}.book h4{margin:4px 0;font-size:16px;font-weight:700}.book .meta{color:var(--muted);font-size:13px;margin-bottom:8px;font-style:italic}.book p{margin:0;font-size:14px;line-height:1.55}.ifr-fig{background:#fff;border:1px solid #d8cdb7;border-radius:6px;padding:24px;margin:16px 0;text-align:center}.ifr-fig svg{max-width:100%;height:auto}.ifr-caption{font-size:13px;color:var(--muted);margin-top:10px;font-style:italic}.zone{display:grid;grid-template-columns:1fr;gap:8px;margin:14px 0}.zone-row{display:flex;align-items:center;gap:14px;padding:10px 14px;background:#fff;border:1px solid #d8cdb7;border-radius:4px;font-size:14px}.zone-row .num{font-family:"Courier New",monospace;font-weight:700;min-width:60px;font-size:18px}.zone-row.over{border-left:4px solid var(--accent)}.zone-row.over .num{color:var(--accent)}.zone-row.mid{border-left:4px solid var(--muted)}.zone-row.mid .num{color:var(--muted)}.zone-row.under{border-left:4px solid var(--green)}.zone-row.under .num{color:var(--green)}.career{position:relative;padding-left:26px;margin-top:16px}.career::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--blue)}.career .ev{position:relative;margin-bottom:14px}.career .ev::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--blue)}.career .year{font-family:"Courier New",monospace;font-size:12px;color:var(--blue);font-weight:700}.career .title{font-size:14px;font-weight:600;margin:2px 0}.career .desc{font-size:13px;color:var(--muted);line-height:1.45}.contact-block{font-family:"Courier New",monospace;font-size:16px;line-height:2}.credit-box{margin-top:28px;padding:14px 18px;border:1.5px dashed var(--line);border-radius:4px;background:#fff;font-family:"Helvetica Neue",sans-serif;font-size:14px;line-height:1.6}.credit-box strong{color:var(--accent)}@media(max-width:720px){.page{padding:38px 22px;min-height:auto}.two-col{grid-template-columns:1fr;gap:18px}.h-big{font-size:28px!important}.h-section{font-size:20px}.cover{padding:50px 24px;min-height:auto}.cover .h-big{font-size:36px!important}.author{font-size:17px}.corner,.dots{transform:scale(.7)}}@media print{body{background:#fff}.topbar{display:none}.page{page-break-after:always;box-shadow:none;margin:0 auto;border:none;max-width:none;width:100%}.page:last-child{page-break-after:auto}}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a><button onclick="window.print()">Imprimir / Salvar PDF</button><div class="spacer"></div><small>Trabalho — IFR (RSI)</small></div><section class="page cover"><div class="dots tl"></div><div class="corner tl"></div><h1 class="title-mono h-big">IFR</h1><div class="author">por Pedro Oscar</div><div class="subtitle">Índice de Força Relativa · Relative Strength Index</div><div class="formula">RSI = 100 − ( 100 ÷ ( 1 + RS ) )</div><div class="corner br"></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><div class="two-col"><div><h2 class="title-mono h-section">Tópicos<br/>de<br/>Abordagem</h2></div><div><ul class="topics"><li>O que é o IFR</li><li>Quem criou · J. Welles Wilder</li><li>História</li><li>Como funciona (matemática)</li><li>Como se usa (estratégias)</li><li>Divergências</li><li>3 livros em inglês</li><li>3 livros em português</li><li>Curiosidades</li><li>Conclusão</li></ul></div></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">O que é o IFR</h2><div class="body-text"><p>O <strong>IFR</strong> (Índice de Força Relativa) — em inglês <strong>RSI (Relative Strength Index)</strong> — é um <strong>oscilador de momentum</strong> que mede a <em>velocidade e a magnitude</em> dos movimentos de preço.</p><div class="info-card blue"><h4>Em uma frase</h4><p>O IFR não mede pra onde o preço vai — mede com que <strong>força</strong> ele está indo. Quando a força chega no extremo, geralmente o movimento perde fôlego.</p></div><h3 class="h-sub">A escala 0 a 100</h3><div class="zone"><div class="zone-row over"><div class="num">70+</div><div><strong>Sobrecompra (overbought)</strong> — força compradora exagerada. Sinal de cautela para compras, possível reversão para baixa.</div></div><div class="zone-row mid"><div class="num">30–70</div><div><strong>Zona neutra</strong> — força equilibrada. A linha de <strong>50</strong> divide tendência altista (acima) de baixista (abaixo).</div></div><div class="zone-row under"><div class="num">−30</div><div><strong>Sobrevenda (oversold)</strong> — força vendedora exagerada. Sinal de cautela para vendas, possível reversão para alta.</div></div></div><div class="ifr-fig"><svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="40" width="400" height="160" fill="none" stroke="#1a1a1a" stroke-width="1"/><line x1="40" y1="80" x2="440" y2="80" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/><text x="50" y="76" font-family="Courier" font-size="11" fill="#c0392b">70 sobrecompra</text><line x1="40" y1="120" x2="440" y2="120" stroke="#888" stroke-width="0.8" stroke-dasharray="2,3"/><text x="50" y="116" font-family="Courier" font-size="11" fill="#888">50</text><line x1="40" y1="160" x2="440" y2="160" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,3"/><text x="50" y="174" font-family="Courier" font-size="11" fill="#27ae60">30 sobrevenda</text><path d="M40 145 Q90 95, 140 70 T240 110 Q290 170, 340 165 T440 75" stroke="#2c5282" stroke-width="2" fill="none"/><text x="240" y="25" font-family="Helvetica" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">IFR · 14 períodos</text></svg><div class="ifr-caption">Linha do IFR oscilando entre 0 e 100, com as zonas 70/30 marcadas.</div></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Quem criou · Wilder</h2><div class="body-text"><p><strong>J. Welles Wilder Jr. (1935–2021)</strong>, americano de Norris (Tennessee). Era engenheiro mecânico e trabalhou com imobiliárias antes de migrar para o mercado financeiro nos anos 1970.</p><div class="info-card blue"><h4>Trajetória</h4><ul><li><strong>Formação:</strong> engenharia mecânica</li><li><strong>Carreira:</strong> imobiliária → trader → autor → consultor</li><li><strong>Empresa:</strong> presidente do Trend Research em Greensboro (NC)</li><li><strong>Falecimento:</strong> 2021 (aos 86 anos)</li></ul></div><h3 class="h-sub">Os 5 indicadores de um único livro</h3><p>Em <strong>1978</strong>, Wilder publicou <em>"New Concepts in Technical Trading Systems"</em> — e nesse <strong>único livro</strong> apresentou <strong>cinco indicadores</strong> que viraram clássicos absolutos da análise técnica, todos usados até hoje em qualquer plataforma:</p><div class="info-card"><ul><li><strong>RSI</strong> (Relative Strength Index) — IFR</li><li><strong>ADX</strong> (Average Directional Index) — força de tendência</li><li><strong>ATR</strong> (Average True Range) — volatilidade</li><li><strong>Parabolic SAR</strong> — stop loss dinâmico</li><li><strong>DMI</strong> (Directional Movement Index) — direção</li></ul></div><div class="quote">Pouquíssimas pessoas na história da análise técnica criaram <strong>um</strong> indicador clássico. Wilder criou cinco. <em>Em um único livro.</em><span class="attr">— consenso entre analistas técnicos</span></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">História</h2><div class="body-text"><div class="career"><div class="ev"><div class="year">~1960s</div><div class="title">Wilder migra para o mercado</div><div class="desc">Vindo da engenharia mecânica e do mercado imobiliário, começa a estudar análise técnica e a desenvolver indicadores próprios.</div></div><div class="ev"><div class="year">1972</div><div class="title">Funda o Trend Research</div><div class="desc">Cria sua empresa de pesquisa em Greensboro, Carolina do Norte. Começa a sistematizar seus indicadores.</div></div><div class="ev"><div class="year">1978</div><div class="title">Publica "New Concepts in Technical Trading Systems"</div><div class="desc">O livro que mudaria a análise técnica. RSI, ADX, ATR, Parabolic SAR e DMI nascem juntos — 130 páginas que viraram referência mundial.</div></div><div class="ev"><div class="year">1980s</div><div class="title">RSI se populariza junto com os computadores</div><div class="desc">Plataformas como MetaStock e TradeStation tornam o cálculo automático. RSI deixa de ser feito à mão e se espalha pelo mundo.</div></div><div class="ev"><div class="year">1987</div><div class="title">Wilder publica "Adam Theory of Markets"</div><div class="desc">Sistema esotérico baseado em ciclos — controverso. Vendeu por valores altos a poucos clientes, gerando fortuna pessoal.</div></div><div class="ev"><div class="year">1990s-2000s</div><div class="title">Variações do RSI surgem</div><div class="desc">Stochastic RSI (Chande/Kroll, 1994), Connors RSI (Larry Connors), RSI exponencial, RSI suavizado — derivados que tentam melhorar o original.</div></div><div class="ev"><div class="year">2021</div><div class="title">Wilder falece aos 86 anos</div><div class="desc">Seu legado: praticamente todo trader do mundo usa pelo menos UM dos 5 indicadores que ele criou.</div></div></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Como funciona (a matemática)</h2><div class="body-text"><p>O cálculo é simples na essência — compara <strong>quanto o preço subiu</strong> com <strong>quanto caiu</strong> num período:</p><div class="info-card gold"><h4>Fórmula em 3 passos</h4><p><strong>1)</strong> Calcula a média de <em>ganhos</em> e a média de <em>perdas</em> num período N (Wilder usou 14).<br><strong>2)</strong> RS = média de ganhos ÷ média de perdas.<br><strong>3)</strong> RSI = 100 − (100 ÷ (1 + RS)).</p></div><h3 class="h-sub">Por que 14 períodos?</h3><p>Wilder escolheu <strong>14</strong> porque na época equivalia a <strong>duas semanas úteis</strong> de pregão (5 dias × 2 semanas + 4 dias = ~14). Não foi cálculo mágico — foi praticidade.</p><h3 class="h-sub">Variações de período</h3><div class="info-card"><ul><li><strong>14 (padrão Wilder):</strong> equilíbrio sinal × ruído. Para swing trade.</li><li><strong>9 ou 7:</strong> mais sensível, mais sinais (e mais ruído). Para day trade.</li><li><strong>21 ou 25:</strong> mais suave, menos sinais. Para análise de longo prazo.</li></ul></div><h3 class="h-sub">Vantagem matemática</h3><p>Diferente de osciladores como o estocástico, o RSI <strong>nunca atinge exatamente 0 ou 100</strong> — a fórmula impede. Isso o torna mais estável e menos suscetível a "saltos" em movimentos extremos.</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Como se usa (estratégias)</h2><div class="body-text"><p>5 jeitos clássicos de usar o IFR, do mais simples ao mais avançado:</p><div class="info-card red"><h4>1. Zonas de sobrecompra e sobrevenda</h4><p>O uso mais conhecido (e mais arriscado!). RSI &gt; 70 = sobrecompra; &lt; 30 = sobrevenda. <strong>Cuidado:</strong> em tendências fortes, o RSI fica em zona extrema por dias — usar isolado é receita pra prejuízo.</p></div><div class="info-card gold"><h4>2. Divergências (o uso MAIS poderoso)</h4><p>Quando preço e RSI divergem, é sinal forte de exaustão. Tem duas direções:<br><strong>Bullish:</strong> preço faz fundo mais baixo, RSI faz fundo mais alto → possível reversão para cima.<br><strong>Bearish:</strong> preço faz topo mais alto, RSI faz topo mais baixo → possível reversão para baixo.</p></div><div class="info-card green"><h4>3. Cruzamento da linha 50</h4><p>A linha de 50 divide momentum altista (acima) de baixista (abaixo). Cruzar acima da 50 = sinal de tendência altista; cruzar abaixo = baixista. Bom como filtro de direção.</p></div><div class="info-card blue"><h4>4. Falha de oscilação (failure swing)</h4><p>RSI entra em sobrecompra (&gt;70), recua, mas <strong>não volta a romper o topo anterior</strong>. Sinal forte de reversão — Wilder considerava este o uso mais confiável.</p></div><div class="info-card purple"><h4>5. Suporte e resistência no próprio RSI</h4><p>Tracar linhas horizontais nos níveis onde o RSI costuma reagir (ex: 60 em tendência altista, 40 em baixista). Funciona como "S/R do oscilador".</p></div><div class="quote">O Vasco usa muito o IFR pra <strong>confirmar contagem de Elliott</strong> — quando a contagem está dúbia, divergência no IFR é o filtro decisivo.<span class="attr">— integração com o curso</span></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Divergências (a essência)</h2><div class="body-text"><p>Divergência é o uso mais valioso do IFR — vou explicar por que e como ler.</p><h3 class="h-sub">O que é divergência</h3><p>Quando o <strong>preço</strong> e o <strong>IFR</strong> fazem coisas <strong>contraditórias</strong> no mesmo período. É o mercado sinalizando que a força está mudando antes do preço virar.</p><div class="info-card red"><h4>Divergência de baixa (bearish)</h4><p>Preço faz <strong>topos mais altos</strong>, mas IFR faz <strong>topos mais baixos</strong>. O preço sobe, mas com menos força a cada vez. Geralmente precede uma reversão para baixo.</p></div><div class="info-card green"><h4>Divergência de alta (bullish)</h4><p>Preço faz <strong>fundos mais baixos</strong>, mas IFR faz <strong>fundos mais altos</strong>. O preço cai, mas com menos força a cada vez. Geralmente precede reversão para cima.</p></div><div class="ifr-fig"><svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg"><text x="240" y="22" font-family="Helvetica" font-size="12" font-weight="700" text-anchor="middle">Divergência de BAIXA · preço sobe, IFR cai</text><rect x="20" y="40" width="440" height="100" fill="none" stroke="#1a1a1a" stroke-width="0.5"/><text x="30" y="55" font-family="Courier" font-size="10" fill="#888">PREÇO</text><path d="M30 110 L110 80 L170 100 L240 60 L310 90 L380 40 L450 75" stroke="#c0392b" stroke-width="2" fill="none"/><circle cx="240" cy="60" r="3" fill="#c0392b"/><circle cx="380" cy="40" r="3" fill="#c0392b"/><line x1="240" y1="60" x2="380" y2="40" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/><text x="385" y="35" font-family="Helvetica" font-size="10" fill="#c0392b">topo + alto</text><rect x="20" y="160" width="440" height="100" fill="none" stroke="#1a1a1a" stroke-width="0.5"/><text x="30" y="175" font-family="Courier" font-size="10" fill="#888">IFR</text><line x1="20" y1="180" x2="460" y2="180" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="3,3"/><text x="465" y="184" font-family="Courier" font-size="9" fill="#c0392b">70</text><path d="M30 230 L110 200 L170 215 L240 185 L310 210 L380 195 L450 215" stroke="#2c5282" stroke-width="2" fill="none"/><circle cx="240" cy="185" r="3" fill="#2c5282"/><circle cx="380" cy="195" r="3" fill="#2c5282"/><line x1="240" y1="185" x2="380" y2="195" stroke="#2c5282" stroke-width="1" stroke-dasharray="3,3"/><text x="385" y="208" font-family="Helvetica" font-size="10" fill="#2c5282">topo - baixo</text></svg><div class="ifr-caption">Preço fazendo topo mais alto enquanto IFR faz topo mais baixo = alerta de reversão para baixo.</div></div><h3 class="h-sub">Cuidados na leitura</h3><div class="info-card"><ul><li>Divergência <strong>não é gatilho de entrada</strong> — é alerta. Esperar confirmação por outro critério (candle, S/R, média).</li><li>Funciona melhor em <strong>tempos gráficos maiores</strong> (diário, semanal). No 1min é puro ruído.</li><li>Divergência pode persistir por <strong>muito tempo</strong> antes do preço virar. Não compre/venda só por causa dela.</li><li>Em tendências MUITO fortes, divergências falham frequentemente. Use com leitura de contexto.</li></ul></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">3 livros em inglês</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>New Concepts in Technical Trading Systems</h4><div class="meta">J. Welles Wilder Jr. — 1978</div><p>O livro original onde o RSI nasceu, junto com ADX, ATR, Parabolic SAR e DMI. Só 130 páginas, mas mudou a análise técnica para sempre. <strong>Como funciona:</strong> apresenta cada indicador com a fórmula, exemplos manuais (era antes de computadores) e estratégias de uso. Direto, prático, sem enrolação.</p></div><div class="book"><div class="num">02</div><h4>Cybernetic Analysis for Stocks and Futures</h4><div class="meta">John F. Ehlers — 2004</div><p>Engenheiro aeroespacial aplicando processamento de sinais à análise técnica. <strong>Como funciona:</strong> apresenta variações refinadas do RSI usando filtros digitais (CyberCycle, Fisher Transform of RSI). Para quem quer levar o oscilador além do clássico.</p></div><div class="book"><div class="num">03</div><h4>Trading Systems and Methods</h4><div class="meta">Perry J. Kaufman — várias edições (1978 → 2020)</div><p>Bíblia ampla de sistemas de trading. Tem um <strong>capítulo dedicado ao RSI</strong> com backtests detalhados, comparação com outros osciladores e estudos estatísticos sobre eficácia em diferentes mercados. Material denso, técnico, para o leitor sério.</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">3 livros em português</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Análise Técnica dos Mercados Financeiros</h4><div class="meta">John J. Murphy — Editora Saraiva (tradução)</div><p>A bíblia traduzida tem <strong>capítulo dedicado ao RSI</strong>, mostrando o cálculo, as zonas clássicas (70/30) e exemplos de divergências em ações americanas. <strong>Como funciona:</strong> apresenta o RSI dentro do conjunto maior de osciladores (junto com Estocástico, MACD, Williams %R) — útil para entender as diferenças.</p></div><div class="book"><div class="num">02</div><h4>Análise Técnica Explicada</h4><div class="meta">Martin Pring — tradução brasileira</div><p>Outro clássico traduzido. Pring se especializa em <strong>integração entre AT e ciclos de mercado</strong>. <strong>Como funciona:</strong> apresenta o RSI conectado a ciclos econômicos, mostrando que divergências do RSI tendem a coincidir com fim de fases de ciclo. Visão mais macro do oscilador.</p></div><div class="book"><div class="num">03</div><h4>Análise Técnica — A Teoria de Dow e as Ondas de Elliott</h4><div class="meta">Eduardo Matsura — autor brasileiro</div><p>Adapta os clássicos ao mercado nacional. <strong>Como funciona:</strong> apresenta o RSI com exemplos práticos da <strong>B3</strong> (Petrobras, Vale, Bovespa), incluindo divergências em períodos específicos. Bom para quem quer ver o oscilador funcionando em ações brasileiras (que têm comportamento diferente do mercado americano).</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Curiosidades</h2><div class="body-text"><p><strong>Wilder usava o RSI principalmente como sinal de SAÍDA, não de entrada.</strong> Para ele, o RSI ajudava a perceber quando uma posição estava perto da exaustão — o "tempo de sair da festa", não o "tempo de chegar".</p><p><strong>O número 14 é arbitrário.</strong> Wilder escolheu por equivaler a 2 semanas de pregão. Não há "estudo matemático" por trás — é só convenção. Funciona, mas qualquer período pode ser ajustado.</p><p><strong>Wilder também era místico.</strong> Em 1987 publicou "Adam Theory of Markets" — sistema baseado em ciclos cósmicos e relações esotéricas. Vendeu poucas cópias mas a preços altíssimos. Trader de números E místico ao mesmo tempo.</p><p><strong>"New Concepts" tem só 130 páginas.</strong> Para um livro que mudou a análise técnica para sempre, é curtíssimo. Wilder odiava enrolação — vai direto ao ponto, sem teoria acadêmica.</p><p><strong>RSI ≠ Relative Strength.</strong> Existe confusão clássica: "Relative Strength" (sem o Index) é uma técnica que compara <em>uma ação contra outra</em> (ou contra um índice). "Relative Strength Index" (com o Index) é o oscilador do Wilder. <strong>São coisas diferentes.</strong></p><p><strong>StochRSI = "RSI do RSI".</strong> Tushar Chande e Stanley Kroll, em 1994, criaram o Stochastic RSI — aplicaram a fórmula do oscilador estocástico em cima dos valores do próprio RSI. Mais rápido e sensível, mas com mais sinais falsos.</p><p><strong>Praticamente toda plataforma do mundo tem RSI nativo.</strong> Não precisa instalar nada — TradingView, MetaTrader, NinjaTrader, Profit, ProRealTime, Bloomberg, Reuters... todos têm de fábrica.</p><p><strong>Wilder ganhou fortuna vendendo seu sistema "Adam Theory" a preços altíssimos.</strong> Cobrava algo como US$ 2.500 por uma cópia da teoria nos anos 1980 (~US$ 7.000 hoje). Muita gente comprou. Ele ficou bem rico.</p><p><strong>O IFR é uma das poucas ferramentas que não tem patente.</strong> Wilder publicou abertamente — qualquer um pode usar, programar, modificar. Isso ajudou enormemente a popularização.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section" style="text-align:center">Conclusão</h2><div class="body-text" style="max-width:760px;margin:0 auto"><p>O IFR é um dos <strong>3 osciladores mais usados do mundo</strong> (junto com Estocástico e MACD) — e geralmente o mais simples de entender.</p><div class="info-card blue"><h4>O que o RSI faz bem</h4><p>Identifica <strong>exaustão de movimento</strong>. Avisa quando a força está acabando antes do preço virar. É um "termômetro" do momentum.</p></div><div class="info-card red"><h4>O que o RSI NÃO faz bem</h4><p>Não funciona em tendências muito fortes (fica em zona extrema por dias). Não é gatilho de entrada — é confirmador. Sozinho, não basta.</p></div><div class="info-card gold"><h4>A regra de ouro</h4><p><strong>Divergências &gt; zonas de sobrecompra/sobrevenda.</strong> A maioria do valor do RSI está na leitura de divergência. Quem só olha &gt;70/&lt;30 perde dinheiro em tendências fortes.</p></div><div class="info-card green"><h4>Combine sempre</h4><p>Use o RSI como <strong>filtro de confluência</strong>, nunca isolado. RSI + S/R + médias + candle = leitura robusta. RSI sozinho = sinal frágil.</p></div><p style="text-align:center;margin-top:28px;font-style:italic;color:var(--muted)">"O RSI não diz pra onde o mercado vai — diz com que força ele está indo. E quando a força acaba, o resto é só questão de tempo."</p></div><div class="dots br"></div></section><section class="page"><div class="dots tl"></div><div class="corner tl"></div><h2 class="title-mono h-section">Contato</h2><div class="contact-block"><p><strong>insta:</strong> pedrooscar1708</p><p><strong>email:</strong> pedrooscar1708@gmail.com</p><p><strong>telefone:</strong> (11) 96342-6694</p></div><div class="credit-box"><strong>Trabalho realizado com auxílio do Claude (Anthropic)</strong> — IA usada para pesquisa, organização e redação. Conteúdo baseado em fontes públicas: J. Welles Wilder Jr. (<em>New Concepts in Technical Trading Systems</em>, 1978), John J. Murphy, Martin Pring, e registros biográficos sobre Wilder publicados após sua morte em 2021.</div><div class="corner br"></div></section><div style="height:40px"></div></body></html></script>
<script type="text/html" id="doc-obv"><!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><title>OBV — por Pedro Oscar</title><style>body{margin:0;padding:40px;background:#f7f1e7;color:#1a1a1a;font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.6;max-width:820px;margin:0 auto}h1{font-family:"Courier New",monospace;letter-spacing:.18em;text-transform:uppercase;font-size:48px;color:#27ae60;text-align:center;margin-top:60px}h2{font-family:"Courier New",monospace;letter-spacing:.12em;text-transform:uppercase;font-size:24px;color:#1a1a1a;margin-top:40px;border-bottom:2px solid #27ae60;padding-bottom:8px}.subtitle{text-align:center;color:#4a4a4a;font-style:italic;margin-bottom:40px}.topbar{position:fixed;top:0;left:0;right:0;background:rgba(247,241,231,.95);padding:10px 18px;border-bottom:1px solid #d8cdb7;z-index:50}.topbar a,.topbar button{background:#fff;border:1px solid #d8cdb7;padding:6px 12px;border-radius:6px;text-decoration:none;color:#1a1a1a;cursor:pointer;font-size:13px}.book{background:#fff;border:1px solid #d8cdb7;border-left:4px solid #c0392b;border-radius:4px;padding:14px 18px;margin:12px 0}.book h4{margin:0}.book .meta{color:#4a4a4a;font-size:13px;font-style:italic}.info{background:#fff;border:1px solid #d8cdb7;border-left:4px solid #27ae60;border-radius:4px;padding:14px 18px;margin:12px 0}body{padding-top:80px}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a> <button onclick="window.print()">Imprimir / PDF</button></div><h1>OBV</h1><p class="subtitle">On-Balance Volume · "Volume precede preço" — Joseph Granville, 1963</p><h2>O que é o OBV</h2><p>O <strong>OBV (On-Balance Volume)</strong> — em português "Volume em Saldo" — é um dos primeiros indicadores baseados em volume da era moderna. Soma volume nos dias de alta, subtrai nos dias de baixa, criando uma linha cumulativa que mostra a pressão direcional acumulada.</p><div class="info"><strong>Tese central:</strong> Volume precede preço. Quando vemos o OBV subindo enquanto o preço está lateral, há acumulação institucional acontecendo antes do movimento.</div><h2>Quem criou · Joseph Granville</h2><p><strong>Joseph Ensign Granville (1923–2013)</strong>, americano nascido em Yonkers, NY. Foi analista técnico, editor do "The Granville Market Letter" e um dos personagens mais teatrais da história de Wall Street. Em <strong>6 de janeiro de 1981</strong>, sua única recomendação de "sell everything" derrubou ~24 pontos do Dow em poucas horas — o famoso "Granville Effect".</p><h2>História</h2><p>Granville publicou <em>"Granville's New Key to Stock Market Profits"</em> em <strong>1963</strong>, apresentando o OBV pela primeira vez. Nos anos 80, com a popularização dos computadores (MetaStock, TradeStation), o OBV virou indicador padrão em todas as plataformas. Marc Chaikin criou a Accumulation/Distribution Line (1981) como uma evolução. Granville faleceu em 2013 aos 90 anos.</p><h2>Como funciona (matemática)</h2><div class="info">Se fechamento de hoje &gt; ontem: <strong>OBV = OBV anterior + Volume de hoje</strong><br>Se fechamento de hoje &lt; ontem: <strong>OBV = OBV anterior − Volume de hoje</strong><br>Se fechamento de hoje = ontem: <strong>OBV não muda</strong></div><p>O valor absoluto não importa — o que importa é a <strong>direção</strong> da linha e como ela se comporta em relação ao preço.</p><h2>Como se usa (5 estratégias)</h2><p><strong>1. Confirmação de tendência:</strong> Preço subindo + OBV subindo = tendência altista confirmada. Preço subindo + OBV caindo = alerta de fraqueza.</p><p><strong>2. Divergências (mais valioso):</strong> Preço fazendo topos mais altos, OBV fazendo topos mais baixos = divergência bearish (sinal de exaustão). O contrário = divergência bullish.</p><p><strong>3. Quebra de linha no OBV antes do preço:</strong> Tracar linhas de tendência no próprio OBV. Quando rompem, o preço costuma seguir.</p><p><strong>4. Acumulação/distribuição (Wyckoff):</strong> Preço lateral + OBV subindo = acumulação. Preço lateral + OBV caindo = distribuição. Antecipa rompimentos.</p><p><strong>5. Confirmação de breakout:</strong> Rompimento de S/R com OBV além do topo/fundo anterior = rompimento genuíno. Sem isso = possível armadilha.</p><h2>3 Livros em Inglês</h2><div class="book"><h4>Granville's New Key to Stock Market Profits</h4><div class="meta">Joseph E. Granville — 1963</div><p>O livro original onde o OBV foi apresentado. Estilo direto, com centenas de exemplos.</p></div><div class="book"><h4>A Complete Guide to Volume Price Analysis</h4><div class="meta">Anna Coulling — 2013</div><p>Síntese moderna da Volume Spread Analysis com capítulos dedicados ao OBV.</p></div><div class="book"><h4>Technical Analysis of the Financial Markets</h4><div class="meta">John J. Murphy — 1999</div><p>Capítulo dedicado ao OBV comparando-o com outros indicadores de volume.</p></div><h2>3 Livros em Português</h2><div class="book"><h4>Análise Técnica dos Mercados Financeiros</h4><div class="meta">John J. Murphy — Editora Saraiva (tradução)</div><p>Capítulo dedicado ao OBV. Leitura obrigatória pra trader brasileiro.</p></div><div class="book"><h4>Análise Técnica Explicada</h4><div class="meta">Martin Pring — tradução brasileira</div><p>Apresenta o OBV conectado a ciclos econômicos e smart money.</p></div><div class="book"><h4>Análise Técnica — A Teoria de Dow e as Ondas de Elliott</h4><div class="meta">Eduardo Matsura — autor brasileiro</div><p>Exemplos da B3 mostrando como o OBV se comporta em ações brasileiras.</p></div><h2>Curiosidades</h2><p>• Em 1981 Granville derrubou o Dow com uma única previsão.<br>• Granville vestia fantasias teatrais em palestras.<br>• Errou completamente o bull market de 1982.<br>• "If it's obvious, it's obviously wrong" — sua frase mais famosa.<br>• O OBV foi um dos primeiros indicadores incluídos em todos os softwares de AT.<br>• Marc Chaikin melhorou o OBV criando a Accumulation/Distribution Line.<br>• OBV é menos preciso em forex (volume estimado, não real).</p><h2>Conclusão</h2><p>O OBV é um dos indicadores mais simples e elegantes da análise técnica. Granville pegou uma ideia fundamental — <em>volume precede preço</em> — e transformou em fórmula prática. Use SEMPRE em conjunto com outros critérios (IFR, S/R, candle). Quando OBV E IFR mostram divergência juntos, é um dos sinais mais fortes que existe.</p><div class="info" style="margin-top:40px;text-align:center;font-style:italic">"O OBV não diz quando comprar — diz se tem alguém grande comprando ou vendendo antes do mercado perceber."</div><h2 style="margin-top:60px">Contato</h2><p style="font-family:'Courier New',monospace;line-height:2"><strong>insta:</strong> pedrooscar1708<br><strong>email:</strong> pedrooscar1708@gmail.com<br><strong>telefone:</strong> (11) 96342-6694</p><div style="margin-top:28px;padding:14px 18px;border:1.5px dashed #1a1a1a;border-radius:4px;background:#fff;font-size:14px"><strong style="color:#c0392b">Trabalho realizado com auxílio do Claude (Anthropic)</strong> — IA usada para pesquisa, organização e redação. Conteúdo baseado em Joseph Granville e fontes técnicas.</div></body></html></script>

function id() { return "n_" + Math.random().toString(36).slice(2, 10); }

function _migrateDocs(node) {
  if (node.text) {
    const lower = node.text.toLowerCase();
    for (const key in KNOWN_DOCS) {
      if (lower.indexOf(key) !== -1) {
        const expected = KNOWN_DOCS[key];
        const cur = (node.doc || "").replace(".html", "");
        if (cur !== expected) node.doc = expected;
      }
    }
  }
  if (node.children) for (const c of node.children) _migrateDocs(c);
}

function save() {

function load() {

let saveIndicatorTimer = null;

  clearTimeout(saveIndicatorTimer);
