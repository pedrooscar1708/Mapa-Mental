e:normal}.phases-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.phase{background:#fff;border:2px solid #d8cdb7;border-radius:8px;padding:18px;text-align:center;position:relative;overflow:hidden}.phase .ribbon{position:absolute;top:0;left:0;right:0;padding:6px;font-family:"Courier New",monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff}.phase.f1{border-color:var(--accent)}.phase.f1 .ribbon{background:var(--accent)}.phase.f2{border-color:var(--orange)}.phase.f2 .ribbon{background:var(--orange)}.phase.f3{border-color:var(--green)}.phase.f3 .ribbon{background:var(--green)}.phase .body{margin-top:36px}.phase .pct{font-family:"Courier New",monospace;font-size:32px;font-weight:700;line-height:1}.phase.f1 .pct{color:var(--accent)}.phase.f2 .pct{color:var(--orange)}.phase.f3 .pct{color:var(--green)}.phase .lbl{font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}.phase .desc{font-size:13px;color:var(--ink);margin-top:10px;line-height:1.4}.principle-list{counter-reset:p;list-style:none;padding:0;margin:14px 0}.principle-list li{counter-increment:p;background:#fff;border:1px solid #d8cdb7;border-left:4px solid var(--purple);border-radius:4px;padding:12px 14px 12px 48px;margin-bottom:8px;position:relative;font-size:14px;line-height:1.5}.principle-list li::before{content:counter(p,decimal-leading-zero);position:absolute;left:14px;top:12px;font-family:"Courier New",monospace;font-weight:700;color:var(--purple);font-size:14px}.calc-box{background:#fff;border:1px solid #d8cdb7;border-radius:6px;padding:18px 22px;margin:14px 0;font-family:"Courier New",monospace}.calc-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e0d4ba;font-size:13.5px}.calc-row:last-child{border-bottom:none}.calc-row .label{color:var(--muted)}.calc-row .val{font-weight:700;color:var(--ink)}.calc-row.total{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:15px}.calc-row.total .val{color:var(--green);font-size:17px}.vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.vs-card{background:#fff;border:1px solid #d8cdb7;border-radius:6px;padding:16px}.vs-card h4{margin:0 0 8px 0;font-size:14px;font-family:"Courier New",monospace;letter-spacing:.06em;text-transform:uppercase}.vs-card.amador{border-top:3px solid var(--accent)}.vs-card.amador h4{color:var(--accent)}.vs-card.profissional{border-top:3px solid var(--green)}.vs-card.profissional h4{color:var(--green)}.vs-card ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55}.vs-card ul li{margin-bottom:4px}.book{background:#fff;border:1px solid #d8cdb7;border-left:4px solid var(--line);border-radius:4px;padding:14px 18px;margin-bottom:14px}.book .num{font-family:"Courier New",monospace;font-weight:700;color:var(--accent);font-size:14px}.book h4{margin:4px 0;font-size:16px;font-weight:700}.book .meta{color:var(--muted);font-size:13px;margin-bottom:8px;font-style:italic}.book p{margin:0;font-size:14px;line-height:1.55}.contact-block{font-family:"Courier New",monospace;font-size:16px;line-height:2}.credit-box{margin-top:28px;padding:14px 18px;border:1.5px dashed var(--line);border-radius:4px;background:#fff;font-family:"Helvetica Neue",sans-serif;font-size:14px;line-height:1.6}.credit-box strong{color:var(--accent)}@media(max-width:720px){.page{padding:38px 22px;min-height:auto}.two-col{grid-template-columns:1fr;gap:18px}.h-big{font-size:28px!important}.h-section{font-size:20px}.cover{padding:50px 24px;min-height:auto}.cover .h-big{font-size:30px!important}.author{font-size:17px}.corner,.dots{transform:scale(.7)}.phases-grid{grid-template-columns:1fr;gap:10px}.vs-grid{grid-template-columns:1fr}}@media print{body{background:#fff}.topbar{display:none}.page{page-break-after:always;box-shadow:none;margin:0 auto;border:none;max-width:none;width:100%}.page:last-child{page-break-after:auto}}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a><button onclick="window.print()">Imprimir / Salvar PDF</button><div class="spacer"></div><small>Trabalho — Gerenciamento de Risco e Mentalidade</small></div><section class="page cover"><div class="dots tl"></div><div class="corner tl"></div><h1 class="title-mono h-big">GERENCIAMENTO DE RISCO<br/>E MENTALIDADE</h1><div class="author">por Pedro Oscar</div><div class="subtitle">Módulo 4 · Dólar Futuro · Alpha Trading</div><div class="corner br"></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><div class="two-col"><div><h2 class="title-mono h-section">Tópicos<br/>de<br/>Abordagem</h2></div><div><ul class="topics"><li>A mentalidade dos 1.000 pontos</li><li>As 3 fases do risco</li><li>7 princípios — Mark Douglas</li><li>Exemplo prático: R$ 500k</li><li>Amador × Profissional</li><li>Livros de referência</li><li>Conclusão</li></ul></div></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">A mentalidade dos 1.000 pontos</h2><div class="body-text"><p>Antes de qualquer técnica, é preciso desconstruir a ideia de que trader bom é o que faz fortuna todo dia. <strong>Não é.</strong></p><div class="info-card purple"><h4>O número que muda tudo</h4><p>Se você conseguir uma média de <strong>1.000 pontos por mês</strong> no índice (12.000 pontos no ano), você terá <strong>uma das melhores performances do mercado</strong>.</p></div><p>O segredo para isso virar dinheiro de verdade <em>não está</em> no número de pontos. Está no <strong>gerenciamento</strong> — que é o que permite aumentar o tamanho da mão com segurança.</p><div class="quote">Trader iniciante quer fazer mais pontos. Trader profissional quer ter mais contratos com a mesma técnica.<span class="attr">— resumo da tese central</span></div><p>1.000 pontos com 1 contrato é uma coisa. 1.000 pontos com 50 contratos é <strong>50x mais dinheiro</strong> — e é exatamente isso que o gerenciamento bem feito permite.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">As 3 fases do risco</h2><div class="body-text"><p>Toda jornada do trader passa por 3 fases distintas, definidas pelo <strong>% de risco por operação</strong>. Quanto MENOR o risco, MAIS profissional. <em>Quanto menor a alavancagem, melhor.</em></p><div class="phases-grid"><div class="phase f1"><div class="ribbon">Fase 1</div><div class="body"><div class="pct">≥ 2%</div><div class="lbl">Alavancagem</div><div class="desc"><strong>"Tudo ou nada"</strong><br/>Capital pequeno (R$ 5k–10k)</div></div></div><div class="phase f2"><div class="ribbon">Fase 2</div><div class="body"><div class="pct">1–1.5%</div><div class="lbl">Consolidação</div><div class="desc"><strong>Transição</strong><br/>Capital ~R$ 100k</div></div></div><div class="phase f3"><div class="ribbon">Fase 3</div><div class="body"><div class="pct">≤ 0.5%</div><div class="lbl">Consistência</div><div class="desc"><strong>Profissional</strong><br/>Alavancagem ideal</div></div></div></div><h3 class="h-sub">Fase 1 — Alavancagem (≥ 2%)</h3><div class="info-card red"><h4>Perfil — "tudo ou nada"</h4><ul><li>Aplicada a capitais pequenos (R$ 5k a R$ 10k) que, se perdidos, não destroem a vida financeira</li><li>É <strong>onde a maioria quebra</strong></li><li>Operar com risco acima de 2% torna a recuperação de uma semana ruim <strong>matematicamente quase impossível</strong></li><li>Use esta fase apenas com um <strong>objetivo financeiro claro de SAIR dela</strong></li><li>Se errar sequências de trades aqui, será forçado a tirar mais dinheiro do bolso</li></ul></div><h3 class="h-sub">Fase 2 — Consolidação (1% a 1.5%)</h3><div class="info-card orange"><h4>Perfil — transição</h4><ul><li>Recomendada para quem já atingiu capital próximo de <strong>R$ 100.000</strong></li><li>Risco menor → menos alavancado</li><li>Objetivo: começar a buscar <strong>tranquilidade operacional</strong></li><li>Diminuir a exposição agressiva</li></ul></div><h3 class="h-sub">Fase 3 — Consistência (≤ 0.5%)</h3><div class="info-card green"><h4>Perfil — profissional · alavancagem ideal</h4><ul><li>O objetivo final de todo trader</li><li>É onde <strong>o dinheiro trabalha pra você</strong></li><li>Foco em <strong>proteger o capital</strong>, não em ganhar muito por trade</li><li>Risco/retorno: arriscar 0.5% para retornos de 1%, 2%, 5% ou mais</li><li>0.5% já representa um valor financeiro que qualquer pessoa mediana consideraria uma boa quantia</li></ul></div><div class="quote">Quanto menor a alavancagem, melhor. Profissional desalavanca; amador alavanca.<span class="attr">— princípio central</span></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">7 princípios · Mark Douglas</h2><div class="body-text"><p>Os 7 princípios da consistência operacional, do livro <strong>Trading in The Zone</strong>:</p><ol class="principle-list"><li>Identificar <strong>objetivamente</strong> as suas oportunidades.</li><li><strong>Predefinir o risco</strong> de cada trade.</li><li>Aceitar completamente o risco — e, se o mercado se virar contra a sua posição, <strong>fechar</strong>.</li><li>Agir sobre as suas oportunidades <strong>sem precipitações ou hesitações</strong>.</li><li><strong>Tomar as suas mais-valias</strong> quando o mercado possibilitar.</li><li>Monitorar a sua <strong>susceptibilidade para cometer erros</strong>.</li><li>Compreender a absoluta necessidade destes princípios de consistência e, por consequência, <strong>nunca os violar</strong>.</li></ol><div class="quote">Esses 7 princípios não são sugestões. São o sistema operacional do trader profissional.<span class="attr">— Mark Douglas (parafraseado)</span></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Exemplo prático · R$ 500k</h2><div class="body-text"><p>Como estruturar uma operação <strong>profissional</strong> para gerar riqueza real, sem alavancagem absurda:</p><div class="calc-box"><div class="calc-row"><span class="label">1. Capital total alocado</span><span class="val">R$ 500.000,00</span></div><div class="calc-row"><span class="label">2. Em renda fixa (CDB liq. diária / Tesouro Selic)</span><span class="val">R$ 500.000,00</span></div><div class="calc-row"><span class="label">3. Rendimento aprox. (~9.6% a.a.)</span><span class="val">~0.8% a.m.</span></div><div class="calc-row"><span class="label">4. Risco por trade (0.5% do capital)</span><span class="val">R$ 2.500,00</span></div><div class="calc-row"><span class="label">5. Contratos de índice operados</span><span class="val">50 contratos</span></div><div class="calc-row"><span class="label">6. Stop loss</span><span class="val">250 pontos = R$ 2.500</span></div><div class="calc-row"><span class="label">7. Take profit</span><span class="val">250 pontos = R$ 2.500</span></div></div><h3 class="h-sub">A matemática final</h3><div class="calc-box"><div class="calc-row"><span class="label">Cenário: 1.000 pontos líquidos no mês com 50 contratos</span><span class="val">R$ 10.000 / mês</span></div><div class="calc-row"><span class="label">Lucro do trade no ano (12 × 10k)</span><span class="val">R$ 120.000</span></div><div class="calc-row"><span class="label">Lucro da renda fixa no ano</span><span class="val">~R$ 50.000</span></div><div class="calc-row total"><span class="label">LUCRO ANUAL TOTAL</span><span class="val">~R$ 170.000</span></div><div class="calc-row total"><span class="label">RENTABILIDADE SOBRE O CAPITAL</span><span class="val">~35% a 40%</span></div></div><p style="margin-top:16px"><strong>O ponto-chave:</strong> esse trader nunca arrisca mais que 0.5% num trade. Se a semana for ruim, perde 2-3% e segue na operação. Se o mês for ruim, perde 5-6% e <em>continua tendo capital pra trabalhar</em>. <em>É isso que constrói riqueza no longo prazo.</em></p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Amador × Profissional</h2><div class="body-text"><p>Existem dois jogos completamente diferentes sendo jogados na mesma tela:</p><div class="vs-grid"><div class="vs-card amador"><h4>Amador · Jogo do Clique</h4><ul><li>Opera todo dia <strong>pelo prazer do risco</strong></li><li>Quer "estar no jogo" o tempo todo</li><li>Foco em cliques, ação, adrenalina</li><li>Decisão emocional</li><li>Resultado: <strong>inconsistência</strong></li></ul></div><div class="vs-card profissional"><h4>Profissional · Jogo da Performance</h4><ul><li>Opera apenas para <strong>cumprir o plano</strong></li><li>Aceita ficar fora quando não há setup</li><li>Foco em longo prazo e processo</li><li>Decisão técnica, fria</li><li>Resultado: <strong>consistência matemática</strong></li></ul></div></div><div class="quote">Em novembro eu atingi a meta anual. Em dezembro fiz <strong>zero cliques</strong>. O amador não consegue fazer isso.<span class="attr">— exemplo do palestrante</span></div><h3 class="h-sub">A decisão diária</h3><div class="info-card purple"><p>Ser um trader de longo prazo é uma <strong>escolha feita todas as manhãs</strong>. Não se decide isso uma vez por mês — decide-se <em>toda vez que se senta na frente da tela</em>.</p></div><h3 class="h-sub">Não brigue com a matemática</h3><p>Mesmo traders com <strong>alta taxa de acerto</strong> quebram se ignorarem o gerenciamento. O mercado muda, as sequências de perdas chegam — e quem não tem matemática a favor, sai do jogo.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Livros de referência</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Trading in The Zone</h4><div class="meta">Mark Douglas</div><p>O livro de cabeceira sobre psicologia e disciplina operacional. Apresenta os <strong>7 princípios da consistência</strong> que viraram referência mundial. <strong>Como funciona:</strong> trabalha a mentalidade de probabilidades — você não precisa estar certo num trade específico, precisa executar o seu sistema centenas de vezes com disciplina.</p></div><div class="book"><div class="num">02</div><h4>O Trader Disciplinado</h4><div class="meta">Mark Douglas</div><p>Versão mais prática e didática que "Trading in The Zone". <strong>Como funciona:</strong> aprofunda o conceito de disciplina operacional, com exercícios e exemplos. Ideal para complementar o primeiro livro com aplicação prática.</p></div><div class="book"><div class="num">03</div><h4>A Psicologia do Investimento Explicada</h4><div class="meta">Martin Pring</div><p>Conecta análise técnica com psicologia de massa do mercado. <strong>Como funciona:</strong> mostra que ler gráfico é, na essência, ler o comportamento coletivo dos traders — e que dominar a sua própria psicologia é tão importante quanto dominar a técnica.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section" style="text-align:center">Conclusão</h2><div class="body-text" style="max-width:760px;margin:0 auto"><p>Para ser bem-sucedido no mercado, três coisas precisam acontecer simultaneamente — não dá pra ter só duas:</p><div class="info-card blue"><h4>1. Saber montar um plano de gerenciamento sólido</h4><p>O modelo das 3 fases é a base. Onde você está? Que % está arriscando? O capital justifica isso?</p></div><div class="info-card gold"><h4>2. Respeitar o plano rigorosamente</h4><p>Plano que não é seguido é o mesmo que não ter plano. Disciplina &gt; talento.</p></div><div class="info-card green"><h4>3. Confiar e respeitar sua técnica operacional</h4><p>A técnica é o "como", o gerenciamento é o "quanto". Sem confiança na técnica, você vai sair do plano na primeira sequência ruim.</p></div><div class="quote" style="margin-top:24px;font-size:15.5px"><strong>O nível profissional é sobre desalavancagem e busca por consistência matemática</strong> — não sobre lucros explosivos e sorte.<span class="attr">— mensagem central do módulo</span></div><p style="text-align:center;margin-top:28px;font-style:italic;color:var(--muted)">Quanto menor a alavancagem, mais perto você está do nível profissional.</p></div><div class="dots br"></div></section><section class="page"><div class="dots tl"></div><div class="corner tl"></div><h2 class="title-mono h-section">Contato</h2><div class="contact-block"><p><strong>insta:</strong> pedrooscar1708</p><p><strong>email:</strong> pedrooscar1708@gmail.com</p><p><strong>telefone:</strong> (11) 96342-6694</p></div><div class="credit-box"><strong>Trabalho realizado com auxílio do Claude (Anthropic)</strong> — IA usada para organização e redação. Conteúdo baseado nas anotações pessoais do Módulo 4 (Gerenciamento de Risco e Mentalidade no Dólar Futuro), com referências a Mark Douglas (<em>Trading in The Zone</em>, <em>O Trader Disciplinado</em>) e Martin Pring (<em>A Psicologia do Investimento Explicada</em>).</div><div class="corner br"></div></section><div style="height:40px"></div></body></html></script>

tant}.h-section{font-size:20px}.cover{padding:50px 24px;min-height:auto}.cover .h-big{font-size:32px!important}.author{font-size:17px}.corner,.dots{transform:scale(.7)}}@media print{body{background:#fff}.topbar{display:none}.page{page-break-after:always;box-shadow:none;margin:0 auto;border:none;max-width:none;width:100%}.page:last-child{page-break-after:auto}}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a><button onclick="window.print()">Imprimir / Salvar PDF</button><div class="spacer"></div><small>Trabalho — Trading System (Rudá Alves)</small></div><section class="page cover"><div class="dots tl"></div><div class="corner tl"></div><h1 class="title-mono h-big">TRADING<br/>SYSTEM</h1><div class="author">por Pedro Oscar</div><div class="subtitle">Aula de Rudá Alves · Os Traders Podcast</div><div class="corner br"></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><div class="two-col"><div><h2 class="title-mono h-section">Tópicos<br/>de<br/>Abordagem</h2></div><div><ul class="topics"><li>O Ciclo do Trader · 4 fases</li><li>Os 4 pilares do Trade System</li><li>Conceitos e filosofias de mercado</li><li>O "chefe" do trader</li><li>Conclusão</li></ul></div></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">O Ciclo do Trader</h2><div class="body-text"><p>Rudá define o caminho do trader como um <strong>mapa existencial e financeiro</strong> dividido em 4 etapas sucessivas. Não dá pra pular fase — cada uma tem um propósito específico.</p><ol class="phases-list"><li class="f1"><h4>Aprendizado</h4><p>É a fase <strong>mais longa</strong>. O objetivo NÃO é ganhar dinheiro — é construir um <em>Trade System</em> robusto. Use contas simbólicas (microlotes) e viva de forma modesta. Trate o dinheiro como matéria-prima, não como resultado.</p></li><li class="f2"><h4>Prática</h4><p>Momento de levar o sistema para o <strong>campo de batalha real</strong> com capital reduzido (3 a 6 meses). Foco: validar a execução SEM fazer grandes alterações no sistema. Aproximar os resultados reais dos testes anteriores.</p></li><li class="f3"><h4>Acúmulo de Capital</h4><p>Aqui o jogo MUDA. O trader une a rentabilidade do trading aos <strong>aportes externos</strong> (dinheiro vindo de outras fontes). Objetivo: crescimento exponencial e <em>reinvestimento total dos lucros</em>.</p></li><li class="f4"><h4>Usufruto · Dividendos</h4><p>O estágio de maturidade. A renda fixa e os investimentos consolidados <strong>cobrem o custo de vida</strong>. O trading deixa de ser necessidade e passa a ser apenas um <em>acelerador de riqueza</em>.</p></li></ol><div class="quote">Cada fase tem um propósito. Quem pula etapa, paga depois — geralmente quebrando.<span class="attr">— resumo da tese de Rudá</span></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Os 4 pilares do Trade System</h2><div class="body-text"><p>Rudá enfatiza: <strong>trader sem sistema é só um apostador</strong>. Um sistema eficiente deve responder 4 perguntas. No centro, onde os 4 pilares se encontram, está a <strong>EFICIÊNCIA</strong>.</p><div class="venn-fig"><svg viewBox="0 0 480 440" xmlns="http://www.w3.org/2000/svg"><circle cx="240" cy="130" r="105" fill="#3b82f6" fill-opacity="0.45" stroke="#3b82f6" stroke-width="2"/><circle cx="345" cy="235" r="105" fill="#ef4444" fill-opacity="0.45" stroke="#ef4444" stroke-width="2"/><circle cx="240" cy="340" r="105" fill="#f59e0b" fill-opacity="0.45" stroke="#f59e0b" stroke-width="2"/><circle cx="135" cy="235" r="105" fill="#22c55e" fill-opacity="0.45" stroke="#22c55e" stroke-width="2"/><rect x="200" y="195" width="80" height="80" transform="rotate(45 240 235)" fill="white" stroke="#1a1a1a" stroke-width="2"/><text x="240" y="80" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">MODELO</text><text x="240" y="98" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">OPERACIONAL</text><text x="345" y="226" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">GESTÃO</text><text x="345" y="244" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">FINANCEIRA</text><text x="240" y="378" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">MODELO</text><text x="240" y="396" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">MENTAL</text><text x="135" y="240" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">REGRAS</text><text x="240" y="240" font-family="Arial" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">EFICIÊNCIA</text></svg><div class="venn-caption">Os 4 pilares do Trade System — eficiência nasce da interseção dos 4.</div></div><div class="pillar op"><h4>Modelo Operacional<span class="q">ONDE?</span></h4><p>Define <strong>exatamente</strong> os pontos de entrada, stop loss e alvo (saída). É o "como entrar e sair" da operação.</p></div><div class="pillar gf"><h4>Gestão Financeira<span class="q">QUANTO?</span></h4><p>Determina o tamanho da posição e o risco por operação. Rudá destaca: <em>um bom stop protege a operação, o capital E a saúde mental do trader</em>.</p></div><div class="pillar rg"><h4>Regras<span class="q">QUANDO?</span></h4><p>Atuam como <strong>filtros</strong>. Por exemplo: regras que proíbem operar durante notícias econômicas (Payroll) ou balanços de empresas — para evitar volatilidade extrema.</p></div><div class="pillar mm"><h4>Modelo Mental<span class="q">COMO?</span></h4><p>É o pilar que <strong>une todos os outros</strong>. Define como o trader pensa, age e mantém a disciplina de seguir o sistema. Trata a consistência como uma <em>ação repetida</em> — não apenas um resultado financeiro.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Conceitos e filosofias</h2><div class="body-text"><p>Ao longo da aula, Rudá compartilha "pérolas" da experiência:</p><div class="info-card blue"><h4>A Fé no Mercado</h4><p>O sistema deve estar <strong>alinhado às suas crenças</strong>. Rudá, por exemplo, opera tendências no mercado americano porque acredita (tem "fé") que <em>topos e fundos serão rompidos</em>. Sem essa fé, o operador desiste no primeiro contratempo.</p></div><div class="info-card gold"><h4>O Preço Desconta Tudo</h4><p>Baseado na <strong>Teoria de Dow</strong>: todas as notícias, medos e expectativas já estão refletidas no gráfico. Quem busca "explicação" pra cada movimento perde tempo — o gráfico é a explicação.</p></div><div class="info-card red"><h4>Crítica à "Manipulação"</h4><p>Citando <strong>Jesse Livermore</strong>: a desculpa de "mercado manipulado" é usada por <em>especuladores despreparados</em> para justificar perdas. O mercado é o que é. Aprenda a ler ou aceite as perdas como ignorância sua.</p></div><div class="info-card purple"><h4>Consistência é ação repetida</h4><p>Consistência NÃO é um número (lucro), é um <strong>processo</strong>. Você pode ter um mês negativo seguindo o sistema rigorosamente — e isso ainda é consistência. Você pode ter um mês positivo violando o sistema — e isso é sorte (não consistência).</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">O "chefe" do trader</h2><div class="body-text"><p>Para quem vai pro trading buscando <strong>liberdade</strong>, Rudá faz um alerta importante:</p><div class="quote" style="font-size:16px;border-left-color:var(--accent)"><strong>No trading, seu único chefe eterno será o seu Trade System.</strong><span class="attr">— Rudá Alves</span></div><p>Você se livra do chefe da empresa. Você se livra do horário fixo. Mas se o sistema disser "não opere agora", e você operar — você está <em>desobedecendo seu chefe</em>. As consequências (financeiras e psicológicas) virão.</p><h3 class="h-sub">A liberdade real</h3><div class="info-card"><p>A liberdade do trader não é fazer o que quer, é <strong>obedecer o sistema com tanta fluência</strong> que o sistema vira um reflexo do que você é. Aí sim você é livre — porque você É o sistema.</p></div><h3 class="h-sub">Diagnóstico simples</h3><p>Quer saber se você é apostador ou trader? Faça uma pergunta:</p><div class="info-card orange"><p><em>"Eu opero porque o sistema diz pra operar, ou porque eu QUERO operar?"</em></p><p style="margin-top:8px;font-size:13px"><strong>Apostador:</strong> opera porque quer.<br/><strong>Trader:</strong> opera porque o sistema mandou.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section" style="text-align:center">Conclusão</h2><div class="body-text" style="max-width:760px;margin:0 auto"><p>A aula de Rudá Alves estabelece dois fundamentos que sustentam o trader profissional: <strong>o Ciclo</strong> (onde você está) e <strong>o Sistema</strong> (como você opera).</p><h3 class="h-sub">Os pilares condensados</h3><div class="info-card blue"><h4>Respeite o ciclo</h4><p>Aprendizado → Prática → Acúmulo → Usufruto. Cada fase tem o seu objetivo. Quem antecipa fases sem estar pronto, retrocede.</p></div><div class="info-card gold"><h4>Tenha um Trade System</h4><p>Modelo Operacional + Gestão Financeira + Regras + Modelo Mental. Os 4 juntos, na interseção, geram EFICIÊNCIA.</p></div><div class="info-card green"><h4>Consistência é processo</h4><p>Resultado é consequência. Foco no processo. Quem foca em resultado abandona o sistema na primeira sequência ruim.</p></div><div class="info-card red"><h4>O sistema é o chefe</h4><p>Liberdade no trading não é fazer o que quer — é obedecer o sistema com fluência.</p></div><p style="text-align:center;margin-top:28px;font-style:italic;color:var(--muted)">Trader sem sistema é apostador. Trader com sistema, sem disciplina, é apostador disfarçado. Trader com sistema E disciplina é o profissional que sobrevive.</p></div><div class="dots br"></div></section><section class="page"><div class="dots tl"></div><div class="corner tl"></div><h2 class="title-mono h-section">Contato</h2><div class="contact-block"><p><strong>insta:</strong> pedrooscar1708</p><p><strong>email:</strong> pedrooscar1708@gmail.com</p><p><strong>telefone:</strong> (11) 96342-6694</p></div><div class="credit-box"><strong>Trabalho realizado com auxílio do Claude (Anthropic)</strong> — IA usada para organização e redação. Conteúdo baseado na aula <em>"SUPER AULA: os 4 CICLOS para VIVER DE TRADING (do ZERO à CONSISTÊNCIA)"</em> de <strong>Rudá Alves</strong> (canal Os Traders Podcast, ~1h28min).</div><div class="corner br"></div></section><div style="height:40px"></div></body></html></script>

style:normal}.book{background:#fff;border:1px solid #d8cdb7;border-left:4px solid var(--line);border-radius:4px;padding:14px 18px;margin-bottom:14px}.book .num{font-family:"Courier New",monospace;font-weight:700;color:var(--accent);font-size:14px}.book h4{margin:4px 0;font-size:16px;font-weight:700}.book .meta{color:var(--muted);font-size:13px;margin-bottom:8px;font-style:italic}.book p{margin:0;font-size:14px;line-height:1.55}.timeline{position:relative;padding-left:28px;margin-top:16px}.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}.timeline .ev{position:relative;margin-bottom:16px}.timeline .ev::before{content:"";position:absolute;left:-24px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}.timeline .ev.gold::before{border-color:var(--gold)}.timeline .ev.blue::before{border-color:var(--blue)}.timeline .ev.green::before{border-color:var(--green)}.timeline .ev.red::before{border-color:var(--accent)}.timeline .ev.purple::before{border-color:var(--purple)}.timeline .date{font-family:"Courier New",monospace;font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.05em}.timeline .title{font-size:14.5px;font-weight:700;margin:2px 0 4px 0}.timeline .desc{font-size:13.5px;color:var(--muted);line-height:1.5}.trade-card{background:#fff;border:1px solid #d8cdb7;border-radius:6px;padding:16px 20px;margin-bottom:14px;position:relative}.trade-card.win{border-left:5px solid var(--green)}.trade-card.loss{border-left:5px solid var(--accent)}.trade-card .header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:8px}.trade-card .header .name{font-size:16px;font-weight:700}.trade-card .header .year{font-family:"Courier New",monospace;font-size:12px;color:var(--muted);background:var(--paper);padding:2px 8px;border-radius:3px}.trade-card .amount{font-family:"Courier New",monospace;font-weight:700;font-size:18px;margin:6px 0}.trade-card.win .amount{color:var(--green)}.trade-card.loss .amount{color:var(--accent)}.trade-card .desc{font-size:14px;line-height:1.55;margin:6px 0 0 0}.trade-card .source{font-size:12px;color:var(--muted);font-style:italic;margin-top:8px;padding-top:8px;border-top:1px dashed #e0d4ba}.names-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px}.names-table th,.names-table td{padding:8px 10px;text-align:left;border-bottom:1px solid #e8dcc4}.names-table th{background:#2c3e50;color:#fff;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em}.names-table tr:nth-child(even) td{background:#fff}.names-table .name-cell{font-weight:600}.names-table .year-cell{font-family:"Courier New",monospace;color:var(--muted);font-size:12px;white-space:nowrap}.contact-block{font-family:"Courier New",monospace;font-size:16px;line-height:2}.credit-box{margin-top:28px;padding:14px 18px;border:1.5px dashed var(--line);border-radius:4px;background:#fff;font-family:"Helvetica Neue",sans-serif;font-size:14px;line-height:1.6}.credit-box strong{color:var(--accent)}@media(max-width:720px){.page{padding:38px 22px;min-height:auto}.two-col{grid-template-columns:1fr;gap:18px}.h-big{font-size:26px!important}.h-section{font-size:20px}.cover{padding:50px 24px;min-height:auto}.cover .h-big{font-size:28px!important}.author{font-size:17px}.corner,.dots{transform:scale(.7)}.names-table{font-size:11px}.names-table th,.names-table td{padding:6px 4px}}@media print{body{background:#fff}.topbar{display:none}.page{page-break-after:always;box-shadow:none;margin:0 auto;border:none;max-width:none;width:100%}.page:last-child{page-break-after:auto}}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a><button onclick="window.print()">Imprimir / Salvar PDF</button><div class="spacer"></div><small>Trabalho — História da Análise Técnica</small></div><section class="page cover"><div class="dots tl"></div><div class="corner tl"></div><h1 class="title-mono h-big">HISTÓRIA DA<br/>ANÁLISE TÉCNICA</h1><div class="author">por Pedro Oscar</div><div class="subtitle">300+ anos · do comércio de arroz aos algoritmos</div><div class="corner br"></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><div class="two-col"><div><h2 class="title-mono h-section">Tópicos<br/>de<br/>Abordagem</h2></div><div><ul class="topics"><li>Linha do tempo · 4 séculos</li><li>Origens · Japão séc. XVII</li><li>Nascimento moderno · Charles Dow</li><li>Pioneiros · 1900-1950</li><li>Era técnica · 1950-1990</li><li>Era digital · 1990 - hoje</li><li>Principais nomes (cronologia)</li><li>3 livros em inglês</li><li>3 livros em português</li><li>Maiores trades da história</li><li>Piores trades da história</li><li>Curiosidades</li><li>Conclusão</li></ul></div></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Linha do tempo · 4 séculos</h2><div class="body-text"><div class="timeline"><div class="ev gold"><div class="date">~1700 (Japão)</div><div class="title">Bolsa de arroz de Dojima · Osaka</div><div class="desc">Primeira bolsa de futuros do mundo. Comerciantes japoneses começam a registrar preços graficamente.</div></div><div class="ev gold"><div class="date">~1755 (Japão)</div><div class="title">Munehisa Homma sistematiza o candlestick</div><div class="desc">Publica "San-en Kinsen Hiroku" — primeiro tratado sobre psicologia de mercado e padrões gráficos.</div></div><div class="ev blue"><div class="date">1884–1902 (EUA)</div><div class="title">Charles Dow funda o WSJ e cria o Dow Jones</div><div class="desc">Co-funda o Wall Street Journal (1889). Cria o Dow Jones Industrial Average (1896). Seus editoriais formarão a Teoria de Dow.</div></div><div class="ev blue"><div class="date">1922–1932 (EUA)</div><div class="title">Hamilton e Rhea sistematizam Dow</div><div class="desc">William Hamilton ("The Stock Market Barometer", 1922) e Robert Rhea ("The Dow Theory", 1932) organizam os princípios de Dow em livros.</div></div><div class="ev green"><div class="date">1923 (EUA)</div><div class="title">"Reminiscences of a Stock Operator"</div><div class="desc">Edwin Lefèvre publica a biografia ficcional de Jesse Livermore — virou leitura obrigatória de qualquer trader.</div></div><div class="ev green"><div class="date">1932 (EUA)</div><div class="title">Schabacker · "Technical Analysis and Stock Market Profits"</div><div class="desc">Considerado o "pai da AT moderna ocidental". Sistematiza padrões clássicos.</div></div><div class="ev green"><div class="date">1938 (EUA)</div><div class="title">Elliott publica "The Wave Principle"</div><div class="desc">Ralph Nelson Elliott apresenta a Teoria das Ondas — descoberta convalescendo de uma doença.</div></div><div class="ev green"><div class="date">1948 (EUA)</div><div class="title">Edwards & Magee · "Technical Analysis of Stock Trends"</div><div class="desc">A primeira "bíblia" da análise técnica. Sistematiza padrões, suportes/resistências, tendências.</div></div><div class="ev red"><div class="date">~1960 (EUA)</div><div class="title">Pete Haurlan aplica suavização exponencial</div><div class="desc">Engenheiro do Jet Propulsion Laboratory cria a base da MME (Exponential Moving Average).</div></div><div class="ev red"><div class="date">1971 (EUA)</div><div class="title">NASDAQ · primeira bolsa eletrônica</div><div class="desc">Inicia a transformação digital dos mercados.</div></div><div class="ev red"><div class="date">1978 (EUA)</div><div class="title">Wilder · "New Concepts in Technical Trading Systems"</div><div class="desc">J. Welles Wilder Jr. apresenta RSI, ADX, ATR e Parabolic SAR — indicadores até hoje fundamentais.</div></div><div class="ev red"><div class="date">1986 (EUA)</div><div class="title">Murphy · "Technical Analysis of the Futures Markets"</div><div class="desc">John J. Murphy publica o que viraria a bíblia ocidental moderna da AT.</div></div><div class="ev red"><div class="date">1991 (EUA)</div><div class="title">Steve Nison traz o candlestick ao Ocidente</div><div class="desc">"Japanese Candlestick Charting Techniques" populariza a técnica japonesa fora do Japão pela primeira vez.</div></div><div class="ev purple"><div class="date">1990s (Mundial)</div><div class="title">Era das plataformas gráficas</div><div class="desc">MetaStock, TradeStation, Bloomberg Terminal democratizam a AT para o trader individual.</div></div><div class="ev purple"><div class="date">2000s (Mundial)</div><div class="title">Trading online + TradingView</div><div class="desc">Brokers online popularizam o day trade. TradingView democratiza gráficos via web.</div></div><div class="ev purple"><div class="date">2010s — hoje</div><div class="title">Era algorítmica + cripto</div><div class="desc">~70% das ordens em bolsas americanas vêm de algoritmos. Criptomoedas trazem nova geração de leitores gráficos.</div></div></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Origens · Japão séc. XVII</h2><div class="body-text"><p>A análise técnica não nasceu em Wall Street. Nasceu numa bolsa de <strong>arroz</strong>, no Japão, há mais de 300 anos.</p><h3 class="h-sub">A bolsa de Dojima · Osaka</h3><p>Por volta de <strong>1697</strong>, a bolsa de arroz de Dojima já funcionava como uma das <strong>primeiras bolsas de futuros do mundo</strong>. Comerciantes japoneses negociavam contratos de arroz com entrega futura — exatamente como hoje se negociam contratos de café, soja ou ouro.</p><h3 class="h-sub">Munehisa Homma · o pai do candlestick</h3><div class="info-card gold"><h4>1724–1803 · família Homma · Sakata</h4><p>Próspero comerciante de arroz, Homma percebeu algo radicalmente novo: o preço do arroz <strong>não refletia apenas oferta e demanda físicas</strong>, mas também o medo e a ganância dos negociantes. Por volta de <strong>1755</strong>, publicou "San-en Kinsen Hiroku" (As Fontes do Ouro — registros das três aves), considerado o <strong>primeiro tratado sobre psicologia de mercado</strong>.</p></div><p>Homma sistematizou padrões gráficos que até hoje são usados — os famosos <strong>Sakata's Five Methods</strong>: Sanzan (três montanhas), Sansen (três rios), Sankuu (três gaps), Sanpei (três velas) e Sanpoo (três métodos).</p><div class="quote">O mercado é movido por dois sentimentos: <strong>ganância e medo</strong>. Quem aprende a ler isso, lê o futuro.<span class="attr">— atribuído a Munehisa Homma</span></div><p>Por mais de 200 anos, esse conhecimento ficou <strong>restrito ao Japão</strong>. Só na década de 1990 chegaria ao Ocidente — quando Steve Nison traduziu e sistematizou tudo no famoso "Japanese Candlestick Charting Techniques".</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Nascimento moderno · Charles Dow</h2><div class="body-text"><p>Enquanto o Japão usava candlestick há séculos, no Ocidente a análise técnica só "nasceria" no final do século XIX, com um <strong>jornalista</strong> americano.</p><h3 class="h-sub">Charles Henry Dow · 1851–1902</h3><div class="info-card blue"><h4>O homem que mediu o mercado</h4><ul><li><strong>1882:</strong> funda a Dow Jones &amp; Company com Edward Jones</li><li><strong>1889:</strong> co-funda o <em>Wall Street Journal</em></li><li><strong>1896:</strong> cria o <strong>Dow Jones Industrial Average</strong> — inicialmente com 12 ações</li><li><strong>Curiosidade triste:</strong> morreu em 1902 relativamente pobre, antes de ver o impacto que sua criação teria no mundo</li></ul></div><h3 class="h-sub">A Teoria de Dow</h3><p>Dow <strong>nunca escreveu um livro</strong>. Sua filosofia foi extraída de seus editoriais no WSJ e organizada após sua morte por:</p><div class="info-card"><ul><li><strong>William Hamilton</strong> · "The Stock Market Barometer" (1922)</li><li><strong>Robert Rhea</strong> · "The Dow Theory" (1932)</li></ul></div><h3 class="h-sub">Os 6 princípios fundamentais</h3><div class="info-card blue"><ol style="margin:4px 0 0 0;padding-left:20px;font-size:14px;line-height:1.6"><li>O preço desconta tudo</li><li>O mercado tem 3 tendências (primária, secundária, terciária)</li><li>Tendências têm 3 fases (acumulação, alta sustentada, euforia)</li><li>Os índices precisam se confirmar mutuamente</li><li>Volume confirma a tendência</li><li>A tendência vigora até dar sinal claro de reversão</li></ol></div><p>Esses 6 princípios viraram o <strong>alicerce</strong> de toda a análise técnica ocidental. Tudo que veio depois — Elliott, Murphy, candlestick — se ancora aqui.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Pioneiros · 1900-1950</h2><div class="body-text"><p>Na primeira metade do séc. XX, um grupo de traders, jornalistas e místicos transformaram as ideias de Dow numa disciplina completa.</p><div class="info-card green"><h4>Richard W. Schabacker · 1899–1935</h4><p>Editor de finanças da revista Forbes. Considerado o <strong>"pai da AT moderna ocidental"</strong>. Publicou "Technical Analysis and Stock Market Profits" (1932), que sistematizou padrões clássicos como cabeça-e-ombros, triângulos e bandeiras. Morreu jovem (36 anos) por septicemia.</p></div><div class="info-card green"><h4>Robert D. Edwards &amp; John Magee</h4><p>Em <strong>1948</strong>, publicaram "<em>Technical Analysis of Stock Trends</em>" — a <strong>primeira "bíblia"</strong> da análise técnica ocidental. O livro continua sendo reeditado até hoje (mais de 70 anos!) e é leitura obrigatória em qualquer curso sério.</p></div><div class="info-card green"><h4>Ralph Nelson Elliott · 1871–1948</h4><p>Contador de profissão. <strong>Descobriu as Ondas de Elliott convalescendo de uma doença grave</strong> — passou anos analisando gráficos por ter tempo livre forçado. Em 1938 publicou "The Wave Principle" e em 1946 "Nature's Law", apresentando a teoria 5+3 que conecta movimento de mercado a Fibonacci.</p></div><div class="info-card green"><h4>W.D. Gann · 1878–1955</h4><p>Trader místico do Texas. Combinava análise técnica com <strong>astrologia, geometria sagrada e ciclos cósmicos</strong>. Famoso por <strong>prever o crash de 1929 com mais de um ano de antecedência</strong>. Suas técnicas (Gann angles, Gann fans) ainda são usadas, embora controversas.</p></div><div class="info-card green"><h4>Jesse Livermore · 1877–1940</h4><p>O trader mais lendário da história. <strong>Quebrou 4 vezes</strong>, fez fortuna 4 vezes. Em 1923, Edwin Lefèvre publicou "Reminiscences of a Stock Operator" — biografia ficcional baseada em Livermore que virou o livro mais influente sobre psicologia de trading. Suicidou-se em 1940 após perder tudo de novo.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Era técnica · 1950-1990</h2><div class="body-text"><p>Com a chegada dos computadores, a AT virou ciência matemática. Surgiram os indicadores que dominam até hoje.</p><div class="info-card red"><h4>Pete Haurlan · anos 1960</h4><p><strong>Engenheiro do Jet Propulsion Laboratory (JPL/NASA)</strong>. Aplicou suavização exponencial — técnica usada em foguetes — aos preços de ações. Criou o que hoje chamamos de <strong>MME (Exponential Moving Average)</strong>. Foi o primeiro a usar o termo "Trend Values" (que viraria "Trendlines").</p></div><div class="info-card red"><h4>J. Welles Wilder Jr. · 1935–2021</h4><p>Engenheiro mecânico que virou trader. Em 1978 publicou "<em>New Concepts in Technical Trading Systems</em>" e, em um único livro, apresentou: <strong>RSI, ADX, ATR, Parabolic SAR</strong>. Quase todos os indicadores que você usa em qualquer plataforma vieram dele.</p></div><div class="info-card red"><h4>Gerald Appel · 1933–</h4><p>Nos anos 1970 popularizou o uso combinado de duas médias móveis (uma rápida + uma lenta) e criou o <strong>MACD (Moving Average Convergence Divergence)</strong> — o indicador mais usado do mundo até hoje.</p></div><div class="info-card red"><h4>Robert Prechter · 1949–</h4><p>Resgatou Elliott do esquecimento. Publicou "<em>Elliott Wave Principle</em>" (1978, com A.J. Frost) e fundou o boletim <em>Elliott Wave Theorist</em>. Conectou definitivamente Elliott a Fibonacci no Ocidente moderno.</p></div><div class="info-card red"><h4>Steve Nison · 1989–1991</h4><p>Analista do Merrill Lynch. <strong>Descobriu o candlestick por acaso</strong> ao ver um livro japonês na mesa de uma corretora. Estudou, traduziu e em 1991 publicou "<em>Japanese Candlestick Charting Techniques</em>" — trazendo ao Ocidente uma técnica de 250 anos.</p></div><div class="info-card red"><h4>John J. Murphy · 1942–</h4><p>Em 1986 publicou "<em>Technical Analysis of the Futures Markets</em>" (depois renomeado "<em>...of the Financial Markets</em>" em 1999). Virou a <strong>bíblia ocidental moderna</strong> da AT. Em 2004 publicou "Intermarket Analysis", criando a metodologia que conecta os 4 grandes mercados (ações, bonds, dólar, commodities).</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Era digital · 1990 - hoje</h2><div class="body-text"><p>Em 30 anos, a AT passou de um conhecimento de elite para uma ferramenta acessível a qualquer pessoa com smartphone.</p><div class="info-card purple"><h4>Anos 1990 · Plataformas pioneiras</h4><p><strong>MetaStock</strong>, <strong>TradeStation</strong> e <strong>Bloomberg Terminal</strong> democratizaram o cálculo automático de indicadores. O que antes era feito à mão em papel quadriculado virou clique de mouse.</p></div><div class="info-card purple"><h4>Anos 2000 · Trading online</h4><p>Brokers online (E*Trade, Ameritrade) e <strong>day trade</strong> em massa. <strong>TradingView</strong> (lançada em 2011) muda o jogo: gráficos profissionais via web, gratuitos, com camada social.</p></div><div class="info-card purple"><h4>Anos 2010 · Algoritmos + cripto</h4><p>Hoje, <strong>~70% das ordens em bolsas americanas</strong> vêm de algoritmos baseados em derivativos de AT clássica. Criptomoedas trazem nova geração de leitores gráficos. Variações modernas: MME ponderada, Hull, T3, EMA adaptativa.</p></div><div class="info-card purple"><h4>Anos 2020 · IA aplicada</h4><p>Fundos quantitativos usam <strong>machine learning</strong> para identificar padrões em séries de preço. A AT não morreu — virou o input pra modelos estatísticos sofisticados.</p></div><div class="quote">As ferramentas mudam, os princípios não. Quem leu os gráficos em 1700 lia a mesma coisa que se lê hoje: psicologia de massa via preço.<span class="attr">— síntese da história da AT</span></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Principais nomes · cronologia</h2><div class="body-text"><p>Os nomes que construíram a AT, em ordem cronológica:</p><table class="names-table"><thead><tr><th>Nome</th><th>Vida</th><th>Contribuição</th></tr></thead><tbody><tr><td class="name-cell">Munehisa Homma</td><td class="year-cell">1724–1803</td><td>Pai do candlestick · psicologia de mercado</td></tr><tr><td class="name-cell">Charles H. Dow</td><td class="year-cell">1851–1902</td><td>Teoria de Dow · Dow Jones · WSJ</td></tr><tr><td class="name-cell">Ralph N. Elliott</td><td class="year-cell">1871–1948</td><td>Wave Principle · ondas 5+3</td></tr><tr><td class="name-cell">Jesse Livermore</td><td class="year-cell">1877–1940</td><td>Trader lendário · "Reminiscences"</td></tr><tr><td class="name-cell">W.D. Gann</td><td class="year-cell">1878–1955</td><td>Tempo + preço · previu 1929</td></tr><tr><td class="name-cell">William Hamilton</td><td class="year-cell">1867–1929</td><td>Sistematizou Teoria de Dow</td></tr><tr><td class="name-cell">Robert Rhea</td><td class="year-cell">1896–1939</td><td>"The Dow Theory" (1932)</td></tr><tr><td class="name-cell">Richard Schabacker</td><td class="year-cell">1899–1935</td><td>Pai da AT moderna ocidental</td></tr><tr><td class="name-cell">Edwards &amp; Magee</td><td class="year-cell">1948</td><td>"Technical Analysis of Stock Trends"</td></tr><tr><td class="name-cell">Pete Haurlan</td><td class="year-cell">~1960s</td><td>EMA · suavização exponencial</td></tr><tr><td class="name-cell">Gerald Appel</td><td class="year-cell">1933–</td><td>MACD</td></tr><tr><td class="name-cell">J. Welles Wilder</td><td class="year-cell">1935–2021</td><td>RSI · ADX · ATR · Parabolic SAR</td></tr><tr><td class="name-cell">John J. Murphy</td><td class="year-cell">1942–</td><td>Bíblia moderna · análise intermercados</td></tr><tr><td class="name-cell">Robert Prechter</td><td class="year-cell">1949–</td><td>Popularizou Elliott + Fibonacci</td></tr><tr><td class="name-cell">Steve Nison</td><td class="year-cell">~1950–</td><td>Trouxe candlestick ao Ocidente</td></tr><tr><td class="name-cell">Alexander Elder</td><td class="year-cell">1950–</td><td>Psicologia + AT · "Trading for a Living"</td></tr><tr><td class="name-cell">Martin Pring</td><td class="year-cell">1947–</td><td>AT + ciclos econômicos</td></tr><tr><td class="name-cell">Mark Douglas</td><td class="year-cell">1948–2015</td><td>"Trading in The Zone" · psicologia</td></tr><tr><td class="name-cell">Thomas Bulkowski</td><td class="year-cell">1957–</td><td>Encyclopedia of Chart Patterns</td></tr></tbody></table></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">3 livros em inglês</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Technical Analysis of Stock Trends</h4><div class="meta">Robert D. Edwards &amp; John Magee — 1948</div><p>A primeira bíblia da AT ocidental. <strong>Mais de 70 anos depois ainda está em catálogo.</strong> Cobre os fundamentos: tendências, padrões clássicos (cabeça-ombros, triângulos, bandeiras), suportes/resistências e teoria de Dow. Se você só pudesse ler UM livro de AT, seria este.</p></div><div class="book"><div class="num">02</div><h4>Technical Analysis of the Financial Markets</h4><div class="meta">John J. Murphy — 1999</div><p>A bíblia <strong>moderna</strong>. Atualização do "Technical Analysis of the Futures Markets" (1986), agora cobrindo todos os mercados — não só futuros. 500+ páginas progressivas, do básico ao avançado. Referência usada em quase todo curso sério do mundo.</p></div><div class="book"><div class="num">03</div><h4>Reminiscences of a Stock Operator</h4><div class="meta">Edwin Lefèvre — 1923</div><p>Não é um livro técnico — é uma <strong>biografia ficcional</strong> de Jesse Livermore. Mas ensina mais sobre psicologia de mercado do que qualquer manual. Sequências como "There is nothing new in Wall Street" são citadas até hoje. <strong>Leitura obrigatória de qualquer trader sério.</strong></p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">3 livros em português</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Análise Técnica dos Mercados Financeiros</h4><div class="meta">John J. Murphy — Editora Saraiva (tradução clássica)</div><p>A tradução brasileira da bíblia moderna. <strong>Livro de cabeceira em quase todo curso de AT no Brasil</strong> — incluindo o do Vasco Mamede. Mantém a estrutura completa do original: fundamentos, indicadores, padrões, ciclos, sistemas.</p></div><div class="book"><div class="num">02</div><h4>Reminiscências de um Especulador Financeiro</h4><div class="meta">Edwin Lefèvre — tradução brasileira</div><p>Tradução do clássico de 1923. Apesar da idade, a psicologia descrita é <strong>idêntica à do trader de hoje</strong> — porque a natureza humana não mudou. Frases como "o mercado nunca está errado, opiniões frequentemente estão" continuam atuais.</p></div><div class="book"><div class="num">03</div><h4>Análise Técnica — A Teoria de Dow e as Ondas de Elliott</h4><div class="meta">Eduardo Matsura — autor brasileiro</div><p>Um dos poucos autores brasileiros respeitados em AT. <strong>Adapta os clássicos ao mercado nacional</strong>, com exemplos da B3 (Petrobras, Vale, Bovespa). Excelente para quem quer aplicar a teoria sem precisar "traduzir" cenários americanos.</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Maiores trades da história</h2><div class="body-text"><p>Os trades mais lendários já registrados — todos com base em leitura técnica + macro:</p><div class="trade-card win"><div class="header"><span class="name">Jesse Livermore</span><span class="year">1929 · Crash</span></div><div class="amount">~ US$ 100 milhões (≈ US$ 1.4 bi hoje)</div><p class="desc">Shortou o mercado durante o <strong>Grande Crash de 1929</strong>. Antecipou a virada estudando padrões, volume e fluxo de ordens. Em algumas semanas, fez uma das maiores fortunas individuais da história financeira.</p><div class="source">Fonte: biografia "Jesse Livermore: World's Greatest Stock Trader" · registros do NYTimes da época</div></div><div class="trade-card win"><div class="header"><span class="name">George Soros</span><span class="year">16/09/1992 · "Quarta-feira Negra"</span></div><div class="amount">~ US$ 1 bilhão em UM dia</div><p class="desc">Shortou £10 bilhões da <strong>libra esterlina</strong>, forçando a saída da moeda do Mecanismo Europeu de Câmbio. Conhecido como "o homem que quebrou o Banco da Inglaterra". Combinou análise macro com leitura técnica de divergências.</p><div class="source">Fonte: registros do Bank of England · livros do próprio Soros e de Stanley Druckenmiller</div></div><div class="trade-card win"><div class="header"><span class="name">John Paulson</span><span class="year">2007–2008 · Subprime</span></div><div class="amount">~ US$ 15-20 bilhões</div><p class="desc">Shortou títulos hipotecários subprime via CDS, antecipando o <strong>colapso imobiliário americano</strong>. Maior trade individual de hedge fund da história. Combinação de análise fundamentalista + leitura de tendências macro.</p><div class="source">Fonte: livro "The Greatest Trade Ever" (Gregory Zuckerman, 2009)</div></div><div class="trade-card win"><div class="header"><span class="name">Paul Tudor Jones</span><span class="year">19/10/1987 · Black Monday</span></div><div class="amount">~ 200% retorno no mês · triplicou o fundo</div><p class="desc">Previu o crash usando <strong>padrão similar ao de 1929</strong> e análise de fluxo. Documentário "Trader" (1987, ainda assistível) registra o trade em tempo real — raríssimo na história.</p><div class="source">Fonte: documentário PBS "Trader" (1987) · entrevistas posteriores</div></div><div class="trade-card win"><div class="header"><span class="name">Bill Ackman</span><span class="year">Março 2020 · Crash COVID</span></div><div class="amount">US$ 26 milhões → US$ 2.6 bilhões (100x em ~1 mês)</div><p class="desc">Comprou hedges (CDS) de US$ 26 milhões em fevereiro/2020. Quando o mercado colapsou em março, vendeu por <strong>US$ 2.6 bilhões</strong> — retorno de ~100x. Um dos retornos percentuais mais altos da história em prazo tão curto.</p><div class="source">Fonte: cartas trimestrais do Pershing Square · entrevista CNBC março/2020</div></div><div class="trade-card win"><div class="header"><span class="name">Stanley Druckenmiller</span><span class="year">1992 · Libra (com Soros)</span></div><div class="amount">parte do US$ 1 bi · arquiteto técnico do trade</div><p class="desc">Druckenmiller foi quem <strong>desenhou tecnicamente</strong> o trade da libra. Soros o convenceu a aumentar a posição: "Vá pela jugular". Considerado um dos melhores gestores macro de todos os tempos.</p><div class="source">Fonte: entrevista de Druckenmiller no Real Vision · livros sobre Quantum Fund</div></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Piores trades da história</h2><div class="body-text"><p>Os mais espetaculares colapsos — todos compartilham um denominador comum: <strong>falha de gerenciamento de risco</strong>.</p><div class="trade-card loss"><div class="header"><span class="name">Jesse Livermore</span><span class="year">1934 · Quebra final</span></div><div class="amount">Perdeu TUDO · suicidou em 1940</div><p class="desc">O mesmo Livermore que ganhou US$ 100M em 1929 <strong>quebrou em 1934</strong>. Quebrou 4 vezes na vida, fez fortuna 4 vezes — mas nunca dominou gerenciamento. Em 1940 cometeu suicídio em Nova York. <em>Lição:</em> sem gerenciamento, técnica boa não basta.</p><div class="source">Fonte: registros do New York Times · biografias de Livermore</div></div><div class="trade-card loss"><div class="header"><span class="name">Long-Term Capital Management</span><span class="year">1998 · Crise da Rússia</span></div><div class="amount">US$ 4.6 bilhões perdidos · alavancagem 100:1</div><p class="desc">Hedge fund com <strong>2 ganhadores do Nobel</strong> de Economia (Scholes e Merton). Alavancagem de 100:1 em estratégias de arbitragem que se desfizeram quando a Rússia deu calote. Quase derrubou o sistema financeiro mundial — Fed organizou bailout privado de US$ 3.6 bilhões.</p><div class="source">Fonte: livro "When Genius Failed" (Roger Lowenstein, 2000)</div></div><div class="trade-card loss"><div class="header"><span class="name">Nick Leeson · Barings Bank</span><span class="year">1995</span></div><div class="amount">£ 827 milhões · QUEBROU o banco de 233 anos</div><p class="desc">Trader de 28 anos, sozinho em Singapura, fez posições não autorizadas em futuros do Nikkei. O terremoto de Kobe (jan/95) destruiu o trade. <strong>Quebrou o Barings Bank</strong> — o banco mais antigo da Inglaterra (fundado em 1762). Leeson cumpriu 4 anos de prisão.</p><div class="source">Fonte: livro "Rogue Trader" (do próprio Leeson) · filme homônimo (1999)</div></div><div class="trade-card loss"><div class="header"><span class="name">Jérôme Kerviel · Société Générale</span><span class="year">2008</span></div><div class="amount">€ 4.9 bilhões · maior fraude individual da história</div><p class="desc">Trader de 31 anos acumulou posições não autorizadas de €50 bilhões em índices europeus. Quando descobertas em janeiro/2008, o desfazimento gerou <strong>perda de €4.9 bilhões</strong> em poucos dias. Condenado a 5 anos de prisão.</p><div class="source">Fonte: relatórios oficiais da SocGen · livros sobre o caso</div></div><div class="trade-card loss"><div class="header"><span class="name">Bill Hwang · Archegos Capital</span><span class="year">Março 2021</span></div><div class="amount">~ US$ 20 bilhões em alguns dias</div><p class="desc">Family office com posições alavancadas via <strong>total return swaps</strong> em ações como ViacomCBS. Quando as ações começaram a cair, margin calls forçaram liquidação em massa. Derrubou o <strong>Credit Suisse</strong> (US$ 5.5B perdidos) e contribuiu para o colapso posterior do banco. Hwang foi preso em 2022.</p><div class="source">Fonte: registros da SEC · cobertura WSJ/Bloomberg 2021–2022</div></div><div class="trade-card loss"><div class="header"><span class="name">Brian Hunter · Amaranth Advisors</span><span class="year">2006</span></div><div class="amount">US$ 6 bilhões em uma semana</div><p class="desc">Trader-estrela do hedge fund Amaranth fez <strong>aposta gigante em gás natural</strong>. Quando o spread se virou contra ele em setembro/2006, o fundo perdeu US$ 6B em uma semana. <strong>Maior colapso de hedge fund até então.</strong></p><div class="source">Fonte: relatório do Senado dos EUA sobre o caso · cobertura WSJ</div></div><div class="quote">Em todos os casos: <strong>técnica era boa, gerenciamento era zero</strong>. Por isso o módulo do Vasco insiste tanto: o nível profissional é desalavancagem.<span class="attr">— padrão comum dos colapsos</span></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Curiosidades</h2><div class="body-text"><p><strong>Charles Dow morreu pobre.</strong> Criou o índice mais famoso do mundo e o jornal financeiro de maior referência (WSJ), mas nunca acumulou fortuna pessoal. Morreu em 1902 com 51 anos.</p><p><strong>Livermore quebrou 4 vezes.</strong> Quatro vezes ganhou milhões, quatro vezes perdeu tudo. A última quebra foi em 1934 — em 1940, suicidou-se em Nova York deixando carta dizendo "minha vida foi um fracasso".</p><p><strong>Elliott descobriu as ondas convalescendo.</strong> Tinha doença grave que o impediu de trabalhar. Passou anos analisando gráficos por ter tempo livre forçado. Sem a doença, talvez nunca teria descoberto a teoria das ondas.</p><p><strong>W.D. Gann era místico.</strong> Estudava astrologia, geometria sagrada, ciclos cósmicos. Suas técnicas (Gann angles, square of nine) misturavam matemática rigorosa com simbolismo esotérico — até hoje controversas.</p><p><strong>Pete Haurlan era engenheiro de foguetes.</strong> Trabalhava no Jet Propulsion Laboratory (NASA). Aplicou a matemática de suavização de sinais usada em foguetes para "suavizar" preços de ações — nasceu a MME.</p><p><strong>Steve Nison descobriu candlestick por acaso.</strong> Viu um livro japonês na mesa de uma corretora em 1987. Estudou japonês básico só pra entender. Trouxe ao Ocidente uma técnica de 250 anos completamente desconhecida.</p><p><strong>"Golden Cross" e "Death Cross" foram cunhados pela mídia.</strong> A imprensa financeira americana popularizou esses nomes nos anos 1980 para descrever cruzamentos das MMs 50 e 200. Não vêm de nenhum livro técnico clássico.</p><p><strong>~70% das ordens hoje são algorítmicas.</strong> Estimativa para bolsas americanas. A maioria desses algoritmos usa derivativos de AT clássica (médias, momentum, volatilidade) — só que executados em milisegundos.</p><p><strong>NASDAQ foi a primeira bolsa eletrônica do mundo (1971).</strong> Antes dela, todas as negociações eram manuais (pregão viva-voz). A NASDAQ inventou o "mercado sem chão de pregão".</p><p><strong>O Liber Abaci (1202) ficou esquecido por 700 anos.</strong> Fibonacci publicou seu livro em 1202 com a famosa sequência. Só nos anos 1930 — quando Elliott percebeu a relação com mercados — é que a sequência ganhou aplicação prática em finanças.</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section" style="text-align:center">Conclusão</h2><div class="body-text" style="max-width:760px;margin:0 auto"><p>A análise técnica nasceu há mais de <strong>300 anos</strong>, no comércio de arroz japonês, e evoluiu para se tornar a linguagem dominante de leitura de mercado no mundo todo.</p><p>De <strong>Munehisa Homma</strong> (1700s) a <strong>Bill Hwang</strong> (2021), passando por Charles Dow, Livermore, Elliott, Wilder, Murphy e Nison, a história mostra um padrão claro:</p><div class="info-card gold" style="margin-top:18px"><h4>As ferramentas mudam · os princípios não</h4><p>Em 1700, comerciantes desenhavam velas em papel. Hoje, algoritmos processam terabytes em milissegundos. Mas o que ambos estão fazendo é a mesma coisa: <strong>tentar ler a psicologia coletiva via preço</strong>.</p></div><div class="info-card red"><h4>Técnica sem gerenciamento = quebra</h4><p>Livermore, LTCM, Leeson, Hwang. Todos tinham técnica brilhante. Todos quebraram porque não dominavam gerenciamento. Sempre.</p></div><div class="info-card green"><h4>Os princípios fundamentais</h4><p>Psicologia, gerenciamento e disciplina foram (e sempre serão) os <strong>3 pilares do trader profissional</strong>. Independente de século ou ferramenta.</p></div><p style="text-align:center;margin-top:28px;font-style:italic;color:var(--muted)">Quem entende a história entende que está caminhando sobre ombros de gigantes — e sobre os ossos dos que ignoraram seus próprios sistemas.</p></div><div class="dots br"></div></section><section class="page"><div class="dots tl"></div><div class="corner tl"></div><h2 class="title-mono h-section">Contato</h2><div class="contact-block"><p><strong>insta:</strong> pedrooscar1708</p><p><strong>email:</strong> pedrooscar1708@gmail.com</p><p><strong>telefone:</strong> (11) 96342-6694</p></div><div class="credit-box"><strong>Trabalho realizado com auxílio do Claude (Anthropic)</strong> — IA usada para pesquisa, organização e redação. Conteúdo baseado em fontes públicas: Edwin Lefèvre (<em>Reminiscences</em>), John J. Murphy (<em>Technical Analysis</em>), registros históricos do Wall Street Journal, biografias de Livermore/Soros/Hwang, relatórios SEC e cobertura WSJ/Bloomberg dos casos LTCM, Barings, SocGen e Archegos.</div><div class="corner br"></div></section><div style="height:40px"></div></body></html></script>
