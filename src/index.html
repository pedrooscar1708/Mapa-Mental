function walk(node, depth, parent, fn) {
  fn(node, depth, parent);
  if (node.children) for (const c of node.children) walk(c, depth + 1, node, fn);
}
function findNode(rootNode, nid) {
  let found = null;
  walk(rootNode, 0, null, (n) => { if (n.id === nid) found = n; });
  return found;
}
function findParent(rootNode, nid) {
  let parent = null;
  walk(rootNode, 0, null, (n, d, p) => { if (n.id === nid) parent = p; });
  return parent;
}
function isDescendantOrSelf(parentNode, descendantId) {
  if (parentNode.id === descendantId) return true;
  if (!parentNode.children) return false;
  for (const c of parentNode.children) if (isDescendantOrSelf(c, descendantId)) return true;
  return false;
}
function reparent(node, newParent) {
  const oldParent = findParent(data, node.id);
  if (!oldParent || oldParent.id === newParent.id) return false;
  if (isDescendantOrSelf(node, newParent.id)) return false;
  oldParent.children = oldParent.children.filter(c => c.id !== node.id);
  if (!newParent.children) newParent.children = [];
  newParent.children.push(node);
  node.x = newParent.x + 320;
  node.y = newParent.y + Math.max(0, (newParent.children.length - 1)) * 60;
  return true;
}

const canvas = document.getElementById("canvas");
const linksSvg = document.getElementById("links");
const wrap = document.getElementById("canvas-wrap");

let viewX = 0, viewY = 0, zoom = 1;
const ZOOM_MIN = 0.15, ZOOM_MAX = 3;
let panning = false, panStartX = 0, panStartY = 0, panOrigX = 0, panOrigY = 0;

function applyTransform() {
  canvas.style.transform = `translate(${viewX}px, ${viewY}px) scale(${zoom})`;
  const zv = document.getElementById("zoom-val");
  if (zv) zv.textContent = Math.round(zoom * 100) + "%";
}
function setZoom(newZoom, cx, cy) {
  newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
  if (cx === undefined) { cx = wrap.clientWidth / 2; cy = wrap.clientHeight / 2; }
  const r = newZoom / zoom;
  viewX = cx - (cx - viewX) * r;
  viewY = cy - (cy - viewY) * r;
  zoom = newZoom;
  applyTransform();
}
function centerOnNode(node) {
  viewX = wrap.clientWidth / 2 - node.x * zoom;
  viewY = wrap.clientHeight / 2 - node.y * zoom;
  applyTransform();
}
function setupPanZoom() {
  wrap.addEventListener("mousedown", (e) => {
    if (e.target.closest(".node")) return;
    panning = true; panStartX = e.clientX; panStartY = e.clientY;
    panOrigX = viewX; panOrigY = viewY;
    wrap.classList.add("panning");
    e.preventDefault();
  });
  document.addEventListener("mousemove", (e) => {
    if (!panning) return;
    viewX = panOrigX + (e.clientX - panStartX);
    viewY = panOrigY + (e.clientY - panStartY);
    applyTransform();
  });
  document.addEventListener("mouseup", () => {
    if (panning) { panning = false; wrap.classList.remove("panning"); }
  });
  wrap.addEventListener("touchstart", (e) => {
    if (e.target.closest(".node")) return;
    if (e.touches.length !== 1) return;
    panning = true; panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY;
    panOrigX = viewX; panOrigY = viewY;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchmove", (e) => {
    if (!panning || e.touches.length !== 1) return;
    viewX = panOrigX + (e.touches[0].clientX - panStartX);
    viewY = panOrigY + (e.touches[0].clientY - panStartY);
    applyTransform();
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchend", () => { panning = false; });
  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
    setZoom(zoom * factor, mx, my);
  }, { passive: false });
  document.getElementById("zoom-in").onclick = () => setZoom(zoom * 1.2);
  document.getElementById("zoom-out").onclick = () => setZoom(zoom / 1.2);
  document.getElementById("zoom-reset").onclick = () => { zoom = 1; centerOnNode(data); };
}

// === IDB para PDFs do usuário ===
const FILES_DB = "mapa-mental-files", FILES_STORE = "files";
function openFilesDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FILES_DB, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(FILES_STORE)) db.createObjectStore(FILES_STORE);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
async function storeUserFile(id, blob, name, type) {
  const db = await openFilesDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FILES_STORE, "readwrite");
    tx.objectStore(FILES_STORE).put({ blob, name, type, savedAt: Date.now() }, id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}
async function getUserFile(id) {
  const db = await openFilesDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FILES_STORE, "readonly");
    const req = tx.objectStore(FILES_STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e.target.error);
  });
}
async function deleteUserFile(id) {
  const db = await openFilesDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(FILES_STORE, "readwrite");
    tx.objectStore(FILES_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}
function attachUserFile(node) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".pdf,.html,.htm,image/*,.docx,.xlsx,.pptx,.txt,.md";
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) { alert("Máximo 25 MB."); return; }
    try {
      const fid = "file_" + Math.random().toString(36).slice(2, 12) + "_" + Date.now();
      await storeUserFile(fid, file, file.name, file.type || "application/octet-stream");
      node.userDoc = { name: file.name, type: file.type || "application/octet-stream", id: fid, size: file.size };
      save(); render(); toast("Arquivo anexado: " + file.name);
    } catch (err) { alert("Erro: " + (err.message || err)); }
  };
  input.click();
}
async function openUserFile(node) {
  if (!node.userDoc) return;
  try {
    let blob;
    if (node.userDoc.data) {
      // Modo PORTÁTIL: PDF inline em base64 (recebido via arquivo compartilhado)
      const bc = atob(node.userDoc.data);
      const bytes = new Uint8Array(bc.length);
      for (let i = 0; i < bc.length; i++) bytes[i] = bc.charCodeAt(i);
      blob = new Blob([bytes], { type: node.userDoc.type || "application/octet-stream" });
    } else if (node.userDoc.id) {
      // Modo LOCAL: PDF no IndexedDB do navegador
      const rec = await getUserFile(node.userDoc.id);
      if (!rec || !rec.blob) { alert("Arquivo não encontrado. Anexe de novo."); return; }
      blob = rec.blob;
    } else { alert("Anexo inválido."); return; }
    const url = URL.createObjectURL(blob);
    const win = window.open(url, "_blank");
    if (!win) alert("Permita pop-ups.");
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch (err) { alert("Erro: " + (err.message || err)); }
}
async function removeUserFile(node) {
  if (!node.userDoc) return;
  if (!confirm('Remover "' + node.userDoc.name + '"?')) return;
  try {
    if (node.userDoc.id) await deleteUserFile(node.userDoc.id);
    delete node.userDoc;
    save(); render(); toast("Arquivo removido");
  } catch (err) { alert("Erro: " + (err.message || err)); }
}

// === Links externos ===
function iconForUrl(url) {
  if (!url) return "🔗";
  try {
    const h = new URL(url).hostname.toLowerCase();
    if (h.includes("youtube") || h.includes("youtu.be")) return "▶";
    if (h.includes("instagram")) return "📷";
    if (h.includes("drive.google") || h.includes("docs.google")) return "📁";
    if (h.includes("facebook")) return "f";
    if (h.includes("twitter") || h.includes("x.com")) return "𝕏";
    if (h.includes("tiktok")) return "♪";
    if (h.includes("wa.me") || h.includes("whatsapp")) return "💬";
    if (h.includes("t.me") || h.includes("telegram")) return "✈";
    if (h.includes("linkedin")) return "in";
    if (h.includes("github")) return "GH";
    if (h.includes("tradingview")) return "📊";
    return "🔗";
  } catch (e) { return "🔗"; }
}
function titleForUrl(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch(e) { return url; }
}
function addLinkToNode(node) {
  let url = prompt("Cole o link (https://...):");
  if (!url || !url.trim()) return;
  url = url.trim();
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  try { new URL(url); } catch(e) { alert("Link inválido."); return; }
  const defaultTitle = titleForUrl(url);
  const title = prompt("Nome do link (opcional):", "");
  if (!node.links) node.links = [];
  node.links.push({ url, title: (title || "").trim() || defaultTitle, id: "lk_" + Math.random().toString(36).slice(2, 10) });
  save(); render(); toast("Link adicionado");
}
function removeLink(node, linkId) {
  if (!node.links) return;
  const link = node.links.find(l => l.id === linkId);
  if (!link) return;
  if (!confirm('Remover "' + link.title + '"?')) return;
  node.links = node.links.filter(l => l.id !== linkId);
  save(); render(); toast("Link removido");
}
function openLink(url) {
  const win = window.open(url, "_blank", "noopener,noreferrer");
  if (!win) alert("Permita pop-ups.");
}

// === Abrir trabalho embutido (built-in) ===
function openEmbeddedDoc(docName) {
  const cleanName = (docName || "").replace(".html", "").replace(".pdf", "");
  
  // Tenta carregar de docs/ primeiro (novos arquivos)
  const docPath = "/Mapa-Mental/docs/" + cleanName + ".html";
  const pdfPath = "/Mapa-Mental/docs/" + cleanName + ".pdf";
  
  // Tenta HTML primeiro
  fetch(docPath)
    .then(r => r.ok ? r.text() : fetch(pdfPath).then(p => p.ok ? p.blob() : null))
    .then(content => {
      if (content instanceof Blob) {
        const url = URL.createObjectURL(content);
        window.open(url, "_blank");
        return;
      }
      if (content) {
        const blob = new Blob([content], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
        return;
      }
      // Se não encontrou em docs/, tenta embutido
      const el = document.getElementById("doc-" + cleanName);
      if (!el) { 
        alert("Documento não encontrado: " + docName); 
        return; 
      }
      const embeddedContent = el.textContent;
      const blob = new Blob([embeddedContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const win = window.open(url, "_blank");
      if (!win) alert("Permita pop-ups.");
      setTimeout(() => URL.revokeObjectURL(url), 120000);
    })
    .catch(() => {
      // Se falhar, tenta embutido
      const el = document.getElementById("doc-" + cleanName);
      if (!el) { 
        alert("Documento não encontrado: " + docName); 
        return; 
      }
      const embeddedContent = el.textContent;
      const blob = new Blob([embeddedContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const win = window.open(url, "_blank");
      if (!win) alert("Permita pop-ups.");
    });
}

// === Render ===
function render() {
  [...canvas.querySelectorAll(".node")].forEach(el => el.remove());
  linksSvg.innerHTML = "";
  const renderRec = (node, depth, parent) => {
    const el = createNodeEl(node, depth, parent);
    canvas.appendChild(el);
    if (parent) drawLink(parent, node, depth);
    if (!node.collapsed && node.children) for (const c of node.children) renderRec(c, depth + 1, node);
  };
  renderRec(data, 0, null);
}

function createNodeEl(node, depth, parent) {
  const el = document.createElement("div");
  el.className = "node";
  el.dataset.id = node.id;
  el.dataset.depth = depth;
  if (node.branch) el.dataset.branch = node.branch;
  if (node.collapsed) el.classList.add("collapsed");
  if ((node.children || []).length > 0) el.classList.add("has-children");
  if (selectedId === node.id) el.classList.add("selected");
  if (node.doc || node.userDoc) el.classList.add("has-doc");
  if (node.userDoc) el.classList.add("has-user-doc");
  el.style.left = node.x + "px";
  el.style.top = node.y + "px";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = node.text;
  label.contentEditable = "false";
  el.appendChild(label);

  if (node.userDoc) {
    const btn = document.createElement("a");
    btn.className = "open-doc user-doc";
    btn.textContent = "📎 " + (node.userDoc.name.length > 18 ? node.userDoc.name.slice(0, 15) + "…" : node.userDoc.name);
    btn.href = "#";
    btn.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); openUserFile(node); });
    btn.addEventListener("mousedown", e => e.stopPropagation());
    el.appendChild(btn);
  } else if (node.doc) {
    const btn = document.createElement("a");
    btn.className = "open-doc";
    btn.textContent = "Abrir trabalho →";
    btn.href = "#";
    btn.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); openEmbeddedDoc(node.doc); });
    btn.addEventListener("mousedown", e => e.stopPropagation());
    el.appendChild(btn);
  }

  if (node.links && node.links.length > 0) {
    const ld = document.createElement("div");
    ld.className = "node-links";
    for (const link of node.links) {
      const b = document.createElement("a");
      b.className = "link-badge";
      b.href = link.url;
      b.target = "_blank";
      b.title = link.title + " — " + link.url;
      const ic = document.createElement("span"); ic.className = "link-icon"; ic.textContent = iconForUrl(link.url);
      b.appendChild(ic);
      const tx = document.createElement("span"); tx.className = "link-text";
      tx.textContent = (link.title || "").slice(0, 12) + ((link.title || "").length > 12 ? "…" : "");
      b.appendChild(tx);
      const rm = document.createElement("span"); rm.className = "link-remove"; rm.textContent = "×";
      rm.onclick = (e) => { e.preventDefault(); e.stopPropagation(); removeLink(node, link.id); };
      rm.addEventListener("mousedown", e => e.stopPropagation());
      b.appendChild(rm);
      b.addEventListener("click", (e) => {
        if (e.target === rm) return;
        e.preventDefault(); e.stopPropagation();
        openLink(link.url);
      });
      b.addEventListener("mousedown", e => e.stopPropagation());
      ld.appendChild(b);
    }
    el.appendChild(ld);
  }

  const controls = document.createElement("div");
  controls.className = "controls";
  const addBtn = document.createElement("button");
  addBtn.className = "ctrl add"; addBtn.textContent = "+ filho";
  addBtn.onclick = (e) => { e.stopPropagation(); addChild(node); };
  controls.appendChild(addBtn);

  if (node.userDoc) {
    const b = document.createElement("button");
    b.className = "ctrl"; b.textContent = "🗑️ tirar arquivo";
    b.onclick = (e) => { e.stopPropagation(); removeUserFile(node); };
    controls.appendChild(b);
  } else {
    const b = document.createElement("button");
    b.className = "ctrl"; b.textContent = "📎 anexar PDF";
    b.onclick = (e) => { e.stopPropagation(); attachUserFile(node); };
    controls.appendChild(b);
  }
  const linkBtn = document.createElement("button");
  linkBtn.className = "ctrl"; linkBtn.textContent = "🔗 + link";
  linkBtn.onclick = (e) => { e.stopPropagation(); addLinkToNode(node); };
  controls.appendChild(linkBtn);

  if (depth > 0) {
    const delBtn = document.createElement("button");
    delBtn.className = "ctrl del"; delBtn.textContent = "× excluir";
    delBtn.onclick = (e) => { e.stopPropagation(); deleteNode(node); };
    controls.appendChild(delBtn);
  }
  el.appendChild(controls);

  if ((node.children || []).length > 0) {
    const t = document.createElement("button");
    t.className = "toggle"; t.textContent = node.collapsed ? "+" : "−";
    t.onclick = (e) => { e.stopPropagation(); node.collapsed = !node.collapsed; save(); render(); };
    el.appendChild(t);
  }
  attachEvents(el, label, node);
  return el;
}

function drawLink(parent, child, childDepth) {
  const ns = "http://www.w3.org/2000/svg";
  const path = document.createElementNS(ns, "path");
  const x1 = parent.x, y1 = parent.y, x2 = child.x, y2 = child.y;
  const dx = (x2 - x1) * 0.5;
  path.setAttribute("d", `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
  path.setAttribute("fill", "none");
  let stroke = "#cbd5e1", width = 1.5;
  if (childDepth === 1) { stroke = child.branch === "a" ? "#2563eb" : "#059669"; width = 2.5; }
  else if (childDepth === 2) { width = 1.8; stroke = "#94a3b8"; }
  path.setAttribute("stroke", stroke);
  path.setAttribute("stroke-width", width);
  path.setAttribute("stroke-linecap", "round");
  linksSvg.appendChild(path);
}

function attachEvents(el, label, node) {
  el.addEventListener("click", (e) => {
    if (e.target === label && label.contentEditable === "true") return;
    selectedId = node.id;
    document.querySelectorAll(".node.selected").forEach(n => n.classList.remove("selected"));
    el.classList.add("selected");
  });
  label.addEventListener("dblclick", (e) => { e.stopPropagation(); startEdit(label, node); });
  label.addEventListener("click", (e) => {
    if (selectedId === node.id && label.contentEditable !== "true") { e.stopPropagation(); startEdit(label, node); }
  });
  makeDraggable(el, node);
}
function startEdit(label, node) {
  label.contentEditable = "true";
  label.focus();
  const r = document.createRange();
  r.selectNodeContents(label);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  const finish = () => {
    label.contentEditable = "false";
    const txt = label.textContent.trim() || "(sem título)";
    label.textContent = txt;
    if (node.text !== txt) { node.text = txt; save(); }
    label.removeEventListener("blur", finish);
    label.removeEventListener("keydown", onKey);
  };
  const onKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); label.blur(); }
    else if (e.key === "Escape") { label.textContent = node.text; label.blur(); }
  };
  label.addEventListener("blur", finish);
  label.addEventListener("keydown", onKey);
}
function makeDraggable(el, node) {
  let sx, sy, ox, oy, dragging = false, moved = false, lastTarget = null;
  const onDown = (e) => {
    if (e.target.contentEditable === "true") return;
    if (e.target.tagName === "BUTTON" || e.target.tagName === "A") return;
    const pt = pointer(e);
    sx = pt.x; sy = pt.y; ox = node.x; oy = node.y;
    dragging = true; moved = false; lastTarget = null;
    el.classList.add("dragging"); e.preventDefault();
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("touchend", onUp);
  };
  const onMove = (e) => {
    if (!dragging) return;
    const pt = pointer(e);
    const dx = (pt.x - sx) / zoom, dy = (pt.y - sy) / zoom;
    if (Math.abs(dx) + Math.abs(dy) > 3 / zoom) moved = true;
    node.x = ox + dx; node.y = oy + dy;
    el.style.left = node.x + "px"; el.style.top = node.y + "px";
    redrawLinks();
    if (moved) {
      el.style.pointerEvents = "none";
      const at = document.elementFromPoint(pt.x, pt.y);
      el.style.pointerEvents = "";
      const tgt = at ? at.closest(".node") : null;
      if (lastTarget && lastTarget !== tgt) { lastTarget.classList.remove("drop-target"); lastTarget = null; }
      if (tgt && tgt !== el) {
        const tid = tgt.dataset.id;
        if (tid && !isDescendantOrSelf(node, tid)) { tgt.classList.add("drop-target"); lastTarget = tgt; }
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
    let did = false;
    if (lastTarget) {
      const tid = lastTarget.dataset.id;
      lastTarget.classList.remove("drop-target");
      const tn = findNode(data, tid);
      const op = findParent(data, node.id);
      if (tn && tid !== node.id && !isDescendantOrSelf(node, tid) && (!op || op.id !== tid)) {
        if (confirm('Mover "' + node.text + '" para dentro de "' + tn.text + '"?')) {
          reparent(node, tn); save(); render(); did = true;
        } else {
          node.x = ox; node.y = oy;
          el.style.left = ox + "px"; el.style.top = oy + "px";
          redrawLinks();
        }
      }
    }
    if (moved && !did) save();
    lastTarget = null;
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.removeEventListener("touchmove", onMove);
    document.removeEventListener("touchend", onUp);
  };
  el.addEventListener("mousedown", onDown);
  el.addEventListener("touchstart", onDown, { passive: false });
}
function pointer(e) {
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function redrawLinks() {
  linksSvg.innerHTML = "";
  walk(data, 0, null, (n, d, p) => { if (p && !isCollapsedAncestor(n)) drawLink(p, n, d); });
}
function isCollapsedAncestor(node) {
  let p = findParent(data, node.id);
  while (p) { if (p.collapsed) return true; p = findParent(data, p.id); }
  return false;
}

function addChild(parent) {
  const n = { id: id(), text: "Novo nó", x: parent.x + 320, y: parent.y + 60, collapsed: false, children: [] };
  parent.children = parent.children || [];
  parent.children.push(n);
  parent.collapsed = false;
  selectedId = n.id;
  save(); render();
  setTimeout(() => {
    const el = canvas.querySelector(`.node[data-id="${n.id}"] .label`);
    if (el) startEdit(el, n);
  }, 50);
}
function deleteNode(node) {
  if (node.id === data.id) { toast("Não dá pra excluir a raiz."); return; }
  if (!confirm(`Excluir "${node.text}"` + (node.children && node.children.length ? " e filhos?" : "?"))) return;
  const p = findParent(data, node.id);
  if (p) {
    p.children = p.children.filter(c => c.id !== node.id);
    if (selectedId === node.id) selectedId = p.id;
    save(); render();
  }
}

document.getElementById("btn-add").onclick = () => {
  const t = selectedId ? findNode(data, selectedId) : data;
  addChild(t || data);
};
document.getElementById("btn-fit").onclick = () => { zoom = 1; centerOnNode(data); };
document.getElementById("btn-export").onclick = () => {
  const b = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = `mapa-mental-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(u);
  toast("Arquivo exportado.");
};
document.getElementById("btn-import").onclick = () => document.getElementById("file-input").click();
document.getElementById("file-input").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const p = JSON.parse(ev.target.result);
      if (!p.id || !p.text) throw new Error("Formato inválido");
      data = p; selectedId = null; _migrateDocs(data); save(); render();
      toast("Mapa importado.");
    } catch (err) { alert("Erro: " + err.message); }
  };
  r.readAsText(f); e.target.value = "";
});
document.getElementById("btn-reset").onclick = () => {
  if (!confirm("Atualizar com nós novos do padrão? Não apaga nada seu.")) return;
  const defaults = defaultData();
  let added = 0;
  function merge(u, d) {
    if (d.doc && !u.doc) { u.doc = d.doc; added++; }
    if (d.branch && !u.branch) u.branch = d.branch;
    if (!d.children || !d.children.length) return;
    if (!u.children) u.children = [];
    for (const dc of d.children) {
      if (!dc.text) continue;
      const dk = dc.text.toLowerCase().trim();
      const uc = u.children.find(c => c.text && c.text.toLowerCase().trim() === dk);
      if (uc) merge(uc, dc);
      else { u.children.push(JSON.parse(JSON.stringify(dc))); added++; }
    }
  }
  merge(data, defaults);
  save(); render();
  toast(added > 0 ? "Adicionado: " + added + " item(s)" : "Já atualizado!");
};

// ===== EXPORTAR MAPA PORTÁTIL =====
// Gera um HTML único auto-suficiente, com TODOS os PDFs embutidos em base64.
// Quem receber o arquivo via WhatsApp/Telegram/Email só precisa abrir — tudo funciona.
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onloadend = () => {
      const res = r.result || "";
      const i = res.indexOf(",");
      resolve(i >= 0 ? res.slice(i + 1) : res);
    };
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
async function generateShareableHTML() {
  try {
    toast("Empacotando mapa portátil…");
    const sd = JSON.parse(JSON.stringify(data));
    const tasks = [];
    let pdfCount = 0;
    function collect(n) {
      if (n.userDoc && n.userDoc.id && !n.userDoc.data) {
        pdfCount++;
        tasks.push(getUserFile(n.userDoc.id).then(rec => {
          if (rec && rec.blob) return blobToBase64(rec.blob).then(b64 => {
            n.userDoc = { name: n.userDoc.name, type: n.userDoc.type, size: rec.blob.size, data: b64 };
          });
        }).catch(() => {}));
      }
      if (n.children) for (const c of n.children) collect(c);
    }
    collect(sd);
    if (tasks.length > 0) {
      toast("Embutindo " + pdfCount + " PDF(s) — aguarde…");
      await Promise.all(tasks);
    }
    const src = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const json = JSON.stringify(sd).replace(/<\/script>/gi, "<\\/script>");
    const inject = '<script id="shared-data-injection">window.SHARED_DATA = ' + json + ';<\/script>\n';
    const finalHtml = src.replace("</head>", inject + "</head>");
    const blob = new Blob([finalHtml], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Mapa Mental - Os Traders Alunos (" + new Date().toISOString().slice(0,10) + ").html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    const mb = (finalHtml.length / 1024 / 1024).toFixed(1);
    setTimeout(() => toast("✓ Mapa portátil baixado (" + mb + " MB) — " + pdfCount + " PDF(s)"), 300);
  } catch (err) {
    alert("Erro ao gerar mapa portátil: " + (err.message || err));
  }
}
document.getElementById("btn-share").onclick = generateShareableHTML;

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

document.addEventListener("keydown", (e) => {
  if (document.activeElement && document.activeElement.contentEditable === "true") return;
  if (e.key === "Tab" && selectedId) {
    e.preventDefault();
    const t = findNode(data, selectedId);
    if (t) addChild(t);
  } else if ((e.key === "Delete" || e.key === "Backspace") && selectedId && selectedId !== data.id) {
    const t = findNode(data, selectedId);
    if (t) deleteNode(t);
  }
});

setupPanZoom();
render();
setTimeout(() => { centerOnNode(data); }, 50);
