<style>:root{--bg:#f7f8fa;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#cbd5e1;--accent:#2563eb;--accent-soft:#dbeafe;--root:#111827;--branch-a:#2563eb;--branch-b:#059669;--leaf:#fff;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);--radius:10px}*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}.toolbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid #e5e7eb;box-shadow:var(--shadow)}.toolbar h1{font-size:15px;margin:0 12px 0 4px;font-weight:600;letter-spacing:.2px}.toolbar .spacer{flex:1}.btn{border:1px solid #e5e7eb;background:#fff;color:var(--ink);padding:7px 12px;font-size:13px;border-radius:8px;cursor:pointer;transition:.15s}.btn:hover{background:#f3f4f6;border-color:#d1d5db}.btn:active{transform:translateY(1px)}.hint{font-size:12px;color:var(--muted);margin-left:4px}.save-indicator{font-size:11px;padding:4px 8px;border-radius:4px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;opacity:0;transition:opacity .3s}.save-indicator.show{opacity:1}.canvas-wrap{position:relative;width:100%;height:calc(100vh - 56px);overflow:hidden;cursor:grab;background:radial-gradient(circle at 1px 1px,#e5e7eb 1px,transparent 1px) 0 0/24px 24px,var(--bg)}.canvas-wrap.panning{cursor:grabbing}.canvas{position:absolute;top:0;left:0;width:1px;height:1px;transform-origin:0 0;will-change:transform}.canvas svg.links{position:absolute;top:0;left:0;width:1px;height:1px;overflow:visible;pointer-events:none}.zoom-indicator{position:absolute;bottom:14px;right:14px;background:var(--panel);border:1px solid #e5e7eb;border-radius:8px;padding:4px 6px;font-size:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:2px;z-index:20}.zoom-indicator button{border:none;background:transparent;color:var(--ink);cursor:pointer;padding:4px 8px;font-size:14px;font-weight:600;border-radius:4px;line-height:1}.zoom-indicator button:hover{background:#f3f4f6}.zoom-indicator .zoom-val{min-width:44px;text-align:center;font-weight:600;font-size:12px;padding:0 4px}.node{position:absolute;min-width:120px;max-width:240px;padding:10px 14px;background:var(--leaf);border:1px solid #e5e7eb;border-radius:var(--radius);box-shadow:var(--shadow);cursor:grab;user-select:none;transition:.15s;transform:translate(-50%,-50%)}.node:hover{border-color:var(--accent);box-shadow:0 2px 4px rgba(0,0,0,.06),0 8px 20px rgba(37,99,235,.12)}.node:active{cursor:grabbing}.node.dragging{opacity:.85}.node .label{font-size:14px;line-height:1.35;outline:none;word-break:break-word;min-height:1em}.node .label[contenteditable=true]:focus{background:var(--accent-soft);border-radius:4px;padding:2px 4px;margin:-2px -4px}.node .controls{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;opacity:0;transition:opacity .15s}.node:hover .controls,.node.selected .controls{opacity:1}.node .ctrl{border:none;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;padding:2px 6px;border-radius:4px}.node .ctrl:hover{background:#f3f4f6;color:var(--ink)}.node .ctrl.add{color:var(--accent)}.node .ctrl.del{color:#b91c1c}.node .toggle{position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#fff;border:1.5px solid var(--accent);font-size:14px;font-weight:700;line-height:18px;text-align:center;cursor:pointer;color:var(--accent);display:none;box-shadow:0 1px 3px rgba(0,0,0,.12);z-index:5;transition:transform .1s}.node.has-children .toggle{display:block}.node.collapsed .toggle{background:var(--accent);color:#fff}.node .toggle:hover{transform:translateY(-50%) scale(1.15)}.node[data-depth="0"]{background:var(--root);color:#fff;border-color:var(--root);font-weight:600}.node[data-depth="0"] .label,.node[data-depth="0"] .ctrl{color:#fff}.node[data-depth="1"][data-branch="a"]{background:var(--branch-a);color:#fff;border-color:var(--branch-a);font-weight:600}.node[data-depth="1"][data-branch="b"]{background:var(--branch-b);color:#fff;border-color:var(--branch-b);font-weight:600}.node[data-depth="1"] .label,.node[data-depth="1"] .ctrl{color:#fff}.node[data-depth="2"]{border-left:3px solid var(--accent)}.node[data-depth="3"]{border-left:3px solid #94a3b8;font-size:13px}.node[data-depth="4"]{border-left:3px solid #a78bfa;font-size:13px}.node[data-depth="5"]{border-left:3px solid #f472b6;font-size:13px}.node[data-depth="6"]{border-left:3px solid #fb923c;font-size:12px}.node.selected{outline:2px solid var(--accent);outline-offset:2px}.node.drop-target{outline:3px dashed var(--accent);outline-offset:4px;background:rgba(192,57,43,.08)!important;transform:translate(-50%,-50%) scale(1.05);z-index:10}.node.has-doc{border-left:3px solid #c0392b!important;padding-right:28px}.node.has-doc .label{font-weight:600}.node.has-doc::after{content:"📄";position:absolute;top:8px;right:8px;font-size:12px;opacity:.7}.node.has-doc .open-doc{display:inline-block;margin-top:6px;background:#c0392b;color:#fff;border:none;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none}.node.has-doc .open-doc:hover{background:#a93226}.node.has-doc .open-doc.user-doc{background:#059669}.node.has-doc .open-doc.user-doc:hover{background:#047857}.node.has-user-doc{border-left-color:#059669!important}.node.has-user-doc::after{content:"📎"}.node-links{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.link-badge{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid #d1d5db;padding:2px 6px;border-radius:10px;font-size:11px;text-decoration:none;color:var(--ink);cursor:pointer}.link-badge:hover{background:#eff6ff;border-color:var(--accent)}.link-badge .link-icon{font-size:12px;font-weight:700}.link-badge .link-text{font-size:10.5px;color:var(--muted)}.link-badge .link-remove{font-size:13px;color:#b91c1c;margin-left:2px;opacity:0;line-height:1;padding:0 2px;border-radius:3px}.link-badge:hover .link-remove{opacity:1}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}.toast.show{opacity:.95}@media(max-width:640px){.toolbar h1{display:none}.btn{padding:6px 10px;font-size:12px}.node{min-width:100px;max-width:180px}}</style>

<script type="text/html" id="doc-candlestick"><!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Candlestick — por Pedro Oscar</title><style>:root{--paper:#f7f1e7;--ink:#1a1a1a;--muted:#4a4a4a;--line:#1a1a1a;--accent:#c0392b;--green:#27ae60}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}.topbar{position:fixed;top:0;left:0;right:0;background:rgba(247,241,231,0.94);backdrop-filter:blur(6px);border-bottom:1px solid #d8cdb7;z-index:50;display:flex;gap:8px;align-items:center;padding:10px 18px;font-size:13px}.topbar a,.topbar button{background:#fff;color:var(--ink);border:1px solid #d8cdb7;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:13px;cursor:pointer;font-family:inherit}.topbar a:hover,.topbar button:hover{background:#efe7d6}.topbar .spacer{flex:1}.topbar small{color:var(--muted)}.page{position:relative;width:100%;max-width:960px;min-height:540px;margin:24px auto;padding:64px 72px;background:var(--paper);border:1px solid #d8cdb7;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);overflow:hidden}.page:first-of-type{margin-top:80px}.corner{position:absolute;width:140px;height:140px;pointer-events:none}.corner.tl{top:24px;left:36px;border-top:1.5px solid var(--line);border-left:1.5px solid var(--line);width:60%}.corner.br{bottom:24px;right:36px;border-bottom:1.5px solid var(--line);border-right:1.5px solid var(--line);width:60%}.dots{position:absolute;width:130px;height:130px;background-image:radial-gradient(circle,#1a1a1a 2px,transparent 2.5px);background-size:18px 18px;pointer-events:none}.dots.tl{top:30px;left:30px}.dots.tr{top:30px;right:30px}.dots.bl{bottom:30px;left:30px}.dots.br{bottom:30px;right:30px}.dots.small{width:90px;height:90px}.title-mono{font-family:"Courier New","Lucida Console",monospace;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.h-big{font-size:42px;margin:0;letter-spacing:.18em}.h-section{font-family:"Courier New",monospace;font-weight:700;font-size:28px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px 0}.h-sub{font-size:18px;font-weight:600;margin:22px 0 8px 0}.author{font-size:22px;color:var(--muted);font-weight:400;margin-top:8px}.body-text{font-size:15.5px;line-height:1.65}.body-text p{margin:0 0 12px 0}.body-text strong{color:var(--ink)}ul.topics{list-style:none;padding:0;margin:0;font-family:"Courier New",monospace;font-size:16px;letter-spacing:.06em}ul.topics li{padding:6px 0 6px 24px;position:relative;text-transform:uppercase}ul.topics li::before{content:"•";position:absolute;left:4px;top:6px;font-size:18px}.cover{min-height:640px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px 60px}.cover .h-big{font-size:56px}.two-col{display:grid;grid-template-columns:1fr 1.4fr;gap:40px;align-items:start;position:relative;z-index:1}.book{background:#fff;border:1px solid #d8cdb7;border-left:4px solid var(--line);border-radius:4px;padding:14px 18px;margin-bottom:14px}.book .num{font-family:"Courier New",monospace;font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.1em}.book h4{margin:4px 0 4px 0;font-size:16px;font-weight:700}.book .meta{color:var(--muted);font-size:13px;margin-bottom:8px;font-style:italic}.book p{margin:0;font-size:14px;line-height:1.55}.candle-fig{background:#fff;border:1px solid #d8cdb7;border-radius:6px;padding:24px;text-align:center}.candle-fig svg{max-width:100%;height:auto}.candle-caption{font-size:13px;color:var(--muted);margin-top:10px;font-style:italic}.patterns{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}.pattern{background:#fff;border:1px solid #d8cdb7;border-radius:4px;padding:12px}.pattern h5{margin:0 0 4px 0;font-size:14px;font-weight:700;font-family:"Courier New",monospace}.pattern p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}.contact-block{font-family:"Courier New",monospace;font-size:16px;line-height:2}@media(max-width:720px){.page{padding:40px 26px;min-height:auto}.two-col{grid-template-columns:1fr;gap:20px}.h-big{font-size:30px!important}.h-section{font-size:22px}.cover{padding:50px 24px;min-height:auto}.cover .h-big{font-size:34px!important}.author{font-size:18px}.corner,.dots{transform:scale(.7)}}@media print{body{background:#fff}.topbar{display:none}.page{page-break-after:always;box-shadow:none;margin:0 auto;border:none;max-width:none;width:100%}.page:last-child{page-break-after:auto}}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a><button onclick="window.print()">Imprimir / Salvar PDF</button><div class="spacer"></div><small>Trabalho — Candlestick</small></div><section class="page cover"><div class="dots tl"></div><div class="corner tl"></div><h1 class="title-mono h-big">CANDLESTICK</h1><div class="author">por Pedro Oscar</div><div class="corner br"></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><div class="dots tr"></div><h2 class="title-mono h-section">Olá, eu sou o Pedro</h2><p class="body-text" style="font-size:17px">Aluno Vasco Mamede do mês de outubro 2025</p><div class="dots bl"></div></section><section class="page"><div class="corner tl"></div><div class="two-col"><div class="left"><h2 class="title-mono h-section">Tópicos<br/>de<br/>Abordagem</h2></div><div class="right"><ul class="topics"><li>História</li><li>Quando começou</li><li>3 principais livros em inglês</li><li>3 principais livros em português</li><li>Como funcionam</li><li>Curiosidades</li><li>Conclusão</li></ul></div></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">História</h2><div class="body-text"><p>O candlestick — ou <strong>"velas japonesas"</strong> — tem origem no Japão do século XVII. Foi desenvolvido por comerciantes de arroz em <strong>Osaka</strong>, na bolsa de arroz de <strong>Dojima</strong>, considerada uma das primeiras bolsas de futuros do mundo.</p><p>O método permitia visualizar abertura, fechamento, máxima e mínima de cada período numa única figura, tornando a leitura do mercado muito mais intuitiva do que tabelas numéricas. Cada vela contava uma história: quem dominou aquele período — comprador ou vendedor — e com que intensidade.</p><p>Por mais de 200 anos, o candlestick permaneceu restrito ao Japão. Só na década de 1990 a técnica chegou ao Ocidente, quando o analista <strong>Steve Nison</strong> publicou "Japanese Candlestick Charting Techniques" (1991), traduzindo e sistematizando o conhecimento japonês para traders americanos e europeus.</p><p>Hoje é a forma de leitura gráfica mais usada no mundo, presente em praticamente todas as plataformas de análise técnica de ações, forex e cripto.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Quando começou</h2><div class="body-text"><p>A técnica é atribuída a <strong>Munehisa Homma (1724–1803)</strong>, um próspero comerciante de arroz da família Homma, de Sakata. Por volta de <strong>1755</strong>, Homma sistematizou registros gráficos baseados na <strong>psicologia coletiva do mercado</strong>: percebeu que o preço do arroz não refletia apenas oferta e demanda físicas, mas também o medo e a ganância dos negociantes.</p><h3 class="h-sub">Linha do tempo</h3><p><strong>~1700:</strong> primeiros registros gráficos rudimentares na bolsa de arroz de Dojima.</p><p><strong>1755:</strong> Munehisa Homma publica "San-en Kinsen Hiroku" — primeiro tratado sobre psicologia de mercado.</p><p><strong>Séc. XIX:</strong> a técnica é refinada por outros analistas japoneses, gerando padrões consagrados como <em>Sakata's Five Methods</em>.</p><p><strong>1989–1991:</strong> Steve Nison apresenta o candlestick ao Ocidente.</p><p><strong>Anos 2000+:</strong> com plataformas eletrônicas, vira o padrão visual default do mercado.</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">3 Principais Livros em Inglês</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Japanese Candlestick Charting Techniques</h4><div class="meta">Steve Nison — 1991</div><p>A obra que apresentou o candlestick ao Ocidente. Cobre desde os padrões básicos (Doji, Martelo, Engolfo) até combinações complexas. <strong>Como funciona:</strong> apresenta cada padrão com nome japonês original, exemplo gráfico real e contexto de uso, ensinando o leitor a reconhecer a psicologia por trás da formação.</p></div><div class="book"><div class="num">02</div><h4>The Candlestick Course</h4><div class="meta">Steve Nison — 2003</div><p>Versão didática e prática da obra original, com exercícios. <strong>Como funciona:</strong> apresenta os padrões em ordem de relevância e ensina a combiná-los com S/R e indicadores ocidentais como médias móveis e RSI.</p></div><div class="book"><div class="num">03</div><h4>Encyclopedia of Candlestick Charts</h4><div class="meta">Thomas N. Bulkowski — 2008</div><p>Estudo estatístico massivo: cada padrão testado em milhares de gráficos reais com taxa de acerto medida. <strong>Como funciona:</strong> ficha de cada padrão com definição, taxa de reversão/continuação, melhores cenários e armadilhas. Indispensável para quem quer dados.</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">3 Principais Livros em Português</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Análise Técnica dos Mercados Financeiros</h4><div class="meta">John J. Murphy — tradução clássica</div><p>Não é exclusivo de candlestick, mas dedica capítulos completos ao tema. É a obra mais usada em cursos brasileiros. <strong>Como funciona:</strong> introduz toda a análise técnica e situa o candlestick dentro desse universo, ensinando a combinar velas com outras ferramentas.</p></div><div class="book"><div class="num">02</div><h4>Velas Japonesas: Um Estudo Mais Aprofundado</h4><div class="meta">Steve Nison — edição em português</div><p>Continuação do livro original do Nison, traduzida para o português. <strong>Como funciona:</strong> trata de padrões avançados (três métodos ascendentes, contra-ataque, harami cross) e da combinação de velas com linhas de tendência e zonas de S/R. Exige base prévia.</p></div><div class="book"><div class="num">03</div><h4>Candlestick: O Guia Definitivo da Análise Gráfica</h4><div class="meta">Marcos Abe — autor brasileiro</div><p>Adaptação dos padrões clássicos ao mercado brasileiro. <strong>Como funciona:</strong> traz exemplos com ações da B3 e analisa o comportamento de candles em ativos como Petrobras, Vale e índices. Ótimo para aplicar em ações nacionais.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Como funcionam</h2><div class="two-col" style="grid-template-columns:1.2fr 1fr"><div class="body-text"><p>Cada vela representa um período (5min, 1h, 1 dia, 1 semana...) e mostra <strong>quatro informações</strong> de preço:</p><p>• <strong>Abertura</strong> — preço no início do período<br>• <strong>Fechamento</strong> — preço no fim do período<br>• <strong>Máxima</strong> — maior preço atingido<br>• <strong>Mínima</strong> — menor preço atingido</p><h3 class="h-sub">Anatomia da vela</h3><p>O <strong>corpo</strong> é o retângulo entre abertura e fechamento. Verde = alta. Vermelho = baixa.</p><p>As <strong>sombras</strong> (pavios) são as linhas finas acima e abaixo do corpo, mostrando o quanto o preço foi além de abertura e fechamento.</p></div><div class="candle-fig"><svg viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="20" x2="60" y2="60" stroke="#27ae60" stroke-width="2"/><rect x="40" y="60" width="40" height="120" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/><line x1="60" y1="180" x2="60" y2="240" stroke="#27ae60" stroke-width="2"/><text x="60" y="265" font-family="Courier New" font-size="11" text-anchor="middle">ALTA</text><line x1="80" y1="20" x2="120" y2="20" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="2,2"/><text x="125" y="24" font-family="Helvetica" font-size="11">Máxima</text><line x1="80" y1="60" x2="120" y2="60" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="2,2"/><text x="125" y="64" font-family="Helvetica" font-size="11">Fechamento</text><line x1="80" y1="180" x2="120" y2="180" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="2,2"/><text x="125" y="184" font-family="Helvetica" font-size="11">Abertura</text><line x1="80" y1="240" x2="120" y2="240" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="2,2"/><text x="125" y="244" font-family="Helvetica" font-size="11">Mínima</text><line x1="200" y1="80" x2="200" y2="110" stroke="#c0392b" stroke-width="2"/><rect x="185" y="110" width="30" height="80" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/><line x1="200" y1="190" x2="200" y2="220" stroke="#c0392b" stroke-width="2"/><text x="200" y="245" font-family="Courier New" font-size="11" text-anchor="middle">BAIXA</text></svg><div class="candle-caption">Anatomia de uma vela: corpo + sombras superior e inferior.</div></div></div><h3 class="h-sub" style="margin-top:32px">Principais padrões</h3><div class="patterns"><div class="pattern"><h5>Doji</h5><p>Abertura ≈ fechamento. Sinaliza indecisão.</p></div><div class="pattern"><h5>Martelo</h5><p>Corpo pequeno + sombra inferior longa. Reversão de baixa pra alta.</p></div><div class="pattern"><h5>Estrela Cadente</h5><p>Corpo pequeno + sombra superior longa. Reversão de alta pra baixa.</p></div><div class="pattern"><h5>Engolfo de Alta</h5><p>Vela verde engole vermelha anterior. Sinal de compra.</p></div><div class="pattern"><h5>Engolfo de Baixa</h5><p>Vela vermelha engole verde anterior. Sinal de venda.</p></div><div class="pattern"><h5>Três Soldados</h5><p>3 velas verdes com fechamentos crescentes. Continuação de alta.</p></div></div><p class="body-text" style="margin-top:20px">A força do candlestick está em ler <strong>psicologia de massa</strong>. Padrões funcionam melhor em <strong>regiões de S/R</strong> ou após movimentos extendidos — não isolados.</p></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Curiosidades</h2><div class="body-text"><p><strong>Origem fora do mercado tradicional.</strong> Nasceu na bolsa de arroz japonesa, não em ações.</p><p><strong>Significado do nome.</strong> Os japoneses chamam de <em>"rosoku ashi"</em>. <em>Doji</em> significa "erro" ou "sem mudança".</p><p><strong>Mais de 100 padrões catalogados.</strong> Mas na prática, 10 a 15 são suficientes.</p><p><strong>Como o Ocidente descobriu.</strong> Steve Nison conheceu por acaso quando uma corretora japonesa lhe mostrou um livro.</p><p><strong>Funciona melhor em prazos maiores.</strong> Padrões em diários e semanais têm taxa superior aos de 1 e 5 minutos.</p><p><strong>Combinação é a chave.</strong> Padrões isolados são fracos. Em zonas de S/R, fibo ou alinhados com médias, a probabilidade aumenta.</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section" style="text-align:center">Conclusão</h2><div class="body-text" style="max-width:720px;margin:0 auto;text-align:center;font-size:16px"><p>Candlestick não é mágica. É uma <strong>linguagem visual da psicologia do mercado</strong>, criada há mais de 250 anos no Japão.</p><p>Dominar candlestick não é decorar 100 padrões — é entender o que cada um revela sobre o comportamento de compradores e vendedores.</p><p>Vale mais a <strong>leitura repetida e o contexto</strong> do que a quantidade de padrões memorizados.</p><p style="margin-top:30px;font-style:italic;color:var(--muted)">Padrões dão pistas — não certezas. Quem se especializa em ler velas se especializa em ler gente.</p></div><div class="dots br"></div></section><section class="page"><div class="dots tl"></div><div class="corner tl"></div><h2 class="title-mono h-section">Contato</h2><div class="contact-block"><p><strong>insta:</strong> pedrooscar1708</p><p><strong>email:</strong> pedrooscar1708@gmail.com</p><p><strong>telefone:</strong> (11) 96342-6694</p></div><div class="corner br"></div></section><div style="height:40px"></div></body></html></script>

x;line-height:1.55}.note-card{background:#fff;border:1px solid #d8cdb7;border-radius:6px;padding:18px 22px;margin:14px 0}.note-card .badge{display:inline-block;background:var(--gold);color:#fff;padding:2px 10px;border-radius:3px;font-size:11px;font-family:"Courier New",monospace;text-transform:uppercase;margin-bottom:8px}.note-card ol{margin:0;padding-left:20px}.note-card ol li{margin-bottom:10px;line-height:1.5}.note-card .meta{font-size:13px;color:var(--muted);font-style:italic;margin-top:8px}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}.level{background:#fff;border:1px solid #d8cdb7;border-radius:4px;padding:10px;text-align:center;font-family:"Courier New",monospace}.level .pct{font-size:18px;font-weight:700;color:var(--gold)}.level .desc{font-size:12px;color:var(--muted);margin-top:2px}.contact-block{font-family:"Courier New",monospace;font-size:16px;line-height:2}.credit-box{margin-top:28px;padding:14px 18px;border:1.5px dashed var(--line);border-radius:4px;background:#fff;font-family:"Helvetica Neue",sans-serif;font-size:14px;line-height:1.6}.credit-box strong{color:var(--accent)}@media(max-width:720px){.page{padding:40px 26px;min-height:auto}.two-col{grid-template-columns:1fr;gap:20px}.h-big{font-size:30px!important}.h-section{font-size:22px}.cover{padding:50px 24px;min-height:auto}.cover .h-big{font-size:34px!important}.author{font-size:18px}.corner,.dots{transform:scale(.7)}}@media print{body{background:#fff}.topbar{display:none}.page{page-break-after:always;box-shadow:none;margin:0 auto;border:none;max-width:none;width:100%}.page:last-child{page-break-after:auto}}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a><button onclick="window.print()">Imprimir / Salvar PDF</button><div class="spacer"></div><small>Trabalho — Fibonacci</small></div><section class="page cover"><div class="dots tl"></div><div class="corner tl"></div><h1 class="title-mono h-big">FIBONACCI</h1><div class="author">por Pedro Oscar</div><div class="phi">Φ ≈ 1.618 — proporção áurea</div><div class="corner br"></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><div class="two-col"><div><h2 class="title-mono h-section">Tópicos<br/>de<br/>Abordagem</h2></div><div><ul class="topics"><li>Quem descobriu</li><li>Como foi parar no mercado financeiro</li><li>3 principais livros em inglês</li><li>3 principais livros em português</li><li>Aplicação prática (aula M3.2.3)</li><li>Curiosidades</li><li>Conclusão</li></ul></div></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Quem descobriu</h2><div class="body-text"><p><strong>Leonardo de Pisa</strong>, mais conhecido como <strong>Leonardo Fibonacci</strong> (~1170–1240), foi um matemático italiano que viajou pelo Mediterrâneo e aprendeu o sistema numérico hindu-arábico com matemáticos árabes.</p><p>Em <strong>1202</strong>, publicou <em>Liber Abaci</em>, que apresentou a famosa sequência através do <strong>problema dos coelhos</strong>.</p><div class="sequence-fig"><div><span class="num">0</span><span class="num">1</span><span class="num">1</span><span class="num">2</span><span class="num">3</span><span class="num gold">5</span><span class="num gold">8</span><span class="num gold">13</span><span class="num gold">21</span><span class="num gold">34</span><span class="num gold">55</span><span class="num gold">89</span><span class="num gold">144</span><span class="num">…</span></div><div class="ratio">Cada número é a soma dos dois anteriores. A razão converge para <strong>Φ = 1.6180339...</strong></div></div><p><strong>Curiosidade:</strong> a sequência já era conhecida na matemática indiana antes de Fibonacci. Ele apenas a popularizou no Ocidente.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Como foi parar no mercado financeiro</h2><div class="body-text"><p>A proporção áurea (1.618) aparece em estruturas naturais. Se a natureza respeita Fibonacci, por que o mercado (movimento de massa humana) não respeitaria?</p><h3 class="h-sub">As pontes para o mercado</h3><p><strong>Charles Dow (séc. XIX):</strong> observou correções respeitando 33%, 50%, 66% — próximos de 38.2%, 50%, 61.8%.</p><p><strong>W.D. Gann (1920–30):</strong> aplicava razões 50%, 38%, 61% em estudos de tempo e preço.</p><p><strong>Ralph Nelson Elliott (1930–40):</strong> criou as Ondas de Elliott (5+3) e fez a conexão definitiva entre matemática e mercado.</p><p><strong>Robert Prechter (1970–80):</strong> popularizou Elliott + Fibonacci no Ocidente moderno.</p><h3 class="h-sub">Os níveis usados hoje</h3><p><strong>Retrações:</strong></p><div class="levels"><div class="level"><div class="pct">23.6%</div><div class="desc">retração rasa</div></div><div class="level"><div class="pct">38.2%</div><div class="desc">retração comum</div></div><div class="level"><div class="pct">50%</div><div class="desc">meio do movimento</div></div><div class="level"><div class="pct">61.8%</div><div class="desc">razão áurea</div></div><div class="level"><div class="pct">78.6%</div><div class="desc">retração profunda</div></div></div><p><strong>Extensões:</strong></p><div class="levels"><div class="level"><div class="pct">161.8%</div><div class="desc">alvo principal</div></div><div class="level"><div class="pct">200%</div><div class="desc">alvo secundário</div></div><div class="level"><div class="pct">261.8%</div><div class="desc">alvo estendido</div></div></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">3 Principais Livros em Inglês</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Fibonacci Applications and Strategies for Traders</h4><div class="meta">Robert Fischer — 1993</div><p>A obra de referência sobre aplicação prática de Fibonacci. Cobre retrações, projeções, time clusters e zonas de confluência.</p></div><div class="book"><div class="num">02</div><h4>Elliott Wave Principle: Key to Market Behavior</h4><div class="meta">A.J. Frost &amp; Robert Prechter — 1978</div><p>O livro que conectou Elliott e Fibonacci no Ocidente. Apresenta a teoria 5+3 e as razões áureas.</p></div><div class="book"><div class="num">03</div><h4>Fibonacci Analysis</h4><div class="meta">Constance Brown — 2008</div><p>Aprofundamento avançado: time clusters, harmônicos (Gartley, Bat, Butterfly) e como evitar erros comuns.</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">3 Principais Livros em Português</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Análise Técnica dos Mercados Financeiros</h4><div class="meta">John J. Murphy — tradução clássica</div><p>Não é exclusivo de Fibonacci, mas dedica capítulos completos ao tema. Apresenta Fibonacci ao lado de tendências, indicadores e candlestick.</p></div><div class="book"><div class="num">02</div><h4>O Princípio das Ondas de Elliott</h4><div class="meta">Frost &amp; Prechter — edição em português</div><p>Tradução da obra clássica que conecta Elliott a Fibonacci. Explica como cada onda costuma respeitar uma razão áurea.</p></div><div class="book"><div class="num">03</div><h4>Análise Técnica — A Teoria de Dow e as Ondas de Elliott</h4><div class="meta">Eduardo Matsura — autor brasileiro</div><p>Adaptação dos clássicos ao mercado brasileiro com exemplos da B3.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Aplicação prática</h2><div class="body-text"><p>Anotações da aula <strong>M3.2.3</strong> sobre aplicação de Fibonacci.</p><div class="note-card"><div class="badge">Aula M3.2.3 · 09/11/2025</div><h3 class="h-sub" style="margin-top:4px">Pontos principais</h3><ol><li><strong>Sobra isolada:</strong> priorizar mais toques (subjetivo, depende da leitura).</li><li><strong>Timing de entrada:</strong> está nas <em>médias móveis</em>, não no Fibonacci.</li><li><strong>Função do Fibonacci:</strong> marcar o pivô e traçar alvos.</li><li><strong>Alvos por espelhamento:</strong> 161.8%, 200% e 261.8%.</li><li><strong>Posição do Vasco:</strong> Fibonacci <em>não</em> é critério de entrada — só leitura de contexto e alvos.</li><li><strong>Observação:</strong> exemplos da aula com contrato de dólar (mais errático).</li></ol><div class="meta">Anotação particular do curso, organizada para este trabalho.</div></div><h3 class="h-sub">Síntese — como o Vasco usa Fibonacci</h3><p>Fluxo prático: ① Identifica tendência (médias). ② Marca pivô (Fibo). ③ Espera reação nas zonas (38.2/50/61.8). ④ Confirma com outros critérios. ⑤ Usa extensões como alvos.</p><p><strong>Regra:</strong> quanto mais confluências, mais forte a zona.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Curiosidades</h2><div class="body-text"><p><strong>Fibonacci na natureza.</strong> Sequência aparece em girassóis, conchas, espirais de galáxias.</p><p><strong>Origem indiana.</strong> Pingala (~200 a.C.) já estudava antes de Fibonacci.</p><p><strong>Elliott chegou ao contrário.</strong> Partiu da observação dos mercados e só depois percebeu que era Fibonacci.</p><p><strong>Φ na arte.</strong> Aparece no Partenon, Mona Lisa, arquitetura egípcia.</p><p><strong>50% não é Fibonacci.</strong> Entrou na lista por intuição (meio do movimento) e por uso de Charles Dow.</p><p><strong>78.6% é o irmão esquecido.</strong> Raiz quadrada de 61.8%. Comum entre profissionais.</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section" style="text-align:center">Conclusão</h2><div class="body-text" style="max-width:720px;margin:0 auto;text-align:center;font-size:16px"><p>Fibonacci é uma das ferramentas mais usadas e mais mal interpretadas do mercado.</p><p>Não é mágica — é só uma forma de quantificar <strong>zonas onde compradores e vendedores costumam reagir</strong>.</p><p>Como ficou claro na aula M3.2.3: <strong>Fibonacci é contexto e alvo, não gatilho</strong>. Combine com médias, candle, S/R e fluxo.</p><p style="margin-top:30px;font-style:italic;color:var(--muted)">Vale o estudo, mas só rende quando faz parte de um sistema.</p></div><div class="dots br"></div></section><section class="page"><div class="dots tl"></div><div class="corner tl"></div><h2 class="title-mono h-section">Contato</h2><div class="contact-block"><p><strong>insta:</strong> pedrooscar1708</p><p><strong>email:</strong> pedrooscar1708@gmail.com</p><p><strong>telefone:</strong> (11) 96342-6694</p></div><div class="credit-box"><strong>Trabalho realizado com auxílio do Claude (Anthropic)</strong> — IA usada para pesquisa, organização e redação. Conteúdo cruzado a partir das anotações pessoais do curso (aula M3.2.3, 09/11/2025).</div><div class="corner br"></div></section><div style="height:40px"></div></body></html></script>

ard .span{font-size:13px;color:var(--ink);margin-top:4px}.temp-card.vm{border-color:var(--gold);border-width:2px}.temp-card.vm .name{color:var(--gold)}.levels-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}.level-mini{background:#fff;border:1px solid #d8cdb7;border-radius:4px;padding:8px 10px;text-align:center;font-family:"Courier New",monospace;font-size:13px}.level-mini .pct{font-size:17px;font-weight:700;color:var(--gold)}.level-mini .lbl{font-size:11px;color:var(--muted);margin-top:2px}.contact-block{font-family:"Courier New",monospace;font-size:16px;line-height:2}.credit-box{margin-top:28px;padding:14px 18px;border:1.5px dashed var(--line);border-radius:4px;background:#fff;font-family:"Helvetica Neue",sans-serif;font-size:14px;line-height:1.6}.credit-box strong{color:var(--accent)}@media(max-width:720px){.page{padding:38px 22px;min-height:auto}.two-col{grid-template-columns:1fr;gap:18px}.h-big{font-size:28px!important}.h-section{font-size:20px}.cover{padding:50px 24px;min-height:auto}.cover .h-big{font-size:32px!important}.author{font-size:17px}.corner,.dots{transform:scale(.7)}.phases-table{font-size:11px}}@media print{body{background:#fff}.topbar{display:none}.page{page-break-after:always;box-shadow:none;margin:0 auto;border:none;max-width:none;width:100%}.page:last-child{page-break-after:auto}}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a><button onclick="window.print()">Imprimir / Salvar PDF</button><div class="spacer"></div><small>Trabalho — Vasco Mamede</small></div><section class="page cover"><div class="dots tl"></div><div class="corner tl"></div><h1 class="title-mono h-big">VASCO MAMEDE</h1><div class="author">Anotações do Curso · por Pedro Oscar</div><div class="subtitle">Compilado das aulas · 2025–2026</div><div class="corner br"></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><div class="two-col"><div><h2 class="title-mono h-section">Tópicos<br/>de<br/>Abordagem</h2></div><div><ul class="topics"><li>Quem é Vasco Mamede</li><li>Mentalidade e plano</li><li>Teoria de Dow</li><li>Fases do mercado</li><li>Médias móveis</li><li>Fibonacci</li><li>Suportes / Resistências / LTAs</li><li>GAPs</li><li>Ondas de Elliott</li><li>IFR</li><li>Sistema operacional</li><li>Gerenciamento de risco</li><li>Psicologia (Luciana / Ruda)</li><li>Cronograma das aulas</li><li>Conclusão</li></ul></div></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Quem é Vasco Mamede</h2><div class="body-text"><p>Trader e mentor brasileiro, conhecido por unir <strong>análise técnica clássica</strong> (Dow, Elliott, Fibonacci, médias) com observações próprias sobre temporalidades curtas. Atua principalmente em <strong>winfut</strong> e <strong>contrato de dólar</strong>.</p><h3 class="h-sub">Filosofia central — "o todo é o que importa"</h3><div class="info-card"><ul><li>Médias móveis</li><li>Fibonacci (contexto + alvo, não entrada)</li><li>Suporte e resistência</li><li>Estrutura de mercado</li><li>Elliott (se gostar e souber ler)</li></ul></div><h3 class="h-sub">Temporalidades — extensão do Dow</h3><div class="temp-grid"><div class="temp-card"><div class="name">Primária</div><div class="span">meses / anos</div></div><div class="temp-card"><div class="name">Secundária</div><div class="span">semanas / meses</div></div><div class="temp-card"><div class="name">Terciária</div><div class="span">semanas / dias</div></div><div class="temp-card vm"><div class="name">Quartenária</div><div class="span">dias / horas</div></div><div class="temp-card vm"><div class="name">Quinzenária</div><div class="span">horas / minutos</div></div></div><p style="font-size:13px;color:var(--muted)">Em destaque (dourado): contribuição própria do Vasco Mamede.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Mentalidade e plano</h2><div class="body-text"><div class="quote">Mentoria é racional. Mercado é emocional.<span class="attr">— premissa da aula 1 obrigatória</span></div><h3 class="h-sub">Perguntas para o autoconhecimento</h3><div class="info-card"><ul><li>Qual a minha meta para o ano?</li><li>O que eu quero mudar em mim?</li><li>Quando uso luta ou fuga?</li><li>O que escolho perder?</li></ul></div><h3 class="h-sub">O plano antes da operação</h3><p>Definir o que vai ser feito com base no <strong>gráfico diário</strong>. Se o plano não estiver bem traçado no diário, nem desce para tempos menores. <strong>Não operar sem plano.</strong></p><div class="info-card red"><h4>Ciclo do trade</h4><ul><li>Tenha um plano definido</li><li>Esperar, entrar e encerrar conforme o plano</li><li>Não mude o plano no meio da operação</li><li>O que está dentro do plano: técnica + gerenciamento de risco</li></ul></div><div class="quote">Seu trabalho será visto com a execução do plano.</div><h3 class="h-sub">Caderno do trader</h3><p>O caderno é o <strong>gráfico</strong>. Identifique no semanal e diário, desça para 4h, 1h, 15m, 3m. <strong>Trace fibo dentro de fibo</strong> para encontrar confluência.</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Teoria de Dow</h2><div class="body-text"><h3 class="h-sub">Princípios fundamentais</h3><div class="info-card blue"><ul><li><strong>Os preços descontam tudo</strong></li><li>Importância do <strong>fechamento de candle</strong></li><li><strong>Rompimento</strong> = fechamento; <strong>violação</strong> = só sombra</li><li>"O dinheiro mora no fechamento" (Ruda)</li><li>Quanto maior o tempo gráfico, mais robusta a análise</li></ul></div><h3 class="h-sub">Ciclo do mercado</h3><p>Acumulação → alta sensível → euforia. Acumulação não renova topos, encaixota o preço.</p><h3 class="h-sub">Confirmação por índices</h3><div class="info-card"><ul><li>Os índices confirmam um o outro</li><li>IFNC = índice dos bancos</li><li>Uma ação confirmada por um índice é mais forte</li><li>Não confiar em subida sem volume</li></ul></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Fases do mercado</h2><div class="body-text"><table class="phases-table"><thead><tr><th>Fase</th><th>Tipo</th><th>% Movimento</th><th>Duração</th><th>Volume</th><th>Sentimento</th></tr></thead><tbody><tr><td class="phase-cell phase-acumulacao">Acumulação</td><td>Alta</td><td>+5% a +25%</td><td>2 a 12 meses</td><td>Baixo → moderado</td><td>Descrença</td></tr><tr><td class="phase-cell phase-alta-sensivel">Alta Sensível</td><td>Alta</td><td>+25% a +100%</td><td>6 a 24 meses</td><td>Crescente</td><td>Otimismo racional</td></tr><tr><td class="phase-cell phase-euforia">Euforia</td><td>Alta</td><td>+100% a +300%+</td><td>3 a 9 meses</td><td>Muito alto</td><td>Ganância</td></tr><tr><td class="phase-cell phase-distribuicao">Distribuição</td><td>Baixa</td><td>−5% a −20%</td><td>1 a 6 meses</td><td>Alto nas quedas</td><td>Dúvida</td></tr><tr><td class="phase-cell phase-baixa-sensivel">Baixa Sensível</td><td>Baixa</td><td>−20% a −50%</td><td>3 a 12 meses</td><td>Crescente</td><td>Medo racional</td></tr><tr><td class="phase-cell phase-panico">Pânico</td><td>Baixa</td><td>−50% a −80%+</td><td>1 a 4 meses</td><td>Explosivo</td><td>Desespero</td></tr></tbody></table><div class="info-card green"><h4>Lado da alta</h4><p>Acumulação → Alta Sensível → Euforia. Volume crescente, sentimento de descrença até virar ganância.</p></div><div class="info-card red"><h4>Lado da baixa</h4><p>Distribuição → Baixa Sensível → Pânico. Volume nas quedas, sentimento de dúvida até virar desespero.</p></div></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Médias móveis</h2><div class="body-text"><h3 class="h-sub">Função</h3><div class="info-card"><ul><li>Rastreador de tendência</li><li>Suporte e resistência <strong>dinâmico</strong></li><li>Ajuda a entender se vale continuar a favor do movimento</li></ul></div><h3 class="h-sub">Períodos clássicos</h3><div class="levels-grid"><div class="level-mini"><div class="pct">20</div><div class="lbl">1 mês de pregão</div></div><div class="level-mini"><div class="pct">50</div><div class="lbl">10 semanas</div></div><div class="level-mini"><div class="pct">200</div><div class="lbl">1 ano (~220 pregões BR)</div></div></div><p style="font-size:13px">Vasco usa <strong>MME 9 exponencial</strong> como condução. Para ações, também <strong>MME 400</strong>.</p><h3 class="h-sub">Regras operacionais</h3><div class="info-card red"><ul><li>Toda resistência precisa que a <strong>MM20 esteja próxima</strong></li><li>Saída da média ou retorno à média</li><li>Só não olhar a MM20 se a MM200 estiver a favor</li><li>Quando a curta toca na 200, a 20 está longe — oportunidade</li></ul></div><div class="quote">Curto prazo o preço busca a média curta; no longo, a média busca a média longa.<span class="attr">— Vasco Mamede</span></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Sistema operacional · Médias</h2><div class="body-text"><h3 class="h-sub">Não operar quando…</h3><div class="info-card red"><ul><li>Médias embaraçadas (zona de armadilha entre MM20 e MM200)</li><li>Preço colado na MM200</li><li>Preço esticado da MM20</li><li>Mercado lateral</li></ul></div><h3 class="h-sub">Operar quando…</h3><div class="info-card green"><ul><li><strong>Alinhamento</strong>: curta acima da longa = compra; abaixo = venda</li><li>MME9 e MME20 alinhadas para a mesma direção</li><li>Use 15min para ver, 3min para entrar</li><li>Stop sempre técnico</li></ul></div><h3 class="h-sub">Check-list operacional (exemplo)</h3><table class="check-table"><thead><tr><th>Critério</th><th>Estado</th></tr></thead><tbody><tr><td>Estrutura</td><td class="v">Venda</td></tr><tr><td>MM</td><td class="v">Venda</td></tr><tr><td>Fibo</td><td class="v">Venda</td></tr><tr><td>Sup/Res</td><td class="c">Compra</td></tr><tr><td>MM longe do preço</td><td>Não</td></tr><tr><td>MM20 direcionada</td><td class="v">Sim — Venda</td></tr><tr><td>MM alinhadas</td><td class="v">Sim — Venda</td></tr></tbody></table><div class="quote">Perca a oportunidade, mas não perca dinheiro.<span class="attr">— Vasco Mamede</span></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Fibonacci</h2><div class="body-text"><div class="info-card gold"><ul><li>Marca o pivô e traça alvos</li><li><strong>Não é critério de entrada</strong></li><li>Timing está nas <strong>médias móveis</strong></li></ul></div><h3 class="h-sub">Retrações por mercado</h3><div class="levels-grid"><div class="level-mini"><div class="pct">50%</div><div class="lbl">commodities · ações · índices · cripto</div></div><div class="level-mini"><div class="pct">61.8%</div><div class="lbl">forex / câmbio</div></div></div><h3 class="h-sub">Alvos por espelhamento</h3><div class="levels-grid"><div class="level-mini"><div class="pct">161.8%</div><div class="lbl">principal</div></div><div class="level-mini"><div class="pct">200%</div><div class="lbl">secundário</div></div><div class="level-mini"><div class="pct">261.8%</div><div class="lbl">estendido</div></div></div><div class="quote">Toda vez que o preço chegar esticado é uma excelente oportunidade para vender.</div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Suportes / Resistências / LTAs</h2><div class="body-text"><h3 class="h-sub">Regra "duas linhas"</h3><div class="info-card blue"><ul><li><strong>Primeira linha</strong>: em uma extremidade</li><li><strong>Segunda linha</strong>: no maior número de toques de sombras</li></ul></div><h3 class="h-sub">Critério do Vasco para LTA/LTB</h3><div class="info-card red"><h4>Mercados erráticos (B3, cripto)</h4><p>Traçar pegando <strong>maior quantidade de sombras</strong>, sem corpo do candle.</p></div><div class="info-card green"><h4>Mercados menos erráticos (Nasdaq)</h4><p>Pode usar o <strong>topo da sombra</strong>.</p></div><h3 class="h-sub">Zonas de tomada de posição (Ruda)</h3><div class="info-card"><ul><li>Suporte e resistência</li><li>LTAs e LTBs</li><li>Fibonacci</li><li>Médias móveis</li><li>RSI / IFR</li></ul></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">GAPs</h2><div class="body-text"><div class="info-card blue"><h4>Gap de área <span style="color:var(--muted);font-weight:400">— preparação</span></h4><p>Em zonas laterais, baixa relevância.</p></div><div class="info-card green"><h4>Gap de fuga <span style="color:var(--muted);font-weight:400">— início</span></h4><p>Marca rompimento de estrutura, com volume.</p></div><div class="info-card gold"><h4>Gap de continuação <span style="color:var(--muted);font-weight:400">— meio</span></h4><p>No meio de tendência forte. Movimento ainda tem fôlego.</p></div><div class="info-card red"><h4>Gap de exaustão <span style="color:var(--muted);font-weight:400">— fim</span></h4><p>Volume explosivo + candle esticado. Sinal de fim de movimento.</p></div><h3 class="h-sub">Sinais de exaustão</h3><div class="info-card"><ul><li>Esticado da média</li><li>Alvo de fibo (161.8/200/261.8)</li><li>Retração de fibo de movimento anterior</li><li>S/R relevante</li><li>Volume de exaustão (doji longe das médias)</li><li>Ilha de reversão</li></ul></div><div class="quote">Para que serve o gap? Para saber se vai comprar ou vender.<span class="attr">— aula 21</span></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Ondas de Elliott</h2><div class="body-text"><p>Ciclos seguem padrão repetitivo. Quanto maior o tempo gráfico, mais assertiva.</p><div class="info-card green"><h4>Ondas impulsivas (1, 3, 5)</h4><p>A favor da tendência. Sub-fractais 1,2,3,4,5.</p></div><div class="info-card red"><h4>Ondas corretivas (2, 4)</h4><p>Contra a tendência. Estrutura A, B, C.</p></div><h3 class="h-sub">Sub-ondas</h3><div class="info-card"><ul><li><strong>Onda A:</strong> A,B,C ou 1,2,3,4,5</li><li><strong>Onda B:</strong> A,B,C</li><li><strong>Onda C:</strong> 1,2,3,4,5</li></ul></div><h3 class="h-sub">Tipos de correção</h3><p><strong>No preço:</strong> corrige na amplitude.<br><strong>No tempo:</strong> corrige lateralmente.</p><div class="info-card gold"><h4>Regra da alternância</h4><p>Se onda 2 simples, onda 4 complexa, e vice-versa.</p></div><h3 class="h-sub">Regra inviolável</h3><div class="info-card red"><p>Onda 4 pode <em>violar</em> o topo da onda 1, mas <strong>não pode fechar abaixo</strong>.</p></div><h3 class="h-sub">Confirmação</h3><p>Em dúvida na contagem, verificar <strong>divergência no IFR</strong>. Software: Elliott Wave Absolute.</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">IFR</h2><div class="body-text"><h3 class="h-sub">O que pesquisar (trabalho proposto)</h3><div class="info-card blue"><ul><li>Cálculo do IFR</li><li>História do criador (J. Welles Wilder Jr.)</li><li>Marcar divergências em gráficos reais</li></ul></div><h3 class="h-sub">Conexão com Elliott</h3><p>Quando contagem dúbia, divergência IFR (topos/fundos descendentes contra preço subindo) funciona como <strong>filtro de confirmação</strong>.</p></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Gerenciamento de risco</h2><div class="body-text"><div class="quote">A finalidade do mercado é defesa patrimonial.<span class="attr">— live de gerenciamento · 05/11/2025</span></div><div class="info-card red"><ul><li>Para se manter vivo</li><li>Para evitar quebra</li><li>Defesa patrimonial em primeiro lugar</li></ul></div><h3 class="h-sub">Princípios</h3><div class="info-card"><ul><li>Técnica se aprende para gerenciar risco</li><li>Segredo do trade = relação <strong>risco/retorno</strong></li><li>Win Fut: stop por estrutura, sempre operar com alvo</li><li>Stop no winfut: pelo menos 50 pontos abaixo</li></ul></div><h3 class="h-sub">Fases do trader (Ruda)</h3><div class="info-card blue"><h4>Fase 1 — Estudo</h4><p>Teórico, conta de simulação.</p></div><div class="info-card gold"><h4>Fase 2 — Prática</h4><p>Entre 200 e 2.000 dólares. Simulação primeiro, depois real com pouco capital.</p></div><div class="info-card green"><h4>Fase 3 — Acúmulo</h4><p>Validado e consistente, escalar com regras.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Psicologia · Luciana Martins</h2><div class="body-text"><p>Aula 09 (08/12/2025). Apresentação de <strong>"A Guerra da Arte"</strong> (Steven Pressfield).</p><h3 class="h-sub">As duas vidas</h3><div class="info-card"><h4>A vida comum</h4><p>O dia a dia, sobreviver.</p></div><div class="info-card gold"><h4>A vida não vivida</h4><p>A dos sonhos, que <strong>fica eternamente soprando nos nossos ouvidos</strong>.</p></div><h3 class="h-sub">A Resistência</h3><div class="info-card red"><ul><li>Não é direta</li><li>Implacável e impessoal</li><li>Bússola — mais resistência, mais próximo do importante</li><li>Vem do medo</li><li>Na reta final, não durma</li></ul></div><h3 class="h-sub">Princípios</h3><div class="info-card"><ul><li>Nunca o urgente antes do importante</li><li>Aprenda a planejar o dia</li><li>Quanto tempo de fato você se dedica ao mercado?</li><li>Realização é individual</li><li>Não se realiza sonhos com energia emprestada</li><li>Amador × profissional</li><li>Não leve derrotas para o pessoal</li></ul></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Psicologia · Ruda</h2><div class="body-text"><div class="quote">Cabeça de investidor e coração de especulador.<span class="attr">— Ruda · aula 25</span></div><h3 class="h-sub">Filosofia de trade</h3><div class="info-card blue"><ul><li><strong>Ambiente</strong> — onde você opera</li><li><strong>Matéria-prima</strong> — capital + tempo</li><li><strong>Ferramenta</strong> — análise técnica</li></ul></div><h3 class="h-sub">O que é o mercado</h3><p>Ponto de encontro entre compradores e vendedores. Sentimentos base: <strong>ganância e medo</strong> (Munehisa Homma).</p><div class="quote">Leitor de gráfico tem que ser leitor de emoções.</div><h3 class="h-sub">Conceitos-chave</h3><div class="info-card gold"><ul><li><strong>EDGE</strong> — vantagem perante o mercado</li><li>"Tenha padrão"</li><li>Comunicação é o que o outro entende</li><li>Paciência é necessidade</li></ul></div><h3 class="h-sub">Livros recomendados</h3><div class="info-card"><ul><li><em>A Guerra da Arte</em> — Pressfield</li><li><em>Teoria da Perspectiva</em></li><li><em>Rápido e Devagar</em> — Kahneman</li><li><em>Uma Breve História da Economia / Crash</em></li></ul></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Cronograma das aulas</h2><div class="body-text"><div class="timeline"><div class="ev"><div class="date">03/11/2025</div><div class="title">Médias móveis (live)</div></div><div class="ev"><div class="date">05/11/2025</div><div class="title">Gerenciamento de risco (live)</div></div><div class="ev"><div class="date">09/11/2025</div><div class="title">Aplicação Fibonacci · M3.2.3</div></div><div class="ev"><div class="date">10/11/2025</div><div class="title">Médias móveis · trabalho</div></div><div class="ev"><div class="date">12/11/2025</div><div class="title">Aula ao vivo 04 — Médias</div></div><div class="ev"><div class="date">17/11/2025</div><div class="title">Aula ao vivo 05 — Plano e execução</div></div><div class="ev"><div class="date">19/11/2025</div><div class="title">Aula ao vivo 06 — Teoria de Dow</div></div><div class="ev"><div class="date">24/11/2025</div><div class="title">Aula 07 — Temporalidades V.M.</div></div><div class="ev"><div class="date">26/11/2025</div><div class="title">Aula 08 — Fibo das commodities</div></div><div class="ev"><div class="date">01/12/2025</div><div class="title">Aula 08 (Ruda) — Fase 2 Prática</div></div><div class="ev"><div class="date">08/12/2025</div><div class="title">Aula 09 — Psicologia (Luciana)</div></div><div class="ev"><div class="date">10/12/2025</div><div class="title">Aulas 10/11/12 — Elliott</div></div><div class="ev"><div class="date">15/12/2025</div><div class="title">Aula 11 — Elliott Wave Absolute</div></div><div class="ev"><div class="date">17/12/2025</div><div class="title">Aula 12 — Divergência IFR</div></div><div class="ev"><div class="date">07/01/2026</div><div class="title">Aulas 13/14 — IFR</div></div><div class="ev"><div class="date">14/01/2026</div><div class="title">Aula 15 — Tendência e EDGE</div></div><div class="ev"><div class="date">19/01/2026</div><div class="title">Aulas 16/17/18 — Fibonacci</div></div><div class="ev"><div class="date">28/01/2026</div><div class="title">Aulas 19/20/21 — S/R e GAPs</div></div><div class="ev"><div class="date">11/02/2026</div><div class="title">Aulas 22/23 — Linhas de tendência</div></div><div class="ev"><div class="date">23/02/2026</div><div class="title">Aula 25 — História da bolsa</div></div><div class="ev"><div class="date">02/03/2026</div><div class="title">Aulas 27/28 — Médias móveis</div></div><div class="ev"><div class="date">04/03/2026</div><div class="title">Aula 28 — Replay de mercado</div></div></div></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section" style="text-align:center">Conclusão</h2><div class="body-text" style="max-width:760px;margin:0 auto"><p>O curso do Vasco tem uma <strong>tese central</strong>: <em>o todo é o que importa</em>. A consistência vem da <strong>confluência</strong>.</p><div class="info-card blue"><h4>Plano antes de operar</h4><p>Traçado no diário. Mentoria racional, mercado emocional.</p></div><div class="info-card gold"><h4>Time de entrada nas médias</h4><p>Fibo dá contexto e alvo, S/R delimita zona, gatilho fica nas médias.</p></div><div class="info-card red"><h4>Risco antes de retorno</h4><p>Defesa patrimonial. Stop sempre técnico.</p></div><div class="info-card green"><h4>Psicologia faz parte</h4><p>Leitor de gráfico é leitor de emoções.</p></div><p style="text-align:center;margin-top:28px;font-style:italic;color:var(--muted)">Estude o diário, traçe o plano, espere a confluência, execute pela média, controle o risco.</p></div><div class="dots br"></div></section><section class="page"><div class="dots tl"></div><div class="corner tl"></div><h2 class="title-mono h-section">Contato</h2><div class="contact-block"><p><strong>insta:</strong> pedrooscar1708</p><p><strong>email:</strong> pedrooscar1708@gmail.com</p><p><strong>telefone:</strong> (11) 96342-6694</p></div><div class="credit-box"><strong>Trabalho realizado com auxílio do Claude (Anthropic)</strong> — IA usada para organização e redação. Conteúdo baseado nas anotações pessoais do curso (nov/2025 a mar/2026), do mentor <strong>Vasco Mamede</strong> e dos professores <strong>Ruda</strong> e <strong>Luciana Martins</strong>.</div><div class="corner br"></div></section><div style="height:40px"></div></body></html></script>

ottom:14px}.book .num{font-family:"Courier New",monospace;font-weight:700;color:var(--accent);font-size:14px}.book h4{margin:4px 0;font-size:16px;font-weight:700}.book .meta{color:var(--muted);font-size:13px;margin-bottom:8px;font-style:italic}.book p{margin:0;font-size:14px;line-height:1.55}.markets-fig{background:#fff;border:1px solid #d8cdb7;border-radius:6px;padding:24px;margin:16px 0;text-align:center}.markets-fig svg{max-width:100%;height:auto}.markets-caption{font-size:13px;color:var(--muted);margin-top:10px;font-style:italic}.career{position:relative;padding-left:26px;margin-top:16px}.career::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--blue)}.career .ev{position:relative;margin-bottom:14px}.career .ev::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--blue)}.career .year{font-family:"Courier New",monospace;font-size:12px;color:var(--blue);font-weight:700}.career .title{font-size:14px;font-weight:600;margin:2px 0}.career .desc{font-size:13px;color:var(--muted);line-height:1.45}.contact-block{font-family:"Courier New",monospace;font-size:16px;line-height:2}.credit-box{margin-top:28px;padding:14px 18px;border:1.5px dashed var(--line);border-radius:4px;background:#fff;font-family:"Helvetica Neue",sans-serif;font-size:14px;line-height:1.6}.credit-box strong{color:var(--accent)}@media(max-width:720px){.page{padding:40px 26px;min-height:auto}.two-col{grid-template-columns:1fr;gap:20px}.h-big{font-size:30px!important}.h-section{font-size:22px}.cover{padding:50px 24px;min-height:auto}.cover .h-big{font-size:34px!important}.author{font-size:18px}.corner,.dots{transform:scale(.7)}}@media print{body{background:#fff}.topbar{display:none}.page{page-break-after:always;box-shadow:none;margin:0 auto;border:none;max-width:none;width:100%}.page:last-child{page-break-after:auto}}</style></head><body><div class="topbar"><a href="#" onclick="window.close();return false;">← Voltar ao Mapa</a><button onclick="window.print()">Imprimir / Salvar PDF</button><div class="spacer"></div><small>Trabalho — John Murphy</small></div><section class="page cover"><div class="dots tl"></div><div class="corner tl"></div><h1 class="title-mono h-big">JOHN MURPHY</h1><div class="author">por Pedro Oscar</div><div class="subtitle">O pai da análise intermercados</div><div class="corner br"></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><div class="two-col"><div><h2 class="title-mono h-section">Tópicos<br/>de<br/>Abordagem</h2></div><div><ul class="topics"><li>Quem é John Murphy</li><li>Carreira</li><li>3 livros em inglês</li><li>3 livros em português</li><li>Análise intermercados</li><li>Princípios principais</li><li>Conexão com o curso do Vasco</li><li>Curiosidades</li><li>Conclusão</li></ul></div></div><div class="dots br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Quem é John Murphy</h2><div class="body-text"><p><strong>John J. Murphy</strong> é um analista técnico americano (1942), considerado o <strong>pai da análise intermercados</strong>.</p><p>Sua obra <em>"Technical Analysis of the Financial Markets"</em> é a <strong>bíblia ocidental</strong> da análise técnica.</p><div class="info-card blue"><ul><li><strong>Nacionalidade:</strong> americano</li><li><strong>Formação:</strong> economia (Fordham University)</li><li><strong>Principal contribuição:</strong> análise intermercados</li><li><strong>Atuação atual:</strong> Chief Technical Analyst do StockCharts.com</li></ul></div><div class="quote">Os mercados não se movem isolados — eles conversam entre si.<span class="attr">— resumo da tese central de Murphy</span></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Carreira</h2><div class="body-text"><div class="career"><div class="ev"><div class="year">~1970s</div><div class="title">Diretor · Merrill Lynch</div><div class="desc">Primeira grande posição institucional.</div></div><div class="ev"><div class="year">1986</div><div class="title">Publica "Technical Analysis of the Futures Markets"</div><div class="desc">Primeira versão da bíblia.</div></div><div class="ev"><div class="year">~1990s</div><div class="title">Chief Technical Analyst · CNBC</div><div class="desc">7 anos como o cara da análise técnica na TV.</div></div><div class="ev"><div class="year">1999</div><div class="title">"Technical Analysis of the Financial Markets"</div><div class="desc">Edição revisada cobrindo todos os mercados.</div></div><div class="ev"><div class="year">2004</div><div class="title">"Intermarket Analysis"</div><div class="desc">Sua obra mais original.</div></div><div class="ev"><div class="year">2000s — hoje</div><div class="title">StockCharts.com</div><div class="desc">Análises diárias até hoje.</div></div></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">3 Livros em Inglês</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Technical Analysis of the Financial Markets</h4><div class="meta">John J. Murphy — 1999</div><p>A bíblia ocidental da análise técnica. 500+ páginas do básico ao avançado.</p></div><div class="book"><div class="num">02</div><h4>Intermarket Analysis</h4><div class="meta">John J. Murphy — 2004</div><p>A obra mais original — relação entre os 4 grandes mercados.</p></div><div class="book"><div class="num">03</div><h4>The Visual Investor</h4><div class="meta">John J. Murphy — 2009</div><p>Versão didática focada em ETFs e investidor individual.</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">3 Livros em Português</h2><div class="body-text"><div class="book"><div class="num">01</div><h4>Análise Técnica dos Mercados Financeiros</h4><div class="meta">John J. Murphy — Editora Saraiva</div><p>A tradução brasileira da bíblia. Livro de cabeceira em quase todo curso de análise técnica no Brasil.</p></div><div class="book"><div class="num">02</div><h4>Análise Intermarket</h4><div class="meta">John J. Murphy — Editora Saraiva</div><p>Tradução do "Intermarket Analysis". Sistema de leitura cruzada entre mercados.</p></div><div class="book"><div class="num">03</div><h4>Análise Gráfica Fácil (Charting Made Easy)</h4><div class="meta">John J. Murphy — algumas edições</div><p>Versão leve, didática, com foco visual.</p></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Análise intermercados</h2><div class="body-text"><p>Premissa: <strong>nenhum mercado se move isolado</strong>. Quem entende essas relações enxerga sinais antes.</p><div class="markets-fig"><svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="80" r="44" fill="#dbeafe" stroke="#2c5282" stroke-width="2"/><text x="120" y="78" font-family="Courier New" font-size="13" font-weight="700" text-anchor="middle" fill="#2c5282">AÇÕES</text><text x="120" y="94" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#4a4a4a">stocks</text><circle cx="360" cy="80" r="44" fill="#fef3c7" stroke="#b8860b" stroke-width="2"/><text x="360" y="78" font-family="Courier New" font-size="13" font-weight="700" text-anchor="middle" fill="#b8860b">BONDS</text><text x="360" y="94" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#4a4a4a">títulos</text><circle cx="120" cy="200" r="44" fill="#dcfce7" stroke="#27ae60" stroke-width="2"/><text x="120" y="198" font-family="Courier New" font-size="11" font-weight="700" text-anchor="middle" fill="#27ae60">COMMODITIES</text><text x="120" y="214" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#4a4a4a">ouro · óleo · grãos</text><circle cx="360" cy="200" r="44" fill="#fee2e2" stroke="#c0392b" stroke-width="2"/><text x="360" y="198" font-family="Courier New" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">MOEDAS</text><text x="360" y="214" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#4a4a4a">dólar · euro</text><line x1="164" y1="80" x2="316" y2="80" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,3"/><line x1="120" y1="124" x2="120" y2="156" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,3"/><line x1="360" y1="124" x2="360" y2="156" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,3"/><line x1="164" y1="200" x2="316" y2="200" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,3"/><line x1="160" y1="120" x2="320" y2="160" stroke="#1a1a1a" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/><line x1="320" y1="120" x2="160" y2="160" stroke="#1a1a1a" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/></svg><div class="markets-caption">Os 4 mercados de Murphy — todos se conectam.</div></div><h3 class="h-sub">Relações clássicas</h3><div class="info-card blue"><h4>Bonds × Ações</h4><p>Juros sobem → bonds caem e ações sofrem. Juros caem → ambos sobem.</p></div><div class="info-card gold"><h4>Dólar × Commodities</h4><p>Dólar fraco → commodities sobem (precificadas em dólar). Quase sempre inversa.</p></div><div class="info-card green"><h4>Commodities × Bonds</h4><p>Commodities subindo → inflação → juros sobem → bonds caem.</p></div><div class="info-card red"><h4>Ações × Commodities (ciclo)</h4><p>Início do ciclo: ações lideram. Fim do ciclo: commodities lideram.</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Princípios principais</h2><div class="body-text"><h3 class="h-sub">Análise top-down</h3><p>Comece pelo mensal (macro), desça para semanal, diário e por último intraday. <strong>Nunca o contrário.</strong></p><h3 class="h-sub">Combinação de ferramentas</h3><div class="info-card"><ul><li>Tendências (Dow)</li><li>Suporte / resistência</li><li>Médias móveis</li><li>Padrões de candlestick</li><li>Indicadores (RSI, MACD)</li><li>Volume</li><li>Análise intermercados</li></ul></div><p>Nenhuma ferramenta isolada vale. <strong>Confluência</strong> é a palavra-chave.</p><h3 class="h-sub">Setor rotation</h3><div class="info-card purple"><h4>Sequência típica do ciclo</h4><ul><li><strong>Fundo:</strong> bonds lideram</li><li><strong>Recuperação:</strong> tecnologia, consumo discrecionário</li><li><strong>Meio:</strong> industriais, materiais</li><li><strong>Fim do ciclo:</strong> energia, commodities, ouro</li><li><strong>Topo:</strong> defensivos (utilities, healthcare)</li></ul></div></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section">Conexão com o curso do Vasco</h2><div class="body-text"><div class="info-card blue"><h4>"O todo é o que importa"</h4><p>O princípio de confluência do Vasco é o eixo da metodologia de Murphy.</p></div><div class="info-card gold"><h4>Análise top-down</h4><p>"Plano traçado no diário, se não está bom nem desce" é releitura direta do top-down.</p></div><div class="info-card green"><h4>Confirmação por índices</h4><p>"Uma ação confirmada por um índice é mais forte" — princípio intermercados.</p></div><div class="info-card red"><h4>Importância do fechamento</h4><p>"Rompimento = fechamento; violação = só sombra" — Murphy + Dow.</p></div></div><div class="dots br small"></div></section><section class="page"><div class="dots tl small"></div><h2 class="title-mono h-section">Curiosidades</h2><div class="body-text"><p><strong>Mais de 500 mil cópias vendidas.</strong> Só nos EUA.</p><p><strong>Traduzido em 12+ idiomas.</strong> Português, espanhol, italiano, alemão, japonês, chinês, russo...</p><p><strong>Pioneiro em análise técnica na TV.</strong> 7 anos na CNBC normalizaram o tema.</p><p><strong>StockCharts.com.</strong> Plataforma com milhões de usuários onde ele atua até hoje.</p><p><strong>Aprendeu sozinho.</strong> Não existia curso. Estudou Edwards & Magee, Dow, e foi sistematizando.</p><p><strong>Murphy × Nison.</strong> Nison trouxe o candle ao Ocidente. Murphy levou a AT ocidental ao mundo.</p></div><div class="corner br"></div></section><section class="page"><div class="corner tl"></div><h2 class="title-mono h-section" style="text-align:center">Conclusão</h2><div class="body-text" style="max-width:760px;margin:0 auto"><p>Murphy é o autor mais influente da análise técnica ocidental moderna. Base de gerações de analistas, incluindo o Vasco Mamede.</p><div class="info-card blue"><h4>1. Top-down</h4><p>Sempre macro → micro. Nunca o contrário.</p></div><div class="info-card gold"><h4>2. Confluência</h4><p>O EDGE está na combinação inteligente.</p></div><div class="info-card green"><h4>3. Intermercados</h4><p>Ações, bonds, dólar e commodities conversam.</p></div><div class="info-card red"><h4>4. Setor rotation</h4><p>Setor certo no momento certo.</p></div><p style="text-align:center;margin-top:28px;font-style:italic;color:var(--muted)">Análise técnica não é prever o futuro — é ler o presente com mais ferramentas que a maioria.</p></div><div class="dots br"></div></section><section class="page"><div class="dots tl"></div><div class="corner tl"></div><h2 class="title-mono h-section">Contato</h2><div class="contact-block"><p><strong>insta:</strong> pedrooscar1708</p><p><strong>email:</strong> pedrooscar1708@gmail.com</p><p><strong>telefone:</strong> (11) 96342-6694</p></div><div class="credit-box"><strong>Trabalho realizado com auxílio do Claude (Anthropic)</strong> — IA usada para pesquisa e organização. Conteúdo baseado em fontes públicas sobre a obra de John J. Murphy, cruzadas com referências do curso do <strong>Vasco Mamede</strong>.</div><div class="corner br"></div></section><div style="height:40px"></div></body></html></script>
